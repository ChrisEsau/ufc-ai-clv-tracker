name: Research Hierarchical V5 Method Bet Structure
on:
  pull_request:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths:
      - 'pipeline/research/analyze_hierarchical_v5_method_bet_structure.py'
      - '.github/workflows/research-hierarchical-v5-method-bet-structure.yml'
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.16'}
      - name: Install packages
        run: pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6
      - name: Analyze 2021-2024 OOF betting structure
        run: python -m pipeline.research.analyze_hierarchical_v5_method_bet_structure
      - uses: actions/upload-artifact@v4
        with:
          name: hierarchical-v5-method-bet-structure
          path: |
            data/research/prop_mispricing/xgboost_method_hierarchical_v5_bet_structure.csv
            data/research/prop_mispricing/xgboost_method_hierarchical_v5_bet_structure.json
