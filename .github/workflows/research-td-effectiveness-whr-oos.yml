name: Research TD Effectiveness WHR OOS

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - pipeline/research/td_effectiveness_whr_oos.py
      - .github/workflows/research-td-effectiveness-whr-oos.yml

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run TD WHR OOS prototype
        run: python -m pipeline.research.td_effectiveness_whr_oos
      - uses: actions/upload-artifact@v4
        with:
          name: td-effectiveness-whr-oos
          path: data/diagnostics/td_effectiveness_whr_oos/
