name: Research XGBoost Method Hierarchical V5 Holdout Betting

on:
  workflow_dispatch:
  push:
    branches:
      - research/ufc-prop-mispricing-xgboost-20260829
    paths:
      - .github/workflows/research-xgboost-method-hierarchical-v5-holdout-betting.yml
      - pipeline/research/xgboost_method_hierarchical_v5_holdout_betting.py

permissions:
  contents: write

jobs:
  holdout-betting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6 xgboost==3.2.0 scikit-learn==1.9.0 scipy==1.17.1
      - name: Run frozen 2025-2026 holdout betting test
        run: python -m pipeline.research.xgboost_method_hierarchical_v5_holdout_betting
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/research/prop_mispricing/xgboost_method_hierarchical_v5_holdout_2025_2026_predictions.csv \
            data/research/prop_mispricing/xgboost_method_hierarchical_v5_holdout_2025_2026_betting_ledger.csv \
            data/research/prop_mispricing/xgboost_method_hierarchical_v5_holdout_2025_2026_betting_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "research: add hierarchical V5 2025-2026 holdout results"
          for i in 1 2 3 4 5; do
            git fetch origin research/ufc-prop-mispricing-xgboost-20260829
            git rebase origin/research/ufc-prop-mispricing-xgboost-20260829 || { git rebase --abort; sleep 2; continue; }
            git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829 && exit 0
            sleep 3
          done
          exit 1
