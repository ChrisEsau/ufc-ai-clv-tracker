name: Research DraftKings Jul-Aug 2026 Replay Inventory

on:
  workflow_dispatch:
  push:
    branches:
      - research/ufc-prop-mispricing-xgboost-20260829
    paths:
      - .github/workflows/research-draftkings-jul-aug-2026-replay-inventory.yml
      - pipeline/research/draftkings_jul_aug_2026_replay_inventory.py

permissions:
  contents: write

jobs:
  replay-inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1 pyyaml requests numpy joblib scikit-learn
      - run: python -m pipeline.research.draftkings_jul_aug_2026_replay_inventory
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/research/prop_mispricing/draftkings_jul_aug_2026_replayed_catalog.csv \
            data/research/prop_mispricing/draftkings_jul_aug_2026_replay_inventory_summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: add DraftKings Jul-Aug 2026 replay inventory outputs'
          git pull --rebase origin research/ufc-prop-mispricing-xgboost-20260829
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
