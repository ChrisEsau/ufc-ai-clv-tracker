name: Research V5 Logit Residual ROI Diagnostic
on:
  push:
    paths:
      - 'data/research/prop_mispricing/v5_logit_residual_roi_trigger.txt'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6
      - name: Restore exact V5 feature snapshot
        run: git checkout 7df1b61126be1f4e036b256d1c774c531b8a281f -- data/features/moneyline_feature_view.parquet
      - name: Run ROI diagnostic
        run: python pipeline/research/v5_logit_residual_roi_diagnostic.py
      - name: Commit outputs
        run: |
          git restore --source=HEAD -- data/features/moneyline_feature_view.parquet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/research/prop_mispricing/v5_logit_residual_roi_deciles.csv data/research/prop_mispricing/v5_logit_residual_roi_top_tails.csv data/research/prop_mispricing/v5_logit_residual_roi_thresholds.csv data/research/prop_mispricing/v5_logit_residual_roi_top20_by_year.csv data/research/prop_mispricing/v5_logit_residual_roi_ledger.csv data/research/prop_mispricing/v5_logit_residual_roi_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "Add V5 logit residual ROI diagnostic results"
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
