name: Run Backtest Bet Profile Audit

on:
  workflow_dispatch:
    inputs:
      backtest_dir:
        description: "Backtest artifact directory"
        required: true
        default: "data/model_lab/backtests/moneyline_xgboost_v11_moneyline_full_20260623_220808"
      output_root:
        description: "Audit output root"
        required: false
        default: "data/research/backtest_bet_audit"
      train_end_year:
        description: "Last in-sample training year"
        required: false
        default: "2022"
      validation_year:
        description: "Validation year"
        required: false
        default: "2023"
      top_n:
        description: "Rows to include in top bet exports"
        required: false
        default: "100"

permissions:
  contents: read

jobs:
  run-backtest-bet-profile-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas pyarrow

      - name: Run Backtest Bet Profile Audit
        run: |
          python -m pipeline.research.underdog_analysis.run_backtest_bet_profile_audit \
            --backtest-dir "${{ github.event.inputs.backtest_dir }}" \
            --output-root "${{ github.event.inputs.output_root }}" \
            --train-end-year "${{ github.event.inputs.train_end_year }}" \
            --validation-year "${{ github.event.inputs.validation_year }}" \
            --top-n "${{ github.event.inputs.top_n }}"

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-bet-profile-audit
          path: ${{ github.event.inputs.output_root }}
