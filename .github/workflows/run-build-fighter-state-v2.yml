name: Run Build Fighter State V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-fighter-state-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-fighter-state-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-workspace.txt

      - name: Build fighter-state artifacts
        run: |
          python -m pipeline.features.run_build_fighter_state

      - name: Build RFS fighter-state artifacts
        run: |
          python -m pipeline.round_stats.build_round_fighter_state
          python -m pipeline.round_stats.build_round_fighter_suppression
          python -m pipeline.round_stats.build_round_fighter_wrestling
          python -m pipeline.round_stats.build_round_fighter_defense

      - name: Commit fighter-state artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/features/fighter_state_history.parquet \
            data/features/latest_fighter_state.parquet \
            data/features/round_fighter_state_history.parquet \
            data/features/round_latest_fighter_state.parquet \
            data/features/round_fighter_suppression_p0_2_history.parquet \
            data/features/round_latest_fighter_suppression_p0_2.parquet \
            data/features/round_fighter_wrestling_p0_3_history.parquet \
            data/features/round_latest_fighter_wrestling_p0_3.parquet \
            data/features/round_fighter_defense_p1_4_history.parquet \
            data/features/round_latest_fighter_defense_p1_4.parquet \
            data/audits/round_fighter_state_p0_1_validation.parquet \
            data/audits/round_fighter_wrestling_p0_3_validation.parquet \
            data/audits/round_fighter_defense_p1_4_validation.parquet

          git commit -m "Update fighter state artifacts" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
