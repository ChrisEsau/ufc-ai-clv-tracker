name: Research Inspect Market Parquet Odds
on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths:
      - 'pipeline/research/inspect_market_parquet_odds.py'
      - '.github/workflows/research-inspect-market-parquet-odds.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - run: |
          pip install pandas==3.0.5 pyarrow==25.0.1
          python -m pipeline.research.inspect_market_parquet_odds
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/research/prop_mispricing/market_parquet_odds_inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: add market parquet odds inventory'
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
