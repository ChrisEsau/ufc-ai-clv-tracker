name: Research V5 Index Actuals Display

on:
  push:
    branches:
      - research/ufc-prop-mispricing-xgboost-20260829
    paths:
      - data/research/prop_mispricing/v5_index_actuals_trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas pyarrow
      - name: Build readable fight summary
        run: |
          python - <<'PY'
          import pandas as pd
          p='data/research/prop_mispricing/v5_draftkings_index_latest_by_fight.csv'
          m='data/master/ufc_master.parquet'
          out='data/research/prop_mispricing/v5_draftkings_index_fight_summary_actuals.csv'
          x=pd.read_csv(p)
          master=pd.read_parquet(m)[['fight_id','winner']].drop_duplicates('fight_id')
          x=x.merge(master,on='fight_id',how='left')
          rows=[]
          for (fid,date,event),g in x.groupby(['fight_id','date','event_name'],sort=False):
              g=g.sort_values('orientation_side')
              a=g.iloc[0]; b=g.iloc[1]
              pos=g.loc[g['edge'].idxmax()]
              rows.append({
                  'date':date,'event_name':event,'fight_id':fid,
                  'fighter_1':a.fighter_name,'odds_1':int(a.american_odds),'fair_implied_1':a.fair_market_p,'v5_1':a.v5_model_p,'edge_1':a.edge,
                  'fighter_2':b.fighter_name,'odds_2':int(b.american_odds),'fair_implied_2':b.fair_market_p,'v5_2':b.v5_model_p,'edge_2':b.edge,
                  'actual_winner':a.winner,'v5_positive_edge_side':pos.fighter_name,'v5_positive_edge':pos.edge,
                  'v5_pick':g.loc[g.v5_model_p.idxmax(),'fighter_name'],
              })
          o=pd.DataFrame(rows).sort_values(['date','event_name','fight_id'])
          o.to_csv(out,index=False)
          print(o.to_csv(index=False))
          PY
      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/research/prop_mispricing/v5_draftkings_index_fight_summary_actuals.csv
          git diff --cached --quiet && exit 0
          git commit -m "Add V5 DraftKings fight summary with actuals"
          git pull --rebase origin research/ufc-prop-mispricing-xgboost-20260829
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
