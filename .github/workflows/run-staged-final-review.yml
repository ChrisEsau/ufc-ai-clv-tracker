name: Run Staged Final Review

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-staged-final-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow

      - name: Run staged final review
        run: |
          python -m pipeline.data_maintenance.run_staged_final_review

      - name: Commit staged final review output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/audits/ufc_staged_final_review.parquet

          git commit -m "Update staged final review artifact" || echo "No changes to commit"

          git push
