name: Research Hierarchical V5 Market Intelligence
# trigger: grade all scored market-intelligence bets

on:
  workflow_dispatch:
  push:
    branches:
      - research/ufc-prop-mispricing-xgboost-20260829
    paths:
      - .github/workflows/research-hierarchical-v5-market-intelligence.yml
      - pipeline/research/grade_hierarchical_v5_market_intelligence.py

permissions:
  contents: write

jobs:
  grade-all-events:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install environment
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6
      - name: Grade all matched bets
        run: python -m pipeline.research.grade_hierarchical_v5_market_intelligence
      - name: Commit grading outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/research/prop_mispricing/hierarchical_v5_market_intelligence_graded_bets.csv \
            data/research/prop_mispricing/hierarchical_v5_market_intelligence_ungraded_bets.csv \
            data/research/prop_mispricing/hierarchical_v5_market_intelligence_grading_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "research: add hierarchical V5 market intelligence grading"
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
