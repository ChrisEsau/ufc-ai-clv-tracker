name: Research Hierarchical V5 Market Intelligence
# trigger: all market-intelligence events

on:
  workflow_dispatch:
  push:
    branches:
      - research/ufc-prop-mispricing-xgboost-20260829
    paths:
      - .github/workflows/research-hierarchical-v5-market-intelligence.yml
      - pipeline/research/run_hierarchical_v5_market_intelligence.py

permissions:
  contents: write

jobs:
  score-all-events:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install \
            pandas==3.0.5 \
            pyarrow==25.0.1 \
            numpy==2.4.6 \
            scikit-learn==1.9.0 \
            scipy==1.17.1 \
            xgboost==3.2.0 \
            joblib==1.5.3 \
            threadpoolctl==3.6.0 \
            python-dateutil==2.9.0.post0

      - name: Score every complete fight in market intelligence parquet
        run: |
          python -m pipeline.research.run_hierarchical_v5_market_intelligence

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/research/prop_mispricing/hierarchical_v5_market_intelligence_predictions.csv \
            data/research/prop_mispricing/hierarchical_v5_market_intelligence_bets.csv \
            data/research/prop_mispricing/hierarchical_v5_market_intelligence_unscored.csv \
            data/research/prop_mispricing/hierarchical_v5_market_intelligence_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "research: add hierarchical V5 market intelligence results"
          for i in 1 2 3 4 5; do
            git fetch origin research/ufc-prop-mispricing-xgboost-20260829
            git rebase origin/research/ufc-prop-mispricing-xgboost-20260829 || { git rebase --abort; sleep 2; continue; }
            git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829 && exit 0
            sleep 3
          done
          exit 1
