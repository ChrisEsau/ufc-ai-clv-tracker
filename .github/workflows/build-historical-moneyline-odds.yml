name: Build Historical Moneyline Odds

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: "Legacy CSV path in repo"
        required: true
        default: "ufc-master w odds.csv"

permissions:
  contents: write

concurrency:
  group: build-historical-moneyline-odds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-historical-moneyline-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow

      - name: Build historical moneyline odds
        run: |
          python -m pipeline.market.run_build_historical_moneyline_odds \
            --input-path "${{ github.event.inputs.input_path }}"

      - name: Commit historical odds artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/market/historical_moneyline_odds.parquet \
            data/audits/ufc_historical_odds_mapping_audit.parquet

          git commit -m "Update historical moneyline odds artifacts" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
