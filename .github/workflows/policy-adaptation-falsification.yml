name: Event Clock V2 Policy Adaptation Falsification

on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - pipeline/simulation/event_clock_mc_v2/diagnostics/policy_learnability.py
      - pipeline/simulation/event_clock_mc_v2/diagnostics/policy_adaptation_falsification.py
      - .github/workflows/policy-adaptation-falsification.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scikit-learn

      - name: Restore canonical research data
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Validate inputs and compile diagnostic
        run: |
          test -f data/fight_details/ufc_round_stats.parquet
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/policy_learnability.py
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/policy_adaptation_falsification.py
          mkdir -p data/diagnostics/event_clock_mc_v2/policy_adaptation_falsification

      - name: Run persistence-vs-adaptation falsification
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.policy_adaptation_falsification \
            2>&1 | tee /tmp/policy_adaptation_falsification.log

      - name: Print diagnostic log
        if: always()
        run: cat /tmp/policy_adaptation_falsification.log || true

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-policy-adaptation-falsification
          path: |
            data/diagnostics/event_clock_mc_v2/policy_adaptation_falsification/*.csv
            data/diagnostics/event_clock_mc_v2/policy_adaptation_falsification/*.json
          if-no-files-found: warn
