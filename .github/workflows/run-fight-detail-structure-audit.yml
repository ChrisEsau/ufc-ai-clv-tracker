name: Run Fight Detail Structure Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-fight-detail-structure-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow

      - name: Run fight detail structure audit
        run: |
          python run_fight_detail_structure_audit.py

      - name: Commit fight detail structure audit outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add \
            ufc_fight_detail_structure_audit.parquet \
            ufc_fight_detail_raw_sample.parquet

          git commit -m "Update fight detail structure audit artifacts" || echo "No changes to commit"

          git push
