name: Run UFCStats Fight Detail Scrape

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-ufcstats-fight-detail-scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Google Chrome
        run: |
          sudo apt-get update -qq
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow requests beautifulsoup4 selenium webdriver-manager lxml

      - name: Run fight detail scrape
        run: |
          python -m pipeline.data_maintenance.run_ufcstats_fight_detail_scrape

      - name: Commit fight detail outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add \
            data/staging/ufc_staged_fight_details.parquet \
            data/audits/ufc_fight_detail_scrape_audit.parquet

          git commit -m "Update staged fight detail artifacts" || echo "No changes to commit"

          git push
