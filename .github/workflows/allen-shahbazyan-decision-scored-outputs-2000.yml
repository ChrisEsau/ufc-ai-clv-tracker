name: Allen Shahbazyan Decision Scored Outputs 2000

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - pipeline/research/allen_shahbazyan_decision_scored_outputs_2000.py
      - .github/workflows/allen-shahbazyan-decision-scored-outputs-2000.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            config
            configs
            data/master
            data/fight_details
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow scipy scikit-learn pyyaml
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Run scored decision output diagnostic
        run: |
          set -euo pipefail
          cp -a restored/canonical-weight-class-state/. data/
          python -m pipeline.research.allen_shahbazyan_decision_scored_outputs_2000 | tee allen-shahbazyan-decision-scored-outputs-2000.txt
      - uses: actions/upload-artifact@v4
        with:
          name: allen-shahbazyan-decision-scored-outputs-2000-${{ github.run_id }}
          path: |
            allen-shahbazyan-decision-scored-outputs-2000.txt
            data/research/allen_shahbazyan_decision_scored_outputs_2000/
