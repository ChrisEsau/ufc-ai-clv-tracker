name: Run Underdog Audit Research

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model ID to audit"
        required: true
        default: "moneyline_xgboost_v11"
      market_key:
        description: "Market key"
        required: true
        default: "moneyline"
      min_edge:
        description: "Minimum model edge"
        required: true
        default: "0.0"
      min_confidence:
        description: "Minimum model confidence"
        required: true
        default: "0.0"
      min_odds:
        description: "Minimum American odds"
        required: true
        default: "-1000"
      max_odds:
        description: "Maximum American odds"
        required: true
        default: "3000"
      start_date:
        description: "Optional start date YYYY-MM-DD"
        required: false
        default: ""
      end_date:
        description: "Optional end date YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: underdog-audit-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-underdog-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas pyarrow

      - name: Run underdog audit research
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --start-date ${{ github.event.inputs.start_date }}"
          fi
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --end-date ${{ github.event.inputs.end_date }}"
          fi

          python -m pipeline.research.underdog_analysis.run_underdog_audit \
            --model-id "${{ github.event.inputs.model_id }}" \
            --market-key "${{ github.event.inputs.market_key }}" \
            --min-edge "${{ github.event.inputs.min_edge }}" \
            --min-confidence "${{ github.event.inputs.min_confidence }}" \
            --min-odds "${{ github.event.inputs.min_odds }}" \
            --max-odds "${{ github.event.inputs.max_odds }}" \
            $EXTRA_ARGS

      - name: Upload underdog audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: underdog-audit-research
          path: |
            data/research/underdog_audit/**
          if-no-files-found: error

      - name: Commit research artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/research/underdog_audit/
          git commit -m "Update underdog audit research artifacts" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
