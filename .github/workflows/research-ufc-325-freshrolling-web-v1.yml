name: Research UFC 325 FreshRolling Web V1
on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-ufc-325-freshrolling-web-v1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow numpy scikit-learn xgboost pyyaml requests beautifulsoup4 lxml
      - name: Parse archived board and score UFC 325
        run: |
          python - <<'PY'
          import ast,json,re,unicodedata
          from pathlib import Path
          import pandas as pd, requests
          from bs4 import BeautifulSoup

          DATE='2026-01-31'
          OUT=Path('data/research/prop_mispricing'); OUT.mkdir(parents=True,exist_ok=True)
          H={'User-Agent':'Mozilla/5.0'}
          BOOK_NAMES={21:'FanDuel',24:'Caesars',25:'BetRivers',20:'BetWay',26:'Unibet',23:'BetMGM'}
          PREFERRED=[21,24,25,23,20,26]
          def norm(s):
            return ' '.join(''.join(ch for ch in unicodedata.normalize('NFKD',str(s)) if not unicodedata.combining(ch)).lower().replace('’',"'").replace('-',' ').split())
          def method_key(x):
            s=str(x).lower()
            if 'submission' in s:return 'win_by_submission'
            if 'decision' in s:return 'win_by_decision'
            if 'ko/tko' in s or 'tko' in s or re.search(r'\bko\b',s):return 'win_by_ko_tko_dq'
            raise RuntimeError('Unknown method '+str(x))
          def odd_from_cell(td):
            for sp in td.find_all('span'):
              t=sp.get_text(strip=True).replace('−','-')
              if re.fullmatch(r'[+-]\d+',t):return int(t)
            return None
          def cell_book(td):
            x=td.get('data-li')
            if not x:return None
            try:return int(json.loads(x)[0])
            except Exception:return None
          def prices(rr):
            z={}
            for td in rr.find_all('td'):
              b=cell_book(td); o=odd_from_cell(td)
              if b is not None and o is not None:z[b]=o
            return z

          # Find BFO archive page(s) containing UFC 325 fighters.
          pages=[]
          for i in range(3960,4026):
            u=f'https://www.bestfightodds.com/events/ufc-{i}'
            try:t=requests.get(u,headers=H,timeout=15).text
            except Exception:continue
            low=t.lower()
            if 'volkanovski' in low and 'diego lopes' in low:
              pages.append((u,t))
          if not pages:raise RuntimeError('No BFO UFC 325 archive page found')
          print('BFO pages', [u for u,_ in pages])

          candidates=[]
          for url,html in pages:
            soup=BeautifulSoup(html,'lxml')
            for ti,table in enumerate(soup.find_all('table')):
              rows=table.find_all('tr'); fighter_rows=[]
              for i,tr in enumerate(rows):
                links=[a for a in tr.find_all('a',href=True) if '/fighters/' in a['href']]
                if links and 'pr' not in (tr.get('class') or []):fighter_rows.append((i,' '.join(links[-1].get_text(' ',strip=True).split()),tr))
              j=0
              while j+1<len(fighter_rows):
                i1,f1,r1=fighter_rows[j]; i2,f2,r2=fighter_rows[j+1]; end=fighter_rows[j+2][0] if j+2<len(fighter_rows) else len(rows)
                ml1,ml2=prices(r1),prices(r2); props={}
                for tr in rows[i2+1:end]:
                  if 'pr' not in (tr.get('class') or []):continue
                  th=tr.find('th')
                  if not th:continue
                  label=' '.join(th.get_text(' ',strip=True).split()); lk=None
                  if label.endswith(' wins by TKO/KO'):lk='ko'
                  elif label.endswith(' wins by submission'):lk='sub'
                  elif label.endswith(' wins by decision'):lk='dec'
                  if not lk:continue
                  prefix=norm(label.rsplit(' wins by ',1)[0]); n1,n2=norm(f1),norm(f2)
                  if prefix and prefix in n1 and prefix not in n2:side=1
                  elif prefix and prefix in n2 and prefix not in n1:side=2
                  else:continue
                  for td in tr.find_all('td'):
                    b=cell_book(td); o=odd_from_cell(td)
                    if b is not None and o is not None:props[(b,side,lk)]=o
                complete=[book for book in set(ml1)&set(ml2) if all((book,side,k) in props for side in [1,2] for k in ['ko','sub','dec'])]
                if complete:candidates.append({'url':url,'table':ti,'f1':f1,'f2':f2,'ml1':ml1,'ml2':ml2,'props':props,'complete':complete})
                j+=2
          grouped={}
          for b in candidates:
            key=tuple(sorted([norm(b['f1']),norm(b['f2'])])); score=(21 in b['complete'],len(b['complete']),len(b['props']))
            if key not in grouped or score>grouped[key][0]:grouped[key]=(score,b)
          clean=[v[1] for v in grouped.values()]
          print('complete archived bouts',len(clean),[(x['f1'],x['f2'],x['complete']) for x in clean])

          # Official result identity comes from master only for grading AFTER prediction.
          master=pd.read_parquet('data/master/ufc_master.parquet').copy(); master['date']=pd.to_datetime(master.date)
          actual=master[master.date.eq(pd.Timestamp(DATE))].copy()
          actual_map={frozenset((norm(r.r_name),norm(r.b_name))):r for _,r in actual.iterrows()}
          boards={}; sources=[]
          for b in clean:
            key=frozenset((norm(b['f1']),norm(b['f2'])))
            if key not in actual_map:continue
            r=actual_map[key]; book=next((x for x in PREFERRED if x in b['complete']),b['complete'][0])
            winner=str(r.winner); win=(winner,method_key(r.method))
            boards[(b['f1'],b['f2'])]={'ml':{b['f1']:b['ml1'][book],b['f2']:b['ml2'][book]},'m':{b['f1']:[b['props'][(book,1,'ko')],b['props'][(book,1,'sub')],b['props'][(book,1,'dec')]],b['f2']:[b['props'][(book,2,'ko')],b['props'][(book,2,'sub')],b['props'][(book,2,'dec')]]},'win':win}
            sources.append({'fighter_a':b['f1'],'fighter_b':b['f2'],'book_id':book,'book':BOOK_NAMES.get(book,f'BFO_book_{book}'),'source_url':b['url']})
          if not boards:raise RuntimeError('No complete UFC325 boards matched master results')
          pd.DataFrame(sources).to_csv(OUT/'ufc_325_market_sources_v1.csv',index=False)
          print('MATCHED BOARDS',len(boards)); [print(k,v) for k,v in sorted(boards.items())]

          # Reuse the exact frozen fresh-rolling scorer from UFC 324, changing only date/board/output/count.
          src=Path('.github/workflows/research-ufc-324-fresh-rolling-score-v1.yml').read_text()
          m=re.search(r"python - <<'PY'\n(.*?)\n          PY",src,re.S)
          if not m:raise RuntimeError('Could not extract frozen UFC324 freshrolling scorer')
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in m.group(1).splitlines())
          code=code.replace("DATE=pd.Timestamp('2026-01-24')",f"DATE=pd.Timestamp('{DATE}')")
          code=re.sub(r"boards=\{.*?\n          \}\n          boardmap",'boards='+repr(boards)+'\n          boardmap',code,count=1,flags=re.S)
          n=len(boards)
          code=code.replace("if len(card)!=11: raise RuntimeError(f'Expected 11 fresh rolling UFC324 rows, got {len(card)}: '+str(card[[c for c in ['fight_id','r_name','b_name'] if c in card]].to_dict('records')))","if len(card)!=%d: raise RuntimeError(f'Expected %d fresh rolling UFC325 rows, got {len(card)}: '+str(card[[c for c in ['fight_id','r_name','b_name'] if c in card]].to_dict('records')))"%(n,n))
          code=code.replace('ufc_324_moneyline_freshrolling_v1.csv','ufc_325_moneyline_freshrolling_v1.csv').replace('ufc_324_method_freshrolling_v1.csv','ufc_325_method_freshrolling_v1.csv')
          exec(compile(code,'<ufc325_freshrolling_frozen>','exec'),{})
          PY
      - name: Commit UFC 325 scores
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f data/research/prop_mispricing/ufc_325_*_v1.csv
          git commit -m 'research: add UFC 325 frozen freshrolling scores' || echo No-changes
          git pull --rebase origin research/ufc-prop-mispricing-xgboost-20260829 || true
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
