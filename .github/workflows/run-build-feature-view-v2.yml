name: Run Build Feature View V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feature-view-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-workspace.txt
      - run: |
          python -m pipeline.features.run_build_feature_view --config configs/feature_views/moneyline_base.yaml
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f data/features/moneyline_feature_view.parquet
          git commit -m "Update moneyline feature view" || echo "No changes"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
