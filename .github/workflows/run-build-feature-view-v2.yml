name: Run Build Feature View V2

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: "Feature view config path"
        required: false
        default: configs/feature_views/moneyline_base.yaml
      output_path:
        description: "Output parquet path to commit"
        required: false
        default: data/features/moneyline_feature_view.parquet

permissions:
  contents: write

jobs:
  build-feature-view-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-workspace.txt

      - name: Build feature view
        run: |
          python -m pipeline.features.run_build_feature_view \
            --config "${{ inputs.config_path }}"

      - name: Commit feature view artifact
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f "${{ inputs.output_path }}"

          git commit -m "Update feature view artifact" || echo "No changes"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
