name: Research V5 Residual Calibration

on:
  push:
    paths:
      - 'data/research/prop_mispricing/v5_residual_calibration_trigger.txt'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 numpy==2.4.6 scipy==1.17.1
      - name: Run residual calibration study
        run: python pipeline/research/v5_residual_calibration.py
      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/research/prop_mispricing/v5_residual_calibration_summary.json \
            data/research/prop_mispricing/v5_residual_calibration_folds.csv \
            data/research/prop_mispricing/v5_residual_calibration_chrono_oof.csv \
            data/research/prop_mispricing/v5_residual_calibration_2025_to_20260328.csv \
            data/research/prop_mispricing/v5_residual_calibration_buckets.csv
          git diff --cached --quiet && exit 0
          git commit -m "Add frozen V5 residual calibration results"
          for i in 1 2 3 4 5; do
            git fetch origin research/ufc-prop-mispricing-xgboost-20260829
            git rebase origin/research/ufc-prop-mispricing-xgboost-20260829 || { git rebase --abort; sleep 2; continue; }
            git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829 && exit 0
            sleep 3
          done
          exit 1
