name: Simulator Joint Strike Pace Replay

on:
  workflow_dispatch:
  push:
    branches:
      - feature/round-fight-simulator-v0
    paths:
      - ".github/workflows/run-simulation-sig-attempt-joint-replay.yml"
      - "pipeline/simulation/sig_attempt_joint_replay.py"
      - "pipeline/simulation/run_replay_joint_sig_attempt_distribution.py"
      - "pipeline/simulation/sig_attempt_calibration.py"
      - "pipeline/simulation/run_calibrate_sig_attempt_model.py"
      - "pipeline/simulation/sig_attempt_model.py"
      - "pipeline/simulation/run_train_sig_attempt_model.py"
      - "pipeline/simulation/artifacts.py"
      - "tests/test_simulation_sig_attempt_joint_replay.py"

permissions:
  contents: read

jobs:
  replay-joint-strike-pace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout simulator branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run joint replay tests
        run: |
          python -m unittest tests.test_simulation_sig_attempt_joint_replay
          python -m unittest tests.test_simulation_sig_attempt_replay
          python -m unittest tests.test_simulation_sig_attempt_calibration
          python -m compileall -q pipeline/simulation

      - name: Build leakage-safe fighter-round table
        run: |
          python -m pipeline.simulation.run_build_training_dataset

      - name: Rebuild walk-forward strike benchmark
        run: |
          python -m pipeline.simulation.run_train_sig_attempt_model

      - name: Rebuild sequential calibration
        run: |
          python -m pipeline.simulation.run_calibrate_sig_attempt_model

      - name: Replay joint strike pace distribution
        run: |
          python -m pipeline.simulation.run_replay_joint_sig_attempt_distribution

      - name: Publish joint replay summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/model_lab/simulation/models/sig_attempt_pace_v0/"
              "joint_replay/joint_replay_summary.json"
          )
          summary = json.loads(path.read_text(encoding="utf-8"))

          with Path("sig_attempt_joint_replay_summary.md").open("w", encoding="utf-8") as handle:
              handle.write("# Joint significant-strike pace replay\n\n")
              handle.write(
                  f"- Final Gaussian-copula rho: **{summary['final_gaussian_copula_rho']:.4f}**\n"
              )
              handle.write(f"- Pairs: **{summary['pairs']:,}**\n")
              handle.write(
                  "- Independent weighted correlation error: "
                  f"**{summary['independent_weighted_absolute_correlation_error']:.4f}**\n"
              )
              handle.write(
                  "- Copula weighted correlation error: "
                  f"**{summary['copula_weighted_absolute_correlation_error']:.4f}**\n"
              )
              handle.write(
                  "- Correlation error improvement: "
                  f"**{summary['correlation_error_improvement']:.2%}**\n\n"
              )
              handle.write("## Sequential dependence schedule\n\n")
              handle.write("| Year | Prior pairs | Current pairs | Rho | Source |\n")
              handle.write("|---:|---:|---:|---:|---|\n")
              for row in summary["dependence_schedule"]:
                  handle.write(
                      f"| {row['test_year']} | {row['prior_pairs']:,} | "
                      f"{row['current_pairs']:,} | {row['gaussian_copula_rho']:.4f} | "
                      f"{row['dependence_source']} |\n"
                  )
              handle.write("\n## Fight-round total coverage\n\n")
              handle.write("| Joint model | Nominal | Empirical | Error | Width |\n")
              handle.write("|---|---:|---:|---:|---:|\n")
              for row in summary["total_interval_summary"]:
                  handle.write(
                      f"| {row['joint_model']} | {row['nominal_coverage']:.0%} | "
                      f"{row['weighted_empirical_coverage']:.2%} | "
                      f"{row['weighted_coverage_error']:.2%} | "
                      f"{row['weighted_mean_interval_width']:.2f} |\n"
                  )
          PY

          cat sig_attempt_joint_replay_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload joint replay artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simulator-sig-attempt-joint-replay-v0
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: |
            data/model_lab/simulation/models/sig_attempt_pace_v0/**
            data/audits/simulation_fighter_round_training_audit.parquet
            sig_attempt_joint_replay_summary.md
