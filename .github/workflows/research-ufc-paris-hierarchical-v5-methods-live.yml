# trigger 2026-08-31 v8
name: Research UFC Paris Hierarchical V5 Methods Live

on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-ufc-paris-hierarchical-v5-methods-live.yml]
  pull_request:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths:
      - .github/workflows/research-ufc-paris-hierarchical-v5-methods-live.yml
      - pipeline/research/score_ufc_paris_hierarchical_v5_live.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install frozen research packages
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6 scikit-learn==1.9.0 scipy==1.17.1 xgboost==3.2.0 joblib==1.5.3 threadpoolctl==3.6.0 python-dateutil==2.9.0.post0 requests==2.32.5
      - name: Run live Paris hierarchical V5 method scorer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pipeline/market/providers/draftkings_public.py')
          s=p.read_text()
          old_endpoint='EVENT_SUBCATEGORY_MARKETS_ENDPOINT = "/controldata/league/eventSubcategory/v1/markets"'
          new_endpoint='EVENT_SUBCATEGORY_MARKETS_ENDPOINT = "/controldata/event/eventSubcategory/v1/markets"'
          old_vars='"templateVars": subcategory_id,'
          new_vars='"templateVars": f"{event_id},{subcategory_id}",'
          if old_endpoint not in s or old_vars not in s:
              raise RuntimeError('expected DraftKings event-subcategory builder shape not found')
          s=s.replace(old_endpoint,new_endpoint).replace(old_vars,new_vars)
          p.write_text(s)
          PY
          python -m pipeline.research.score_ufc_paris_hierarchical_v5_live
      - uses: actions/upload-artifact@v4
        with:
          name: ufc-paris-hierarchical-v5-methods-20260831
          path: |
            data/research/prop_mispricing/ufc_paris_hierarchical_v5_methods_20260831.csv
            data/research/prop_mispricing/ufc_paris_draftkings_method_prices_20260831.csv
