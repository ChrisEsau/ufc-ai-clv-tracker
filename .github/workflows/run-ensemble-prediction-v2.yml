name: Run Ensemble Prediction V2

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: "Ensemble model config path"
        required: true
        default: "configs/models/moneyline_xgboost_v13_ensemble_top60.yaml"
      use_raw:
        description: "Use raw member probabilities"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      write_canonical:
        description: "Also write data/predictions/model_outcomes.parquet"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      build_betting_outcomes:
        description: "Build betting_outcomes.parquet after prediction"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      betting_model_mode:
        description: "Betting outcomes model mode"
        required: true
        default: "single"
        type: choice
        options:
          - "single"
          - "production"
          - "all"

permissions:
  contents: write

concurrency:
  group: ensemble-prediction-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-ensemble-prediction-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml scikit-learn==1.6.1 xgboost joblib pyarrow pandas numpy

      - name: Resolve model id
        run: |
          MODEL_ID=$(python - <<'PY'
          from pathlib import Path
          import yaml

          config_path = Path("${{ inputs.config_path }}")
          config = yaml.safe_load(config_path.read_text()) or {}
          print(config["model_id"])
          PY
          )
          echo "MODEL_ID=${MODEL_ID}" >> "$GITHUB_ENV"
          echo "Resolved MODEL_ID=${MODEL_ID}"

      - name: Build live card
        run: |
          python -m pipeline.prediction.run_build_live_card --all-upcoming

      - name: Run Ensemble Prediction V2
        run: |
          CMD="python -m pipeline.modeling.run_ensemble_prediction --config '${{ inputs.config_path }}'"

          if [ "${{ inputs.use_raw }}" = "true" ]; then
            CMD="$CMD --raw"
          fi

          if [ "${{ inputs.write_canonical }}" = "true" ]; then
            CMD="$CMD --write-canonical"
          fi

          echo "$CMD"
          eval "$CMD"

      - name: Build betting outcomes
        if: ${{ inputs.build_betting_outcomes == 'true' }}
        run: |
          python -m pipeline.betting.run_betting_outcomes_v2 \
            --model-mode "${{ inputs.betting_model_mode }}"

      - name: Commit ensemble prediction outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/predictions/ufc_live_card.parquet \
            data/predictions/live_model_features.parquet \
            data/predictions/by_model/${MODEL_ID}/model_outcomes.parquet \
            data/predictions/by_model/${MODEL_ID}/ensemble_details.parquet \
            data/predictions/by_model/${MODEL_ID}/ensemble_exclusions.parquet \
            data/audits/ufc_live_feature_audit.parquet

          if [ "${{ inputs.write_canonical }}" = "true" ]; then
            git add -f data/predictions/model_outcomes.parquet
          fi

          if [ "${{ inputs.build_betting_outcomes }}" = "true" ]; then
            git add -f \
              data/predictions/betting_outcomes.parquet \
              data/audits/ufc_betting_outcomes_audit.parquet
          fi

          git add -f data/predictions/selected_live_card_event.parquet 2>/dev/null || true
          git add -f data/audits/ufc_live_card_build_audit.parquet 2>/dev/null || true
          git add -f data/audits/ufc_live_card_rejected_rows.parquet 2>/dev/null || true

          git commit -m "Update ensemble prediction artifacts" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
