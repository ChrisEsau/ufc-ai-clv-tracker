name: Research V5 Logit Residual Diagnostic
on:
  push:
    paths:
      - 'data/research/prop_mispricing/v5_logit_residual_diagnostic_trigger.txt'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 numpy==2.4.6 scipy==1.17.1
      - name: Run diagnostic
        run: python pipeline/research/v5_logit_residual_diagnostic.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/research/prop_mispricing/v5_probability_vs_logit_residual_deciles.csv data/research/prop_mispricing/v5_probability_vs_logit_residual_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "Add V5 logit residual diagnostic results"
          git pull --rebase origin research/ufc-prop-mispricing-xgboost-20260829
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
