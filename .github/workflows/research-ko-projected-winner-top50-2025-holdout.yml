name: Research Frozen TOP50 KO 2025 Holdout

on:
  push:
    branches:
      - research/ko-method-edge-xgb-20260831
    paths:
      - 'pipeline/research/xgboost_ko_projected_winner_top50_2025_holdout.py'
      - '.github/workflows/research-ko-projected-winner-top50-2025-holdout.yml'
      - 'data/research/prop_mispricing/xgboost_ko_projected_winner_top50_freeze.json'
  workflow_dispatch:

jobs:
  top50-ko-2025-holdout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
        with:
          ref: research/ko-method-edge-xgb-20260831
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'

      - name: Install pinned V5 environment
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install \
            pandas==3.0.5 \
            pyarrow==25.0.1 \
            numpy==2.4.6 \
            scikit-learn==1.9.0 \
            scipy==1.17.1 \
            xgboost==3.2.0 \
            joblib==1.5.3 \
            threadpoolctl==3.6.0 \
            python-dateutil==2.9.0.post0

      - name: Materialize exact frozen V5 development snapshot inputs
        run: |
          git show 7df1b61126be1f4e036b256d1c774c531b8a281f:data/market/historical_market_outcomes.parquet > /tmp/v5_historical_market_outcomes.parquet
          git show 7df1b61126be1f4e036b256d1c774c531b8a281f:data/features/moneyline_feature_view.parquet > /tmp/v5_moneyline_feature_view.parquet

      - name: Run untouched calendar-2025 TOP50 KO holdout
        run: |
          python -m pipeline.research.xgboost_ko_projected_winner_top50_2025_holdout \
            --v5-market /tmp/v5_historical_market_outcomes.parquet \
            --v5-features /tmp/v5_moneyline_feature_view.parquet

      - name: Upload holdout outputs
        uses: actions/upload-artifact@v4
        with:
          name: frozen-top50-ko-2025-holdout
          path: |
            data/research/prop_mispricing/xgboost_ko_projected_winner_top50_2025_holdout_predictions.csv
            data/research/prop_mispricing/xgboost_ko_projected_winner_top50_2025_holdout_metrics.csv
            data/research/prop_mispricing/xgboost_ko_projected_winner_top50_2025_holdout_edge_ledger.csv
            data/research/prop_mispricing/xgboost_ko_projected_winner_top50_2025_holdout_summary.json
