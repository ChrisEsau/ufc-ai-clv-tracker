name: KO V3 Conditional KO History Priors

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - 'pipeline/research/ko_v3_conditional_ko_history_priors.py'
      - '.github/workflows/ko-v3-conditional-ko-history-priors.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            data/master
            data/fight_details
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas pyarrow scipy scikit-learn
      - name: Run evaluation
        run: |
          set -euo pipefail
          python -m pipeline.research.ko_v3_conditional_ko_history_priors | tee result.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ko-v3-conditional-ko-history-priors-${{ github.run_id }}
          path: |
            result.txt
            data/research/ko_v3_conditional_ko_history_priors/
          if-no-files-found: error
          retention-days: 30
