name: Run Append Row Match Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-append-row-match-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow

      - name: Run append row match validation
        run: |
          python run_append_row_match_validation.py

      - name: Commit row match validation output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add ufc_append_row_match_validation.parquet

          git commit -m "Update append row match validation artifact" || echo "No changes to commit"

          git push
