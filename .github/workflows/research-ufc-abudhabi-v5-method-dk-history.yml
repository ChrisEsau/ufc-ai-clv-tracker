name: Research UFC Abu Dhabi V5 Methods DK History
on:
  pull_request:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths:
      - 'pipeline/research/score_ufc_abudhabi_hierarchical_v5_dk_history.py'
      - '.github/workflows/research-ufc-abudhabi-v5-method-dk-history.yml'
jobs:
  score:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.16'}
      - name: Install exact frozen packages
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6 scikit-learn==1.9.0 scipy==1.17.1 xgboost==3.2.0 joblib==1.5.3 threadpoolctl==3.6.0 python-dateutil==2.9.0.post0
      - name: Score true DK history
        run: python -m pipeline.research.score_ufc_abudhabi_hierarchical_v5_dk_history
      - uses: actions/upload-artifact@v4
        with:
          name: ufc-abudhabi-v5-method-dk-history-20260725
          path: |
            data/research/prop_mispricing/ufc_abudhabi_hierarchical_v5_dk_history_20260725.csv
            data/research/prop_mispricing/ufc_abudhabi_hierarchical_v5_dk_history_bets_logit030_20260725.csv
