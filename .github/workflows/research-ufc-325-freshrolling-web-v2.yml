name: Research UFC 326 BFO Split Diagnostic V1
on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-ufc-325-freshrolling-web-v2.yml]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan BFO UFC archive IDs around UFC 326
        run: |
          python - <<'PY'
          import urllib.request
          H={'User-Agent':'Mozilla/5.0'}
          needles=['max holloway','charles oliveira','caio borralho','reinier de ridder','cody garbrandt','xiao long','drew dober','michael johnson','gregory rodrigues','brunno ferreira']
          for i in range(3980,4081):
              for slug in [f'ufc-{i}',f'ufc-326-{i}']:
                  u='https://www.bestfightodds.com/events/'+slug
                  try:
                      req=urllib.request.Request(u,headers=H)
                      t=urllib.request.urlopen(req,timeout=6).read().decode('utf-8','ignore').lower()
                  except Exception:
                      continue
                  hits=[n for n in needles if n in t]
                  if len(hits)>=2:
                      print('MATCH',u,'hits=',hits)
          PY
