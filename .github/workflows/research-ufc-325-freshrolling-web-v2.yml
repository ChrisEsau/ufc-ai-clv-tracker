name: Research UFC 325 FreshRolling Web V2
on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-ufc-325-freshrolling-web-v2.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow numpy scikit-learn xgboost pyyaml requests beautifulsoup4 lxml
      - name: Run pinned UFC 325 scorer
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path('.github/workflows/research-ufc-325-freshrolling-web-v1.yml').read_text()
          m=re.search(r"python - <<'PY'\n(.*?)\n          PY",src,re.S)
          if not m: raise RuntimeError('Could not extract V1 scorer')
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in m.group(1).splitlines())
          old="""pages=[]
for i in range(3960,4026):
  u=f'https://www.bestfightodds.com/events/ufc-{i}'
  try:t=requests.get(u,headers=H,timeout=15).text
  except Exception:continue
  low=t.lower()
  if 'volkanovski' in low and 'diego lopes' in low:
    pages.append((u,t))
if not pages:raise RuntimeError('No BFO UFC 325 archive page found')"""
          new="""u='https://www.bestfightodds.com/events/ufc-3971'
t=requests.get(u,headers=H,timeout=30).text
pages=[(u,t)]
if 'volkanovski' not in t.lower() or 'diego lopes' not in t.lower(): raise RuntimeError('Pinned BFO 3971 page mismatch')"""
          if old not in code: raise RuntimeError('Scan block not found')
          code=code.replace(old,new)
          exec(compile(code,'<ufc325_pinned>','exec'),{})
          PY
      - name: Commit UFC 325 scores
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f data/research/prop_mispricing/ufc_325_*_v1.csv
          git commit -m 'research: add UFC 325 pinned frozen freshrolling scores' || echo No-changes
          git pull --rebase origin research/ufc-prop-mispricing-xgboost-20260829 || true
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
