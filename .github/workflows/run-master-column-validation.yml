name: Run Master Column Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-master-column-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow

      - name: Run master column validation
        run: |
          python -m pipeline.data_maintenance.run_master_column_validation

      - name: Commit validation output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/audits/ufc_master_column_validation.parquet

          git commit -m "Update master column validation artifact" || echo "No changes to commit"

          git push
