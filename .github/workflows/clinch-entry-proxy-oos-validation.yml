name: Clinch Entry Proxy OOS Validation

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - 'pipeline/research/clinch_entry_proxy_oos_validation.py'
      - '.github/workflows/clinch-entry-proxy-oos-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            data/fight_details
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow scikit-learn
      - name: Validate clinch proxy
        run: |
          set -euo pipefail
          python -m pipeline.research.clinch_entry_proxy_oos_validation | tee clinch-entry-proxy-oos-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: clinch-entry-proxy-oos-${{ github.run_id }}
          path: |
            clinch-entry-proxy-oos-validation.json
            data/research/clinch_entry_proxy_oos/results.json
            data/research/clinch_entry_proxy_oos/fighter_round_predictions.csv
