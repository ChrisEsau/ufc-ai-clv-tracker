name: Regional MMA SofaScore Probe

on:
  workflow_dispatch:
    inputs:
      date:
        description: "MMA date (YYYY-MM-DD)"
        required: true
        default: "2025-09-07"
      tournament:
        description: "Tournament substring"
        required: true
        default: "LFA"
      max_items:
        description: "Maximum events to retrieve"
        required: true
        default: "3"
  pull_request:
    branches:
      - feature/fsr-v3
    paths:
      - scrapers/sofascore_mma_apify.py
      - .github/workflows/run-regional-mma-sofascore-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      PROBE_DATE: ${{ inputs.date || '2025-09-07' }}
      PROBE_TOURNAMENT: ${{ inputs.tournament || 'LFA' }}
      PROBE_MAX_ITEMS: ${{ inputs.max_items || '3' }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Verify Apify secret exists
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "APIFY_TOKEN repository secret is not available"
            exit 1
          fi

      - name: Run free-tier Apify LFA probe
        run: |
          python -m scrapers.sofascore_mma_apify \
            --date "$PROBE_DATE" \
            --tournament "$PROBE_TOURNAMENT" \
            --max-items "$PROBE_MAX_ITEMS" \
            --max-charge-usd 0.05 \
            --output data/audits/regional_mma/sofascore/apify_lfa_probe.json

      - name: Print coverage summary
        if: always()
        run: |
          echo "=== Apify LFA probe summary ==="
          cat data/audits/regional_mma/sofascore/apify_lfa_probe_summary.json 2>/dev/null || true

      - name: Upload raw probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-mma-apify-probe-${{ env.PROBE_DATE }}
          path: data/audits/regional_mma/sofascore/
          if-no-files-found: warn
