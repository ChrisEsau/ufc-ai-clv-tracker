name: Regional MMA SofaScore Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/regional-mma-scraper
    paths:
      - scrapers/sacramento_debut_apify_pull.py
      - .github/workflows/run-regional-mma-sofascore-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      APIFY_TOKEN: ${{ secrets.apify }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/regional-mma-scraper

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Pull Sacramento debut pre-UFC regional data
        id: apify_probe
        continue-on-error: true
        run: |
          mkdir -p .github/probe-results data/audits/regional_mma/sofascore/sacramento_debuts
          if [ -z "$APIFY_TOKEN" ]; then
            echo '{"exit_code":1,"error":"apify repository secret is not available"}' > .github/probe-results/sacramento_debuts_latest.json
            exit 1
          fi

          set +e
          python -m scrapers.sacramento_debut_apify_pull > /tmp/sacramento_debuts.log 2>&1
          status=$?
          set -e

          if [ -f data/audits/regional_mma/sofascore/sacramento_debuts/summary.json ]; then
            cp data/audits/regional_mma/sofascore/sacramento_debuts/summary.json .github/probe-results/sacramento_debuts_latest.json
          else
            python - <<'PY'
import json
from pathlib import Path
text = Path('/tmp/sacramento_debuts.log').read_text(errors='replace')[-12000:]
Path('.github/probe-results/sacramento_debuts_latest.json').write_text(
    json.dumps({'exit_code': 1, 'error': text}, indent=2) + '\n'
)
PY
          fi

          cat /tmp/sacramento_debuts.log
          exit "$status"

      - name: Commit audit summary
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/probe-results/sacramento_debuts_latest.json
          git diff --cached --quiet || git commit -m "Record Sacramento debut regional pull"
          git push origin HEAD:feature/regional-mma-scraper

      - name: Upload raw audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacramento-debut-regional-mma
          path: data/audits/regional_mma/sofascore/sacramento_debuts/
          if-no-files-found: warn

      - name: Fail job if pull failed
        if: steps.apify_probe.outcome == 'failure'
        run: exit 1
