name: Regional MMA SofaScore Probe

on:
  workflow_dispatch:
    inputs:
      date:
        description: "MMA date (YYYY-MM-DD)"
        required: true
        default: "2025-09-07"
      promotion:
        description: "Promotion substring (for example LFA or Fury)"
        required: false
        default: "LFA"
      max_events:
        description: "Maximum fights to probe; 0 means no limit"
        required: true
        default: "3"
  pull_request:
    branches:
      - feature/fsr-v3
    paths:
      - scrapers/sofascore_mma.py
      - tests/experimental/test_sofascore_mma.py
      - .github/workflows/run-regional-mma-sofascore-probe.yml
  push:
    branches:
      - feature/regional-mma-scraper
    paths:
      - .github/workflows/run-regional-mma-sofascore-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PROBE_DATE: ${{ inputs.date || '2025-09-07' }}
      PROBE_PROMOTION: ${{ inputs.promotion || 'LFA' }}
      PROBE_MAX_EVENTS: ${{ inputs.max_events || '3' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests pytest

      - name: Run parser tests
        run: python -m pytest tests/experimental/test_sofascore_mma.py -q

      - name: Probe regional MMA JSON
        run: |
          mkdir -p .github/probe-results
          set +e
          python -m scrapers.sofascore_mma \
            --date "$PROBE_DATE" \
            --promotion "$PROBE_PROMOTION" \
            --max-events "$PROBE_MAX_EVENTS" \
            --sleep-seconds 1.0 \
            --base-url "https://api.sofascore.com/api/v1" \
            > .github/probe-results/probe.log 2>&1
          code=$?
          set -e
          {
            echo "date=$PROBE_DATE"
            echo "promotion=$PROBE_PROMOTION"
            echo "base_url=https://api.sofascore.com/api/v1"
            echo "exit_code=$code"
            echo ""
            echo "=== probe output ==="
            cat .github/probe-results/probe.log
            echo ""
            echo "=== coverage summary ==="
            cat "data/audits/regional_mma/sofascore/$PROBE_DATE/coverage_summary.json" 2>/dev/null || true
          } > .github/probe-results/latest.txt
          cat .github/probe-results/latest.txt

      - name: Commit push-probe result
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/regional-mma-scraper'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/probe-results/latest.txt
          git commit -m "Record SofaScore API probe result" || exit 0
          git push origin HEAD:feature/regional-mma-scraper

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-mma-sofascore-probe-${{ env.PROBE_DATE }}
          path: |
            data/audits/regional_mma/sofascore/
            .github/probe-results/latest.txt
          if-no-files-found: warn
