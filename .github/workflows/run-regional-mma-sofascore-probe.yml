name: Regional MMA SofaScore Probe

on:
  workflow_dispatch:
    inputs:
      date:
        description: "MMA date (YYYY-MM-DD)"
        required: true
        default: "2025-09-07"
      tournament:
        description: "Tournament substring"
        required: true
        default: "LFA"
      max_items:
        description: "Maximum events to retrieve"
        required: true
        default: "3"
  push:
    branches:
      - feature/regional-mma-scraper
    paths:
      - scrapers/sofascore_mma_apify.py
      - .github/workflows/run-regional-mma-sofascore-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PROBE_DATE: ${{ inputs.date || '2025-09-07' }}
      PROBE_TOURNAMENT: ${{ inputs.tournament || 'LFA' }}
      PROBE_MAX_ITEMS: ${{ inputs.max_items || '3' }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/regional-mma-scraper

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run capped Apify LFA probe
        id: apify_probe
        continue-on-error: true
        run: |
          mkdir -p .github/probe-results data/audits/regional_mma/sofascore
          if [ -z "$APIFY_TOKEN" ]; then
            echo "exit_code=1" > .github/probe-results/apify_latest.txt
            echo "APIFY_TOKEN repository secret is not available" >> .github/probe-results/apify_latest.txt
            exit 1
          fi

          set +e
          python -m scrapers.sofascore_mma_apify \
            --date "$PROBE_DATE" \
            --tournament "$PROBE_TOURNAMENT" \
            --max-items "$PROBE_MAX_ITEMS" \
            --max-charge-usd 0.05 \
            --output data/audits/regional_mma/sofascore/apify_lfa_probe.json \
            > /tmp/apify_probe.log 2>&1
          status=$?
          set -e

          {
            echo "date=$PROBE_DATE"
            echo "tournament=$PROBE_TOURNAMENT"
            echo "max_items=$PROBE_MAX_ITEMS"
            echo "max_charge_usd=0.05"
            echo "exit_code=$status"
            echo
            if [ -f data/audits/regional_mma/sofascore/apify_lfa_probe_summary.json ]; then
              cat data/audits/regional_mma/sofascore/apify_lfa_probe_summary.json
            else
              tail -80 /tmp/apify_probe.log
            fi
          } > .github/probe-results/apify_latest.txt

          cat /tmp/apify_probe.log
          exit "$status"

      - name: Commit probe result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/probe-results/apify_latest.txt
          git diff --cached --quiet || git commit -m "Record Apify regional MMA probe result"
          git push origin HEAD:feature/regional-mma-scraper

      - name: Upload raw probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-mma-apify-probe-${{ env.PROBE_DATE }}
          path: data/audits/regional_mma/sofascore/
          if-no-files-found: warn

      - name: Fail job if Apify probe failed
        if: steps.apify_probe.outcome == 'failure'
        run: exit 1
