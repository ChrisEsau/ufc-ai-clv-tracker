name: Regional MMA SofaScore Probe

on:
  workflow_dispatch:
    inputs:
      date:
        description: "MMA date (YYYY-MM-DD)"
        required: true
        default: "2025-09-07"
  pull_request:
    branches:
      - feature/fsr-v3
    paths:
      - scrapers/sofascore_mma.py
      - scrapers/sofascore_mma_selenium_probe.py
      - tests/experimental/test_sofascore_mma.py
      - .github/workflows/run-regional-mma-sofascore-probe.yml
  push:
    branches:
      - feature/regional-mma-scraper
    paths:
      - scrapers/sofascore_mma_selenium_probe.py
      - .github/workflows/run-regional-mma-sofascore-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      PROBE_DATE: ${{ inputs.date || '2025-09-07' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests pytest selenium webdriver-manager

      - name: Run parser tests
        run: python -m pytest tests/experimental/test_sofascore_mma.py -q

      - name: Probe SofaScore with existing Selenium helper
        run: |
          python -m scrapers.sofascore_mma_selenium_probe \
            --date "$PROBE_DATE" \
            --output data/audits/regional_mma/sofascore/selenium_probe.json

      - name: Print Selenium probe result
        if: always()
        run: |
          echo "=== selenium probe ==="
          cat data/audits/regional_mma/sofascore/selenium_probe.json 2>/dev/null || true

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-mma-sofascore-selenium-probe-${{ env.PROBE_DATE }}
          path: data/audits/regional_mma/sofascore/
          if-no-files-found: warn
