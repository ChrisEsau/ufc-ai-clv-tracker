name: Operations Scheduler

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate schedule without dispatching runbooks"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: operations-scheduler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  operations-scheduler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || 'dev' }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME:-dev}"
          git pull --ff-only origin "${GITHUB_REF_NAME:-dev}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scheduler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name || 'dev' }}
        run: |
          ARGS=()
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python -m pipeline.operations.run_operations_scheduler "${ARGS[@]}"

      - name: Commit scheduler status
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/status/operations_scheduler_status.json || true
          git commit -m "Update Operations Scheduler status" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME:-dev}"
          git push origin "HEAD:${GITHUB_REF_NAME:-dev}"
