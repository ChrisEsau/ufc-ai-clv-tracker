name: Reach MC Historical Validation PR

on:
  pull_request:
    branches:
      - "feature/fsr-v3"
    paths:
      - ".github/workflows/reach-mc-validation.yml"
      - ".github/workflows/reach-mc-validation-pr.yml"

permissions:
  contents: read

jobs:
  reach-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn statsmodels joblib pyarrow pyyaml pytest

      - name: Run reach integration unit tests
        run: pytest -q tests/simulation/event_clock_mc_v2/test_reach_translation_v3.py

      - name: Build frozen FSR V2 source histories
        run: python -m pipeline.fsr_v2.build --all

      - name: Publish frozen FSR V2 source snapshots
        run: python -m pipeline.fsr_v2.publish

      - name: Build final canonical FSR V3
        run: python -m pipeline.fsr_v3.build_canonical

      - name: Patch incomplete-row cohort guard in CI checkout only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("pipeline/simulation/event_mc_v1/diagnostics/fresh_100_fight_predictive_replay.py")
          text = path.read_text()
          old = '''            and method in METHODS\n            and int(row["total_rounds"]) in {3, 5}\n            and pd.notna(row["match_time_sec"])\n'''
          new = '''            and method in METHODS\n            and pd.notna(row["total_rounds"])\n            and int(row["total_rounds"]) in {3, 5}\n            and pd.notna(row["match_time_sec"])\n'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
              print("Applied CI-only null guard")
          else:
              print("Null guard already present or source changed; continuing")
          PY

      - name: Fit frozen Event Clock V1 parent bundle
        run: python -m pipeline.simulation.event_clock_mc_v1.fit_event_clock_bundle

      - name: Fit Event Clock V2 bundle
        run: python -m pipeline.simulation.event_clock_mc_v2.fit_event_clock_bundle

      - name: Extract and run reach A/B validation step
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/reach-mc-validation.yml').read_text())
          jobs = workflow['jobs']
          steps = jobs['reach-validation']['steps']
          for step in steps:
              if step.get('name') == 'Run 12-fight reach ON vs OFF historical MC':
                  Path('/tmp/run_reach_validation.sh').write_text(step['run'])
                  break
          else:
              raise RuntimeError('reach validation step not found')
          PY
          bash /tmp/run_reach_validation.sh

      - name: Upload reach validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reach-mc-historical-validation-pr
          path: data/diagnostics/event_clock_mc_v2/reach_validation/*.csv
          if-no-files-found: warn
