name: Research XGBoost Method Hierarchical V5 Betting

on:
  workflow_dispatch:
  push:
    branches:
      - research/ufc-prop-mispricing-xgboost-20260829
    paths:
      - .github/workflows/research-xgboost-method-hierarchical-v5-betting.yml
      - pipeline/research/xgboost_method_hierarchical_v5_betting.py
      - data/research/prop_mispricing/xgboost_method_hierarchical_v5_oof_predictions.csv

permissions:
  contents: write

jobs:
  betting-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6

      - name: Run hierarchical V5 betting test
        run: |
          python -m pipeline.research.xgboost_method_hierarchical_v5_betting

      - name: Commit betting outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/research/prop_mispricing/xgboost_method_hierarchical_v5_betting_ledger.csv \
            data/research/prop_mispricing/xgboost_method_hierarchical_v5_betting_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "research: add hierarchical V5 betting results"
          for i in 1 2 3 4 5; do
            git fetch origin research/ufc-prop-mispricing-xgboost-20260829
            git rebase origin/research/ufc-prop-mispricing-xgboost-20260829 || { git rebase --abort; sleep 2; continue; }
            git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829 && exit 0
            sleep 3
          done
          exit 1
