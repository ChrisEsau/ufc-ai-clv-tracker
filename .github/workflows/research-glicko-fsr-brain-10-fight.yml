name: Research Glicko FSR Brain 10 Fight

on:
  workflow_dispatch:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - pipeline/research/glicko_fsr_brain_10_fight_shadow.py
      - .github/workflows/research-glicko-fsr-brain-10-fight.yml

permissions:
  contents: read
  actions: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        fight_id:
          - 419fff06f338f5c6
          - 58ffa2dac4f2e7d0
          - 5c69b019e6deee41
          - 5d2eedd05081ed23
          - 20d74ed23d3e9b3a
          - 44cfbb8c3c356c65
          - b0474597b2c60482
          - b23a1a5d35eb438a
          - 33afdd7ad43a2756
          - 7208e40818401e88
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas pyarrow scipy scikit-learn pyyaml joblib
      - name: Restore locked Brain bundle cache
        id: bundle-cache
        uses: actions/cache@v4
        with:
          path: data/research/locked_brain_bundle
          key: locked-brain-bundle-v2-${{ hashFiles('pipeline/research/locked_brain_bundle.py', 'pipeline/research/fsr_recency_cohort_shadow.py', 'pipeline/research/ko_time_survival_oos.py', 'pipeline/research/sub_time_survival_oos.py') }}
      - name: Require locked Brain bundle
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        run: exit 1
      - name: Run adjusted-only Glicko shadow
        run: python -m pipeline.research.glicko_fsr_brain_10_fight_shadow --fight-id ${{ matrix.fight_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: glicko-fsr-brain-${{ matrix.fight_id }}
          path: data/diagnostics/glicko_fsr_brain_10_fight_shadow/${{ matrix.fight_id }}/
          if-no-files-found: error
