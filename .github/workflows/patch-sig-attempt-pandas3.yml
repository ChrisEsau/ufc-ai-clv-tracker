name: Apply Sig Attempt Pandas 3 Patch

on:
  push:
    branches:
      - feature/round-fight-simulator-v0
    paths:
      - ".github/workflows/patch-sig-attempt-pandas3.yml"

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout simulator branch
        uses: actions/checkout@v4
        with:
          ref: feature/round-fight-simulator-v0
          fetch-depth: 0

      - name: Patch writable NumPy arrays
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pipeline/simulation/sig_attempt_model.py")
          text = path.read_text(encoding="utf-8")
          prefix, marker, remainder = text.partition("def _fighter_history_prediction(")
          if not marker:
              raise SystemExit("Could not locate _fighter_history_prediction")
          function_body, next_marker, suffix = remainder.partition("\n\ndef _metric_row(")
          if not next_marker:
              raise SystemExit("Could not locate end of _fighter_history_prediction")
          count = function_body.count(".to_numpy(dtype=float)")
          if count != 2:
              raise SystemExit(
                  f"Expected two writable-array conversions in function; found {count}"
              )
          function_body = function_body.replace(
              ".to_numpy(dtype=float)",
              ".to_numpy(dtype=float, copy=True)",
          )
          patched = prefix + marker + function_body + next_marker + suffix
          path.write_text(patched, encoding="utf-8")
          PY

      - name: Run focused regression test
        run: |
          python -m pip install --quiet pandas numpy scikit-learn xgboost joblib
          python -m unittest tests.test_simulation_sig_attempt_model
          git diff --check

      - name: Commit compatibility fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-sig-attempt-pandas3.yml
          git add pipeline/simulation/sig_attempt_model.py tests/test_simulation_sig_attempt_model.py
          git commit -m "Fix pandas 3 strike baseline compatibility"
          git push origin HEAD:feature/round-fight-simulator-v0
