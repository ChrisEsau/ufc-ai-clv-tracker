name: Run Staged Master Mapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-staged-master-mapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull latest repo state
        run: |
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow

      - name: Run staged master mapper
        run: |
          python run_staged_master_mapper.py

      - name: Commit mapper outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add ufc_staged_master_rows.parquet
          git add ufc_staged_master_mapping_audit.parquet

          git commit -m "Update staged master mapped rows" || echo "No changes to commit"

          git push