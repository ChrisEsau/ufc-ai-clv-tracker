name: Research XGBoost Market Offset V10e Event Environment Pinned Order

on:
  push:
    branches:
      - research/ufc-prop-mispricing-xgboost-20260829
    paths:
      - .github/workflows/research-xgboost-market-offset-v10e-event-environment-pinned-order.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v10e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0

      - name: Set up exact V5 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install exact V5 packages
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install \
            pandas==3.0.5 \
            pyarrow==25.0.1 \
            numpy==2.4.6 \
            scikit-learn==1.9.0 \
            scipy==1.17.1 \
            xgboost==3.2.0 \
            joblib==1.5.3 \
            threadpoolctl==3.6.0 \
            python-dateutil==2.9.0.post0 \
            requests beautifulsoup4

      - name: Restore exact V5 input snapshot
        run: |
          git checkout 7df1b61126be1f4e036b256d1c774c531b8a281f -- \
            data/market/historical_market_outcomes.parquet \
            data/features/moneyline_feature_view.parquet

      - name: Run V10e with exact V5 row ordering
        run: |
          python - <<'PY'
          import textwrap
          from pathlib import Path

          p=Path('.github/workflows/research-xgboost-market-offset-v10d-event-environment-pinned.yml')
          s=p.read_text()
          marker="          python - <<'PY'\n"
          start=s.index(marker)+len(marker)
          end=s.index("\n          PY",start)
          wrapper=textwrap.dedent(s[start:end])

          # Before V10d executes its inner V10 code, force the exact V5
          # canonical row ordering. This matters because subsample=0.8.
          old="exec(compile(code,'v10d_pinned.py','exec'),{})"
          new="""order_needle=\"env_cols=['international','las_vegas','abu_dhabi','high_altitude','europe','oceania','asia_mideast','latin_america','canada']\"\nif order_needle not in code:\n    raise RuntimeError('Environment columns insertion point not found')\ncode=code.replace(order_needle,\"df=df.sort_values(['date','fight_id']).reset_index(drop=True)\\n\"+order_needle)\ncode=code.replace('market_offset_v10d_event_environment_pinned','market_offset_v10e_event_environment_pinned_order')\ncode=code.replace('xgboost_market_offset_v10d_event_environment_pinned_summary.json','xgboost_market_offset_v10e_event_environment_pinned_order_summary.json')\nexec(compile(code,'v10e_pinned_order.py','exec'),{})"""
          if old not in wrapper:
              raise RuntimeError('V10d exec point not found')
          wrapper=wrapper.replace(old,new)
          exec(compile(wrapper,'v10e_wrapper.py','exec'),{})
          PY

      - name: Restore current branch inputs and commit output safely
        run: |
          git restore --source=HEAD -- data/market/historical_market_outcomes.parquet data/features/moneyline_feature_view.parquet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/research/prop_mispricing/xgboost_market_offset_v10e_event_environment_pinned_order_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "Add valid V10e event environment outputs"
          for i in 1 2 3 4 5; do
            git fetch origin research/ufc-prop-mispricing-xgboost-20260829
            git rebase origin/research/ufc-prop-mispricing-xgboost-20260829 || { git rebase --abort; sleep 2; continue; }
            git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829 && exit 0
            sleep 3
          done
          exit 1
