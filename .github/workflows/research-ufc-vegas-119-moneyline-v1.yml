name: Research UFC Vegas 119 Moneyline V1
on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-ufc-vegas-119-moneyline-v1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow numpy scikit-learn xgboost
      - name: Score UFC Vegas 119 moneylines
        run: |
          python - <<'PY'
          import unicodedata
          from pathlib import Path
          import numpy as np, pandas as pd
          from xgboost import XGBClassifier
          OUT=Path('data/research/prop_mispricing'); OUT.mkdir(parents=True,exist_ok=True)
          m=pd.read_parquet('data/market/historical_market_outcomes.parquet').copy()
          m=m[(m.bookmaker=='legacy_consensus')&(m.result_status=='graded')&m.won.notna()&(m.market_key=='moneyline')].copy()
          m['date']=pd.to_datetime(m.date); m['won']=m.won.astype(bool).astype(int)
          good=m.groupby('fight_id').size(); good=good[good==2].index; m=m[m.fight_id.isin(good)].copy()
          m['market_overround']=m.groupby('fight_id').implied_probability.transform('sum'); m['fair_market_p']=m.implied_probability/m.market_overround
          fv=pd.read_parquet('data/features/moneyline_feature_view.parquet').copy(); fv['date']=pd.to_datetime(fv.date)
          def pc(df):
            z=[]
            for c in df.columns:
              if not pd.api.types.is_numeric_dtype(df[c]): continue
              l=c.lower(); allow=('_pre_' in l or l.startswith('pre_') or 'ewm_' in l or 'recent_form_' in l or l.endswith('_diff') or l.startswith('combined_') or l in {'older_fighter_age','reach_mismatch_abs','height_mismatch_abs','title_fight','total_rounds'}); deny=any(x in l for x in ['winner','result','target','label','finish_round','match_time_sec','profit','odds','implied','market','actual','post_'])
              if allow and not deny:z.append(c)
            return sorted(set(z))
          cols=pc(fv); diffs=[c for c in cols if c.endswith('_diff')]
          d=m.merge(fv[['fight_id']+cols],on='fight_id',how='inner'); blue=d.outcome_side.astype(str).eq('blue'); d.loc[blue,diffs]=-d.loc[blue,diffs]
          fc=cols+['fair_market_p','market_overround']; X=d[fc].replace([np.inf,-np.inf],np.nan); valid=[c for c in fc if X[c].notna().any()]
          tr=d.date<='2022-12-31'; va=(d.date>='2023-01-01')&(d.date<='2024-12-31'); med=X.loc[tr,valid].median(numeric_only=True); X=X[valid].fillna(med).fillna(0)
          model=XGBClassifier(n_estimators=350,max_depth=3,learning_rate=.03,subsample=.8,colsample_bytree=.7,min_child_weight=8,reg_lambda=5,reg_alpha=.5,objective='binary:logistic',eval_metric='logloss',random_state=42,n_jobs=2)
          model.fit(X.loc[tr],d.loc[tr,'won'],eval_set=[(X.loc[va],d.loc[va,'won'])],verbose=False)
          odds={
            'Manel Kape':-155,'Kyoji Horiguchi':130,
            'Ion Cutelaba':250,'Navajo Stirling':-310,
            'Hyder Amil':164,'Christian Rodriguez':-198,
            'Melsik Baghdasaryan':260,'Murtazali Magomedov':-325,
            'Vinicius Oliveira':-290,'Andre Fili':235,
            'Andre Lima':-625,'Kevin Borjas':455,
            'Beatriz Mesquita':-575,'Melissa Mullins':625,
            'Allan Nascimento':-166,'Mitch Raposo':140,
            'Gaston Bolanos':330,'Michael Aswell Jr.':-425,
            'Leon Shahbazyan':285,'Levan Chokheli':-360,
            'Karol Rosa':-115,'Luana Santos':-105,
            'Shane Collins':-218,'Otari Tanzilovi':180,
          }
          def norm(s): return ''.join(ch for ch in unicodedata.normalize('NFKD',str(s)) if not unicodedata.combining(ch)).replace('’',"'").strip().lower().replace(' jr.',' jr').replace(' jr',' jr')
          od={norm(k):(k,v) for k,v in odds.items()}
          event=fv[fv.date.dt.strftime('%Y-%m-%d').eq('2026-06-20')].copy()
          if event.empty: raise RuntimeError('No 2026-06-20 feature rows found')
          rows=[]
          for _,r in event.iterrows():
            rn,bn=norm(r.r_name),norm(r.b_name)
            if rn not in od or bn not in od: continue
            pair=[]
            for side,nm in [('red',rn),('blue',bn)]:
              label,ao=od[nm]; ip=100/(ao+100) if ao>0 else (-ao)/((-ao)+100); pair.append((side,label,ao,ip))
            over=sum(x[3] for x in pair)
            for side,label,ao,ip in pair:
              rec={c:r[c] for c in cols}
              if side=='blue':
                for c in diffs: rec[c]=-rec[c]
              rec.update({'fight_id':r.fight_id,'date':str(r.date.date()),'fighter':label,'side':side,'american_odds':ao,'fair_market_p':ip/over,'market_overround':over})
              XS=pd.DataFrame([rec])[valid].replace([np.inf,-np.inf],np.nan).fillna(med).fillna(0)
              rec['model_p']=float(model.predict_proba(XS)[0,1]); rec['edge']=rec['model_p']-rec['fair_market_p']; rows.append(rec)
          out=pd.DataFrame(rows); keep=['fight_id','date','fighter','side','american_odds','fair_market_p','model_p','edge','market_overround']; out[keep].sort_values(['fight_id','side']).to_csv(OUT/'ufc_vegas_119_moneyline_v1.csv',index=False); print(out[keep].sort_values(['fight_id','side']).to_string(index=False)); print('matched_fights',out.fight_id.nunique())
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f data/research/prop_mispricing/ufc_vegas_119_moneyline_v1.csv
          git commit -m 'Add UFC Vegas 119 V1 moneyline scores' || echo No-changes
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
