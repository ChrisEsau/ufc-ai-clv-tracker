name: Research XGBoost V5 DraftKings Index Snapshots

on:
  push:
    branches:
      - research/ufc-prop-mispricing-xgboost-20260829
    paths:
      - data/research/prop_mispricing/v5_draftkings_index_trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-v5-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'

      - name: Install exact V5 packages
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6 scikit-learn==1.9.0 scipy==1.17.1 xgboost==3.2.0 joblib==1.5.3 threadpoolctl==3.6.0 python-dateutil==2.9.0.post0

      - name: Materialize frozen V5 training snapshot
        run: |
          mkdir -p /tmp/v5_frozen
          git show 7df1b61126be1f4e036b256d1c774c531b8a281f:data/market/historical_market_outcomes.parquet > /tmp/v5_frozen/historical_market_outcomes.parquet
          git show 7df1b61126be1f4e036b256d1c774c531b8a281f:data/features/moneyline_feature_view.parquet > /tmp/v5_frozen/moneyline_feature_view.parquet

      - name: Run frozen V5 on DraftKings index snapshots
        run: |
          python -m pipeline.research.xgboost_v5_draftkings_index_snapshots_v2

      - name: Commit V5 index outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/research/prop_mispricing/v5_draftkings_index_snapshot_predictions.csv \
            data/research/prop_mispricing/v5_draftkings_index_latest_by_fight.csv \
            data/research/prop_mispricing/v5_draftkings_index_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "Add frozen V5 DraftKings index snapshot predictions"
          for i in 1 2 3 4 5; do
            git fetch origin research/ufc-prop-mispricing-xgboost-20260829
            git rebase origin/research/ufc-prop-mispricing-xgboost-20260829 || { git rebase --abort; sleep 2; continue; }
            git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829 && exit 0
            sleep 3
          done
          exit 1
