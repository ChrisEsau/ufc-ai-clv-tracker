name: Run Style Research Pipeline

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Style matchup research config path
        required: false
        default: pipeline/research/style_matchups/style_config.yaml
      k_values:
        description: Comma-separated KMeans cluster counts to evaluate
        required: false
        default: "4,5,6,7,8"
      min_fights:
        description: Minimum fights required for matchup/ROI report rows
        required: false
        default: "50"
      odds_path:
        description: Historical moneyline odds parquet path
        required: false
        default: data/market/historical_moneyline_odds.parquet

permissions:
  contents: write

concurrency:
  group: style-research-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  style-research-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-workspace.txt

      - name: Build style dataset
        run: |
          python -m pipeline.research.style_matchups.build_style_dataset \
            --config "${{ inputs.config_path }}"

      - name: Run style clustering
        run: |
          python -m pipeline.research.style_matchups.run_style_clustering \
            --config "${{ inputs.config_path }}" \
            --k-values "${{ inputs.k_values }}"

      - name: Run style matchup and ROI analysis
        run: |
          python -m pipeline.research.style_matchups.evaluate_style_matchups \
            --config "${{ inputs.config_path }}" \
            --min-fights "${{ inputs.min_fights }}" \
            --odds-path "${{ inputs.odds_path }}"

      - name: Commit style research outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f \
            data/research/style_matchups/style_fighter_snapshots.parquet \
            data/research/style_matchups/style_cluster_assignments.parquet \
            data/research/style_matchups/style_cluster_profiles.csv \
            data/research/style_matchups/style_cluster_metrics.csv \
            data/research/style_matchups/style_cluster_summary.json \
            data/research/style_matchups/style_matchup_fights.parquet \
            data/research/style_matchups/style_matchup_matrix.csv \
            data/research/style_matchups/style_matchup_edge_report.csv \
            data/research/style_matchups/style_matchup_roi_report.csv \
            data/research/style_matchups/style_matchup_underdogs.csv \
            data/research/style_matchups/style_matchup_summary.json
          git commit -m "Update style research pipeline outputs" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
