name: FSR V3 Method Market Coverage

on:
  push:
    branches:
      - "feature/fsr-v3"
    paths:
      - ".github/workflows/fsr-v3-method-market-coverage.yml"
  pull_request:
    paths:
      - ".github/workflows/fsr-v3-method-market-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect-method-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parquet deps
        run: python -m pip install pandas pyarrow
      - name: Inspect historical fighter-method market coverage
        run: |
          python - <<'PY' | tee /tmp/method_market_coverage.log
          import pandas as pd
          from pathlib import Path

          path = Path('data/market/historical_market_outcomes.parquet')
          df = pd.read_parquet(path)
          print('rows:', len(df))
          print('columns:', list(df.columns))
          print('\nmarket key counts:')
          print(df['market_key'].astype(str).value_counts().head(40).to_string())

          keys = ['win_by_ko_tko_dq','win_by_submission','win_by_decision']
          m = df[df['market_key'].astype(str).isin(keys)].copy()
          print('\nMETHOD ROWS:', len(m))
          print('METHOD FIGHTS:', m['fight_id'].astype(str).nunique())
          if 'date' in m.columns:
              d = pd.to_datetime(m['date'], errors='coerce')
              print('date range:', d.min(), 'through', d.max())
          if 'bookmaker' in m.columns:
              print('\nbookmakers:')
              print(m['bookmaker'].astype(str).value_counts().to_string())
          if 'outcome_join_key' in m.columns:
              print('\noutcome_join_key examples:')
              print(m[['market_key','outcome_join_key']].drop_duplicates().head(30).to_string(index=False))
          if 'outcome_fighter_id' in m.columns:
              print('non-null outcome_fighter_id:', int(m['outcome_fighter_id'].notna().sum()))
          if 'outcome_label' in m.columns:
              print('\noutcome label examples:')
              print(m[['market_key','outcome_label']].drop_duplicates().head(30).to_string(index=False))

          # Count unique priced fighter-method outcomes per fight after collapsing exact duplicates.
          identity = ['fight_id','market_key','outcome_join_key']
          x = m.drop_duplicates(identity).copy()
          per_fight = x.groupby('fight_id').size()
          print('\nunique fighter-method outcomes per fight distribution:')
          print(per_fight.value_counts().sort_index().to_string())
          print('fights with >=6 unique method outcomes:', int((per_fight >= 6).sum()))

          # Coverage by individual market family.
          print('\nfight coverage by method family:')
          print(x.groupby('market_key')['fight_id'].nunique().to_string())

          # Duplicate quote density / snapshot behavior.
          dup = m.groupby(identity).size()
          print('\nrows per unique priced outcome distribution:')
          print(dup.value_counts().sort_index().head(30).to_string())
          print('max rows per unique outcome:', int(dup.max()) if len(dup) else 0)

          # Useful pricing fields.
          cols = [c for c in ['fight_id','date','bookmaker','market_key','outcome_join_key','outcome_label','outcome_fighter_id','american_odds','implied_probability','won'] if c in m.columns]
          print('\nsample method rows:')
          print(m[cols].head(30).to_string(index=False))
          PY
      - name: Post coverage result to PR 68
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## FSR V3 method-market coverage audit'
            echo
            echo '```text'
            tail -n 240 /tmp/method_market_coverage.log
            echo '```'
          } > /tmp/method_market_coverage_comment.md
          gh pr comment 68 --repo ChrisEsau/ufc-ai-clv-tracker --body-file /tmp/method_market_coverage_comment.md
