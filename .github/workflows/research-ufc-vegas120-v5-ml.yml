name: Research UFC Vegas 120 Frozen V5 Moneyline
on:
  pull_request:
    branches:
      - research/ufc-prop-mispricing-xgboost-20260829
    paths:
      - 'pipeline/research/score_ufc_vegas120_v5_ml.py'
      - '.github/workflows/research-ufc-vegas120-v5-ml.yml'
jobs:
  score:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Install exact frozen V5 packages
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6 scikit-learn==1.9.0 scipy==1.17.1 xgboost==3.2.0 joblib==1.5.3 threadpoolctl==3.6.0 python-dateutil==2.9.0.post0
      - name: Score UFC Vegas 120 with frozen V5
        run: python -m pipeline.research.score_ufc_vegas120_v5_ml
      - uses: actions/upload-artifact@v4
        with:
          name: ufc-vegas120-v5-moneyline-20260808
          path: |
            data/research/prop_mispricing/ufc_vegas120_v5_moneyline_20260808.csv
            data/research/prop_mispricing/ufc_vegas120_v5_betting_logit030_no_cold_exclusion_20260808.csv
