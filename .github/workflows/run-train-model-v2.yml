name: Run Train Model V2

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: "Model training config path"
        required: false
        default: configs/models/moneyline_xgboost_v5.yaml
      artifact_dir:
        description: "Deprecated; artifact directory is resolved from the selected config"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: train-model-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train-model-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-workspace.txt

      - name: Train model
        run: |
          python -m pipeline.training.run_train_model \
            --config "${{ inputs.config_path }}"

      - name: Resolve artifact directory
        id: artifact_dir
        run: |
          artifact_dir=$(python - <<'PY'
          from pathlib import Path
          import yaml

          config_path = Path("${{ inputs.config_path }}")
          config = yaml.safe_load(config_path.read_text(encoding="utf-8")) or {}
          output_dir = (config.get("artifacts") or {}).get("output_dir")
          if not output_dir:
              raise SystemExit(f"Missing artifacts.output_dir in {config_path}")
          print(output_dir)
          PY
          )
          echo "artifact_dir=${artifact_dir}" >> "$GITHUB_OUTPUT"
          echo "Resolved artifact directory: ${artifact_dir}"

      - name: Commit model artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f "${{ steps.artifact_dir.outputs.artifact_dir }}"

          git commit -m "Update model training artifacts" || echo "No changes"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
