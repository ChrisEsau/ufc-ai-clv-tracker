name: Research Frozen KO Market Archetype 2026 Confirmation

on:
  pull_request:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths:
      - 'pipeline/research/analyze_ko_market_archetype_2026_confirmation.py'
      - 'data/research/prop_mispricing/ko_market_archetype_2026_freeze.json'
      - '.github/workflows/research-ko-market-archetype-2026-confirmation.yml'
  workflow_dispatch:

jobs:
  frozen-ko-archetype-2026:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'

      - name: Install pinned research environment
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install \
            pandas==3.0.5 \
            pyarrow==25.0.1 \
            numpy==2.4.6 \
            scikit-learn==1.9.0 \
            scipy==1.17.1 \
            xgboost==3.2.0 \
            joblib==1.5.3 \
            threadpoolctl==3.6.0 \
            python-dateutil==2.9.0.post0

      - name: Verify preregistration predates scorer execution
        run: |
          test -f data/research/prop_mispricing/ko_market_archetype_2026_freeze.json
          git log -1 --format='%H %s' -- data/research/prop_mispricing/ko_market_archetype_2026_freeze.json
          git log -1 --format='%H %s' -- pipeline/research/analyze_ko_market_archetype_2026_confirmation.py

      - name: Run untouched 2026 frozen-archetype confirmation
        run: |
          python -m pipeline.research.analyze_ko_market_archetype_2026_confirmation

      - name: Upload frozen-archetype confirmation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ko-market-archetype-2026-confirmation
          path: |
            data/research/prop_mispricing/ko_market_archetype_2026_qualifiers.csv
            data/research/prop_mispricing/ko_market_archetype_2026_confirmation_metrics.csv
            data/research/prop_mispricing/ko_market_archetype_2026_confirmation_summary.json
