name: Research KO Method Route Reallocation Audit

on:
  pull_request:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths:
      - 'pipeline/research/analyze_ko_method_route_reallocation.py'
      - '.github/workflows/research-ko-method-route-reallocation-audit.yml'
  workflow_dispatch:

jobs:
  ko-method-route-reallocation-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'

      - name: Install pinned research environment
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install \
            pandas==3.0.5 \
            pyarrow==25.0.1 \
            numpy==2.4.6 \
            scikit-learn==1.9.0 \
            scipy==1.17.1 \
            xgboost==3.2.0

      - name: Apply parquet string-date compatibility fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pipeline/research/analyze_ko_method_route_reallocation.py')
          s = p.read_text()
          old = 'pd.read_parquet(MASTER, filters=[("date", "<=", cutoff)]).copy()'
          new = 'pd.read_parquet(MASTER, filters=[("date", "<=", cutoff.strftime("%Y-%m-%d"))]).copy()'
          if old not in s:
              raise RuntimeError('expected master parquet cutoff expression not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Run winner-conditioned KO/SUB/DEC route reallocation audit
        run: python -m pipeline.research.analyze_ko_method_route_reallocation

      - name: Upload route reallocation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ko-method-route-reallocation-audit
          path: |
            data/research/prop_mispricing/ko_method_route_reallocation_summary.json
            data/research/prop_mispricing/ko_method_route_reallocation_side_rows.csv
            data/research/prop_mispricing/ko_method_route_reallocation_winners.csv
            data/research/prop_mispricing/ko_method_route_reallocation_thresholds.csv
            data/research/prop_mispricing/ko_method_route_reallocation_feature_bins.csv
            data/research/prop_mispricing/ko_method_route_reallocation_group_periods.csv
            data/research/prop_mispricing/ko_method_route_reallocation_group_summary.csv
            data/research/prop_mispricing/ko_method_route_reallocation_route_pairs.csv

# Research-only diagnostic. Do not merge PR #96 without explicit approval.
