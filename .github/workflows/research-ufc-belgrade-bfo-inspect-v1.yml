name: Research UFC Belgrade BFO Inspect V1
on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-ufc-belgrade-bfo-inspect-v1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Trace Rodriguez bout block assignments
        run: |
          python - <<'PY'
          import json,re,requests,unicodedata
          from bs4 import BeautifulSoup
          from difflib import SequenceMatcher
          from pathlib import Path
          def norm(s):return ''.join(ch for ch in unicodedata.normalize('NFKD',str(s)) if not unicodedata.combining(ch)).lower().strip()
          def ov(td):
            for sp in td.find_all('span'):
              z=sp.get_text(strip=True).replace('−','-')
              if re.fullmatch(r'[+-]\d+',z):return int(z)
          def bid(td):
            try:return int(json.loads(td.get('data-li'))[0])
            except:return None
          soup=BeautifulSoup(requests.get('https://www.bestfightodds.com/events/ufc-belgrade-4285',headers={'User-Agent':'Mozilla/5.0'}).text,'lxml')
          t=soup.find_all('table')[1]; rows=t.find_all('tr')
          fr=[]
          for i,tr in enumerate(rows):
            links=[a for a in tr.find_all('a',href=True) if '/fighters/' in a['href']]
            if links and 'pr' not in (tr.get('class') or []):fr.append((i,' '.join(links[-1].get_text(' ',strip=True).split())))
          out=[]
          out.append('FIGHTER ROWS FIRST 8 '+repr(fr[:8]))
          for j in range(len(fr)-1):
            i1,f1=fr[j]; i2,f2=fr[j+1]
            if set([f1,f2])!=set(['Daniel Rodriguez','Uros Medic']):continue
            end=fr[j+2][0] if j+2<len(fr) else len(rows)
            out.append(f'BLOCK j={j} start={i1},{i2} end={end} pair={f1}|{f2}')
            props={}
            for ri,tr in enumerate(rows[i2+1:end],start=i2+1):
              th=tr.find('th'); label=' '.join(th.get_text(' ',strip=True).split()) if th else ''
              lk=None
              if label.endswith(' wins by TKO/KO'):lk='ko'
              elif label.endswith(' wins by submission'):lk='sub'
              elif label.endswith(' wins by decision'):lk='dec'
              if not lk:continue
              prefix=label.rsplit(' wins by ',1)[0]
              s1=SequenceMatcher(None,norm(prefix),norm(f1)).ratio();s2=SequenceMatcher(None,norm(prefix),norm(f2)).ratio();side=1 if s1>=s2 else 2
              vals=[]
              for td in tr.find_all('td'):
                b=bid(td);o=ov(td)
                if b is not None and o is not None:
                  old=props.get((b,side,lk));props[(b,side,lk)]=o;vals.append((b,o,old))
              out.append(f'ROW {ri} label={label!r} prefix={prefix!r} sims={s1:.3f}/{s2:.3f} side={side} vals={vals}')
            out.append('FINAL FD '+repr({k:v for k,v in props.items() if k[0]==21}))
          p=Path('data/research/prop_mispricing/ufc_belgrade_bfo_trace_v1.txt');p.write_text('\n'.join(out));print('\n'.join(out))
          PY
      - name: Commit inspection output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/research/prop_mispricing/ufc_belgrade_bfo_trace_v1.txt
          git diff --cached --quiet || git commit -m 'research: trace Belgrade Rodriguez prop assignment'
          git push
