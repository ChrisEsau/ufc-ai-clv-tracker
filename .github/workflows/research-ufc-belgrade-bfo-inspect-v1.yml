name: Research UFC Belgrade BFO Inspect V1
on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-ufc-belgrade-bfo-inspect-v1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Isolate embedded BestFightOdds prop payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests
          text=requests.get('https://www.bestfightodds.com/events/ufc-belgrade-4285',headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
          n='Rodriguez wins by TKO/KO'; pos=[]; p=0
          while True:
              i=text.find(n,p)
              if i<0: break
              pos.append(i); p=i+1
          chunks=[]
          for j,i in enumerate(pos):
              if i>100000:
                  chunks.append(f'=== occurrence {j} at {i} ===\n'+text[max(0,i-2500):i+6500])
          Path('data/research/prop_mispricing/ufc_belgrade_bfo_payload_v1.txt').write_text('\n\n'.join(chunks),encoding='utf-8')
          print('positions',pos)
          print(chunks[0][:6000] if chunks else 'no high-position payload')
          PY
      - name: Commit inspection output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/research/prop_mispricing/ufc_belgrade_bfo_payload_v1.txt
          git diff --cached --quiet || git commit -m 'research: isolate UFC Belgrade BFO prop payload'
          git push
