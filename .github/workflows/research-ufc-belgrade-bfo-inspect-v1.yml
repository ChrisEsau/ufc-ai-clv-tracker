name: Research UFC Belgrade BFO Inspect V1
on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-ufc-belgrade-bfo-inspect-v1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Inspect embedded BestFightOdds Belgrade market data
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests
          url='https://www.bestfightodds.com/events/ufc-belgrade-4285'
          text=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
          needles=['Rodriguez wins by TKO/KO','Rodriguez wins by submission','Rodriguez wins by decision','Daniel Rodriguez']
          out=[]
          for n in needles:
              starts=[]; p=0
              while True:
                  i=text.find(n,p)
                  if i<0: break
                  starts.append(i); p=i+1
              out.append(f'NEEDLE {n} COUNT {len(starts)} POS {starts[:20]}')
              for i in starts[:4]: out.append(text[max(0,i-1500):i+2500])
          p=Path('data/research/prop_mispricing/ufc_belgrade_bfo_embedded_v1.txt'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text('\n\n=====\n\n'.join(out),encoding='utf-8')
          print('\n'.join(out[:8]))
          PY
      - name: Commit inspection output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/research/prop_mispricing/ufc_belgrade_bfo_embedded_v1.txt
          git diff --cached --quiet || git commit -m 'research: capture embedded UFC Belgrade BFO data'
          git push
