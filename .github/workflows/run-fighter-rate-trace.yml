name: Run Fighter Rate Trace

on:
  workflow_dispatch:
    inputs:
      fighter_name:
        description: "Fighter name to trace"
        required: true
        default: "Michael Chandler"
      master_path:
        description: "Master parquet path"
        required: true
        default: "data/master/ufc_master.parquet"

permissions:
  contents: write

concurrency:
  group: run-fighter-rate-trace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-fighter-rate-trace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow

      - name: Run fighter rate trace
        run: |
          python -m pipeline.features.run_fighter_rate_trace \
            --fighter-name "${{ github.event.inputs.fighter_name }}" \
            --master-path "${{ github.event.inputs.master_path }}"

      - name: Commit fighter rate trace artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/audits/ufc_fighter_rate_trace.parquet \
            data/audits/ufc_fighter_rate_trace_preview.csv

          git commit -m "Update fighter rate trace audit" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
