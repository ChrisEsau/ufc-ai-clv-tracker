name: Event2 Strike Exposure Audit

on:
  push:
    branches:
      - research/schnell-costa-ewm05-sixway-20260826
    paths:
      - 'pipeline/research/run_event2_strike_exposure_audit.py'
      - '.github/workflows/event2-strike-exposure-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  strike-exposure-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install numpy pandas pyarrow scipy scikit-learn pyyaml joblib

      - name: Restore canonical historical state
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ github.token }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Run exposure audit
        run: |
          cp -a restored/canonical-weight-class-state/. data/
          python -m pipeline.research.run_event2_strike_exposure_audit \
            --paths-per-fight 10 \
            | tee event2-strike-exposure-audit.log

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event2-strike-exposure-audit-${{ github.run_id }}
          path: |
            data/research/event2_ko_hazard_v2/exposure-ledger.json
            data/research/event2_ko_hazard_v2/exposure-summary.json
            event2-strike-exposure-audit.log
          if-no-files-found: warn
          retention-days: 30
