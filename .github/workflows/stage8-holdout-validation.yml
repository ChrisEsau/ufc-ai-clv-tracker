name: Stage 8 Fresh Holdout Validation
on:
  push:
    branches: [refactor/event-clock-v2-brain-timeline]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy pandas pyarrow pytest
      - name: Restore and verify canonical historical FSR
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32645607979
      - run: |
          cp -a data/canonical-weight-class-state/. data/
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f data/fsr_v3/fsr_v3_latest.parquet
      - name: Execute second 100-fight fresh holdout
        run: python -m pipeline.simulation.event_clock_mc_v2.diagnostics.stage8_holdout_validation --fights 100 --paths-per-fight 20 --exclude-discovery-fights 125 --clinch-ratio 0.06 --ground-strike-multiplier 3.0 --submission-multiplier 0.3
      - uses: actions/upload-artifact@v4
        with:
          name: stage8-fresh-holdout
          path: data/diagnostics/event_clock_mc_v2/stage8_holdout_validation.json
          if-no-files-found: error
