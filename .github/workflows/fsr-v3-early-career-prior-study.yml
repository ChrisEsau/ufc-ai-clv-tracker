name: FSR V3 Early Career Prior Study

on:
  push:
    branches:
      - "feature/fsr-v3"
    paths:
      - "pipeline/fsr_v3/research/early_career_prior_strength_study.py"
      - "pipeline/fsr_v3/research/early_career_td_prior_refinement.py"
      - "pipeline/fsr_v3/research/cold_start_native_validation.py"
      - "pipeline/fsr_v3/cold_start/**"
      - "tests/fsr_v3/test_cold_start.py"
      - ".github/workflows/fsr-v3-early-career-prior-study.yml"
  pull_request:
    paths:
      - "pipeline/fsr_v3/research/early_career_prior_strength_study.py"
      - "pipeline/fsr_v3/research/early_career_td_prior_refinement.py"
      - "pipeline/fsr_v3/research/cold_start_native_validation.py"
      - "pipeline/fsr_v3/cold_start/**"
      - "tests/fsr_v3/test_cold_start.py"
      - ".github/workflows/fsr-v3-early-career-prior-study.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  early-career-prior-study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn pyarrow

      - name: Compile studies
        run: |
          python -m py_compile pipeline/fsr_v3/research/early_career_prior_strength_study.py
          python -m py_compile pipeline/fsr_v3/research/early_career_td_prior_refinement.py

      - name: Run native-target prior-strength study
        run: python -m pipeline.fsr_v3.research.early_career_prior_strength_study

      - name: Run takedown fine-grid refinement
        run: python -m pipeline.fsr_v3.research.early_career_td_prior_refinement

      - name: Upload coarse study outputs
        uses: actions/upload-artifact@v4
        with:
          name: fsr-v3-early-career-prior-study
          path: data/diagnostics/fsr_v3_early_career_prior/*.csv
          if-no-files-found: error

      - name: Upload takedown refinement outputs
        uses: actions/upload-artifact@v4
        with:
          name: fsr-v3-early-career-td-prior-refinement
          path: data/diagnostics/fsr_v3_early_career_td_prior_refinement/*.csv
          if-no-files-found: error

  cold-start-native-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cold-start dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy pyarrow duckdb kagglehub pytest

      - name: Run cold-start unit tests
        run: pytest -q tests/fsr_v3/test_cold_start.py

      - name: Download public MMA longitudinal dataset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import kagglehub
          root = Path(kagglehub.dataset_download("leandroiber/mmastats"))
          candidates = sorted(root.rglob("*.duckdb"))
          if not candidates:
              raise SystemExit(f"No DuckDB file found under {root}")
          db = candidates[0].resolve()
          print(f"MMA Global dataset: {db}")
          Path("mma_db_path.txt").write_text(str(db), encoding="utf-8")
          PY

      - name: Run held-out native validation
        shell: bash
        run: |
          MMA_DB="$(cat mma_db_path.txt)"
          python -m pipeline.fsr_v3.research.cold_start_native_validation \
            --mma-db "$MMA_DB" \
            --output-dir data/diagnostics/fsr_v3/cold_start_native_validation

      - name: Print cold-start summaries
        if: always()
        shell: bash
        run: |
          for f in data/diagnostics/fsr_v3/cold_start_native_validation/*_summary.csv; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              cat "$f"
            fi
          done
          if [ -f data/diagnostics/fsr_v3/cold_start_native_validation/manifest.json ]; then
            echo "===== manifest ====="
            cat data/diagnostics/fsr_v3/cold_start_native_validation/manifest.json
          fi

      - name: Upload cold-start outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsr-v3-cold-start-native-validation
          path: data/diagnostics/fsr_v3/cold_start_native_validation/
          if-no-files-found: warn
