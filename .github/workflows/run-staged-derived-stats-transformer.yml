name: Run Staged Derived Stats Transformer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-staged-derived-stats-transformer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull latest repo state
        run: |
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow

      - name: Run staged derived stats transformer
        run: |
          python run_staged_derived_stats_transformer.py

      - name: Commit derived stats outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add ufc_staged_master_rows_enriched.parquet
          git add ufc_staged_derived_stats_audit.parquet

          git commit -m "Update staged derived stats artifacts" || echo "No changes to commit"

          git pull --rebase origin main
          git push
