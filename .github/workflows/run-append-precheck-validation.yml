name: Run Append Precheck Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-append-precheck-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow

      - name: Run append precheck validation
        run: |
          python -m pipeline.data_maintenance.run_append_precheck_validation

      - name: Run staged final review
        run: |
          python -m pipeline.data_maintenance.run_staged_final_review

      - name: Commit append precheck and final review outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/audits/ufc_append_precheck.parquet
          git add -f data/audits/ufc_append_duplicate_check.parquet
          git add -f data/audits/ufc_append_required_field_audit.parquet
          git add -f data/audits/ufc_staged_final_review.parquet

          git commit -m "Update append precheck and final review artifacts" || echo "No changes to commit"

          git push
