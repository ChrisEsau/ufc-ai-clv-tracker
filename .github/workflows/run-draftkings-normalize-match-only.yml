name: Run DraftKings Normalize Match Only

on:
  workflow_dispatch:
    inputs:
      min_match_score:
        description: "Minimum market matching score"
        required: true
        default: "65"
        type: string

permissions:
  contents: write

concurrency:
  group: draftkings-normalize-match-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-draftkings-normalize-match-only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml scikit-learn==1.6.1 xgboost

      - name: Verify existing DraftKings diagnostic artifact
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path("data/market/draftkings_market_diagnostic.parquet")
          if not path.exists():
              raise FileNotFoundError(f"Missing required diagnostic artifact: {path}")

          df = pd.read_parquet(path)
          print("DraftKings diagnostic rows:", len(df))
          if "provider_event_id" in df.columns:
              print("Unique provider_event_id:", df["provider_event_id"].nunique(dropna=True))
              print(df["provider_event_id"].astype(str).value_counts(dropna=False).head(30).to_string())
          PY

      - name: Normalize DraftKings markets
        run: |
          python -m pipeline.market.run_normalize_provider_markets \
            --provider draftkings

      - name: Match DraftKings markets to live card
        run: |
          python -m pipeline.market.run_market_matching \
            --registry-path configs/market/providers/draftkings_ufc_registry.yaml \
            --min-match-score "${{ github.event.inputs.min_match_score }}"

      - name: Commit normalized and matched market outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/market/canonical_market_catalog.parquet \
            data/market/market_outcomes.parquet \
            data/audits/canonical_market_catalog_audit.parquet \
            data/audits/ufc_market_match_audit_v2.parquet

          git commit -m "Regenerate DraftKings normalized market artifacts" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
