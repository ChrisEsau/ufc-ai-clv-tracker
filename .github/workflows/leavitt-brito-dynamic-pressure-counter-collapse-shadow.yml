name: Leavitt Brito Dynamic Pressure Counter Collapse Shadow

on:
  push:
    branches:
      - research/leavitt-brito-dynamic-pressure-shadow-20260826
    paths:
      - .github/workflows/leavitt-brito-dynamic-pressure-counter-collapse-shadow.yml

permissions:
  contents: read
  actions: read

jobs:
  brito-counter-collapse-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Sparse shallow checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            configs
            config
            data/master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install numpy pandas pyarrow pyyaml scipy scikit-learn joblib

      - name: Restore canonical historical Brain MC inputs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ github.token }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Run matched-seed Brito counter-collapse shadow
        run: |
          cp -a restored/canonical-weight-class-state/. data/
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.leavitt_brito_dynamic_pressure_counter_collapse_shadow
