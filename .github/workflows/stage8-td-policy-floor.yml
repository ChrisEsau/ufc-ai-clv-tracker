name: Stage 8 TD Policy Floor Diagnostic

on:
  push:
    branches:
      - diagnostic/stage8-td-policy-floor
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  td-policy-floor:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install diagnostic dependencies
        run: python -m pip install --upgrade pip numpy pandas pyarrow

      - name: Restore canonical FSR V3 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Place and verify canonical FSR V3 artifact
        run: |
          test -f data/canonical-weight-class-state/fsr_v3/fsr_v3_prefight_snapshots.parquet
          cp -a data/canonical-weight-class-state/. data/
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f data/fsr_v3/fsr_v3_latest.parquet
          test -f data/fight_details/ufc_round_stats.parquet
          test -f data/master/ufc_master.parquet

      - name: Run TD policy representation audit
        run: |
          echo "GITHUB_SHA=${GITHUB_SHA}"
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.stage8_td_policy_floor --fights 100 --output data/diagnostics/event_clock_mc_v2/stage8_td_policy_floor.json

      - name: Run TD rate anchor shadow
        run: |
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.stage8_td_rate_anchor_shadow --fights 25 --paths-per-fight 50 --seed-base 20260825 --output data/diagnostics/event_clock_mc_v2/stage8_td_rate_anchor_shadow.json

      - name: Run ground structure decomposition
        run: |
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.stage8_ground_structure_decomposition --fights 25 --paths-per-fight 50 --seed-base 20260825 --output data/diagnostics/event_clock_mc_v2/stage8_ground_structure_decomposition.json

      - name: Run TD + ground rate anchor shadow
        run: |
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.stage8_td_ground_rate_anchor_shadow --fights 25 --paths-per-fight 50 --seed-base 20260825 --output data/diagnostics/event_clock_mc_v2/stage8_td_ground_rate_anchor_shadow.json

      - name: Run control exposure audit
        run: |
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.stage8_control_exposure_shadow --fights 25 --paths-per-fight 50

      - name: Upload diagnostic results
        uses: actions/upload-artifact@v4
        with:
          name: stage8-td-policy-floor
          path: |
            data/diagnostics/event_clock_mc_v2/stage8_td_policy_floor.json
            data/diagnostics/event_clock_mc_v2/stage8_td_rate_anchor_shadow.json
            data/diagnostics/event_clock_mc_v2/stage8_ground_structure_decomposition.json
            data/diagnostics/event_clock_mc_v2/stage8_td_ground_rate_anchor_shadow.json
          if-no-files-found: error
