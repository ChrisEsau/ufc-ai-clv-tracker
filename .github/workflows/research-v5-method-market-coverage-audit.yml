name: Research V5 Method Market Coverage Audit
on:
  push:
    paths:
      - 'data/research/prop_mispricing/v5_method_market_coverage_trigger.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1
      - name: Run method market coverage audit
        run: python pipeline/research/v5_method_market_coverage_audit.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/research/prop_mispricing/v5_method_market_coverage_audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Add historical method market coverage audit"
          git pull --rebase origin research/ufc-prop-mispricing-xgboost-20260829
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
