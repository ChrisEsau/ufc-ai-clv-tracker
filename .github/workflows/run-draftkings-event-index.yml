name: Run DraftKings Event Index

on:
  workflow_dispatch:
    inputs:
      league_nav_url:
        description: "Optional DraftKings UFC league navigation URL override"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: draftkings-event-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-draftkings-event-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DraftKings event index
        run: |
          if [ -n "${{ inputs.league_nav_url }}" ]; then
            python -m pipeline.market.run_draftkings_event_index \
              --url "${{ inputs.league_nav_url }}"
          else
            python -m pipeline.market.run_draftkings_event_index
          fi

      - name: Commit DraftKings event index artifact
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/market/draftkings_event_index.parquet

          git commit -m "Update DraftKings event index artifact" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
