name: Timing Exposure Schema Audit

on:
  push:
    branches: [research/ko-system-v3-from-scratch-20260826]
    paths:
      - 'pipeline/research/timing_exposure_schema_audit.py'
      - '.github/workflows/timing-exposure-schema-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            data/master
            data/fight_details
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pyarrow numpy
      - name: Audit
        run: python -m pipeline.research.timing_exposure_schema_audit | tee timing-exposure-schema-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: timing-exposure-schema-audit-${{ github.run_id }}
          path: timing-exposure-schema-audit.json
