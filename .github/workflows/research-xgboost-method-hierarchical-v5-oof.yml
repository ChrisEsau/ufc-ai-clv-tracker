name: Research XGBoost Method Hierarchical V5 OOF

on:
  workflow_dispatch:
  push:
    branches:
      - research/ufc-prop-mispricing-xgboost-20260829
    paths:
      - .github/workflows/research-xgboost-method-hierarchical-v5-oof.yml
      - pipeline/research/xgboost_market_offset_v5_frozen.py
      - pipeline/research/xgboost_method_hierarchical_v5_oof.py

permissions:
  contents: write

jobs:
  hierarchical-v5-oof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install pinned V5 environment
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install \
            pandas==3.0.5 \
            pyarrow==25.0.1 \
            numpy==2.4.6 \
            scikit-learn==1.9.0 \
            scipy==1.17.1 \
            xgboost==3.2.0 \
            joblib==1.5.3 \
            threadpoolctl==3.6.0 \
            python-dateutil==2.9.0.post0

      - name: Materialize exact frozen V5 data snapshot without replacing current research data
        run: |
          git show 7df1b61126be1f4e036b256d1c774c531b8a281f:data/market/historical_market_outcomes.parquet > /tmp/v5_historical_market_outcomes.parquet
          git show 7df1b61126be1f4e036b256d1c774c531b8a281f:data/features/moneyline_feature_view.parquet > /tmp/v5_moneyline_feature_view.parquet

      - name: Run hierarchical OOF test
        run: |
          python -m pipeline.research.xgboost_method_hierarchical_v5_oof \
            --v5-market /tmp/v5_historical_market_outcomes.parquet \
            --v5-features /tmp/v5_moneyline_feature_view.parquet

      - name: Commit research outputs safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/research/prop_mispricing/xgboost_market_offset_v5_frozen_standalone_oof.csv \
            data/research/prop_mispricing/xgboost_method_hierarchical_v5_oof_predictions.csv \
            data/research/prop_mispricing/xgboost_method_hierarchical_v5_oof_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "research: add frozen V5 hierarchical method OOF results"
          for i in 1 2 3 4 5; do
            git fetch origin research/ufc-prop-mispricing-xgboost-20260829
            git rebase origin/research/ufc-prop-mispricing-xgboost-20260829 || { git rebase --abort; sleep 2; continue; }
            git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829 && exit 0
            sleep 3
          done
          exit 1
