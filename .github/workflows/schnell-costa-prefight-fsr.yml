name: Schnell Costa Prefight FSR EWM05

on:
  push:
    branches:
      - research/schnell-costa-ewm05-sixway-20260826

permissions:
  contents: read
  actions: read

jobs:
  print-prefight-fsr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            configs
            config
            data/master
            data/fight_details
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow pyyaml scipy scikit-learn joblib
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ github.token }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Print exact prefight FSR rows
        shell: bash
        run: |
          set -o pipefail
          cp -a restored/canonical-weight-class-state/. data/
          python -m pipeline.research.print_schnell_costa_prefight_fsr
