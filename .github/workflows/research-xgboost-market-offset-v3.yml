name: Research XGBoost True Market Offset V3

on:
  push:
    branches:
      - research/ufc-prop-mispricing-xgboost-20260829
    paths:
      - .github/workflows/research-xgboost-market-offset-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xgboost-market-offset-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy scikit-learn xgboost

      - name: Run true market-offset residual experiment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from sklearn.metrics import brier_score_loss, log_loss, roc_auc_score
          import xgboost as xgb

          OUT = Path('data/research/prop_mispricing')
          OUT.mkdir(parents=True, exist_ok=True)

          market = pd.read_parquet('data/market/historical_market_outcomes.parquet').copy()
          market = market[(market['bookmaker'] == 'legacy_consensus') & (market['result_status'] == 'graded') & market['won'].notna()].copy()
          market['date'] = pd.to_datetime(market['date'], errors='coerce')
          market['won'] = market['won'].astype(bool).astype(int)
          market['implied_probability'] = pd.to_numeric(market['implied_probability'], errors='coerce')
          market['profit_per_100'] = pd.to_numeric(market['profit_per_100'], errors='coerce')
          market = market.dropna(subset=['date','implied_probability','profit_per_100']).copy()

          ml = market[market['market_key'] == 'moneyline'].copy()
          good = ml.groupby('fight_id').size()
          good = good[good == 2].index
          ml = ml[ml['fight_id'].isin(good)].copy()
          ml['market_overround'] = ml.groupby('fight_id')['implied_probability'].transform('sum')
          ml['fair_market_p'] = ml['implied_probability'] / ml['market_overround']

          # Canonical one-row-per-fight representation, identical to V2.
          red = ml[ml['outcome_side'].astype(str).eq('red')].copy()
          fv = pd.read_parquet('data/features/moneyline_feature_view.parquet').copy()

          deny_tokens = [
              'winner','result','target','label','finish_round','match_time_sec',
              'profit','odds','implied','market','actual','post_'
          ]

          def clean_numeric(c):
              if c not in fv.columns or not pd.api.types.is_numeric_dtype(fv[c]):
                  return False
              lc = c.lower()
              return not any(x in lc for x in deny_tokens)

          signed_diff_cols = sorted([
              c for c in fv.columns
              if clean_numeric(c)
              and c.lower().endswith('_diff')
              and 'abs_diff' not in c.lower()
              and '_abs_' not in c.lower()
          ])

          feature_cols = signed_diff_cols + ['market_overround']
          needed = ['fight_id'] + signed_diff_cols
          df = red.merge(fv[needed], on='fight_id', how='inner').sort_values(['date','fight_id']).copy()

          def clip_p(p):
              return np.clip(np.asarray(p, float), 1e-6, 1.0-1e-6)

          def logit(p):
              p = clip_p(p)
              return np.log(p/(1.0-p))

          def sigmoid(z):
              z = np.clip(np.asarray(z, float), -30.0, 30.0)
              return 1.0/(1.0+np.exp(-z))

          def metrics(y, p):
              p = clip_p(p)
              y = np.asarray(y, int)
              return {
                  'n': int(len(y)),
                  'brier': float(brier_score_loss(y, p)),
                  'log_loss': float(log_loss(y, p, labels=[0,1])),
                  'auc': float(roc_auc_score(y, p)) if len(np.unique(y)) == 2 else None,
              }

          params = {
              'max_depth': 3,
              'eta': 0.03,
              'subsample': 0.8,
              'colsample_bytree': 0.7,
              'min_child_weight': 8,
              'lambda': 5.0,
              'alpha': 0.5,
              'objective': 'binary:logistic',
              'eval_metric': 'logloss',
              'seed': 42,
              'nthread': 2,
          }
          num_boost_round = 350

          folds = [
              ('2021', '2020-12-31', '2021-01-01', '2021-12-31'),
              ('2022', '2021-12-31', '2022-01-01', '2022-12-31'),
              ('2023', '2022-12-31', '2023-01-01', '2023-12-31'),
              ('2024', '2023-12-31', '2024-01-01', '2024-12-31'),
          ]

          # Alpha=0 is exactly the market. This guarantees the shrinkage selector can
          # reject an unstable learned correction instead of forcing XGBoost authority.
          alpha_grid = [0.0, 0.10, 0.25, 0.50, 0.75, 1.00]
          oof_parts = []
          fold_diagnostics = []

          Xraw = df[feature_cols].replace([np.inf,-np.inf], np.nan)

          for fold_name, train_end, val_start, val_end in folds:
              train = df['date'] <= train_end
              val = (df['date'] >= val_start) & (df['date'] <= val_end)
              valid_cols = [c for c in feature_cols if Xraw.loc[train,c].notna().any()]
              med = Xraw.loc[train,valid_cols].median(numeric_only=True)
              Xtr = Xraw.loc[train,valid_cols].fillna(med).fillna(0.0)
              Xva = Xraw.loc[val,valid_cols].fillna(med).fillna(0.0)
              ytr = df.loc[train,'won'].astype(int).to_numpy()
              yva = df.loc[val,'won'].astype(int).to_numpy()
              mtr = logit(df.loc[train,'fair_market_p'])
              mva = logit(df.loc[val,'fair_market_p'])

              dtr = xgb.DMatrix(Xtr, label=ytr, base_margin=mtr, feature_names=valid_cols)
              dva = xgb.DMatrix(Xva, label=yva, base_margin=mva, feature_names=valid_cols)
              booster = xgb.train(params, dtr, num_boost_round=num_boost_round, verbose_eval=False)

              full_margin = booster.predict(dva, output_margin=True)
              correction = full_margin - mva

              fold_row = {
                  'fold': fold_name,
                  'train_n': int(train.sum()),
                  'validation_n': int(val.sum()),
                  'feature_count': len(valid_cols),
                  'market': metrics(yva, sigmoid(mva)),
                  'raw_correction_mean': float(np.mean(correction)),
                  'raw_correction_mean_abs': float(np.mean(np.abs(correction))),
                  'raw_correction_p95_abs': float(np.quantile(np.abs(correction), 0.95)),
                  'alphas': {},
              }
              for a in alpha_grid:
                  p = sigmoid(mva + a*correction)
                  ma = metrics(yva, p)
                  fold_row['alphas'][str(a)] = {
                      **ma,
                      'delta_log_loss_vs_market': float(ma['log_loss'] - fold_row['market']['log_loss']),
                      'delta_brier_vs_market': float(ma['brier'] - fold_row['market']['brier']),
                  }
              fold_diagnostics.append(fold_row)

              oof_parts.append(pd.DataFrame({
                  'fold': fold_name,
                  'fight_id': df.loc[val,'fight_id'].to_numpy(),
                  'date': df.loc[val,'date'].to_numpy(),
                  'won': yva,
                  'market_margin': mva,
                  'correction': correction,
              }))

          oof = pd.concat(oof_parts, ignore_index=True)
          alpha_selection = []
          for a in alpha_grid:
              p = sigmoid(oof['market_margin'].to_numpy() + a*oof['correction'].to_numpy())
              mm = metrics(oof['won'], sigmoid(oof['market_margin']))
              ma = metrics(oof['won'], p)
              alpha_selection.append({
                  'alpha': a,
                  'oof': ma,
                  'delta_log_loss_vs_market': float(ma['log_loss'] - mm['log_loss']),
                  'delta_brier_vs_market': float(ma['brier'] - mm['brier']),
              })

          selected_alpha = min(alpha_selection, key=lambda r: r['oof']['log_loss'])['alpha']

          # Final fit through 2024 only. 2025+ remains untouched until alpha is frozen.
          train = df['date'] <= '2024-12-31'
          test = df['date'] >= '2025-01-01'
          valid_cols = [c for c in feature_cols if Xraw.loc[train,c].notna().any()]
          med = Xraw.loc[train,valid_cols].median(numeric_only=True)
          Xtr = Xraw.loc[train,valid_cols].fillna(med).fillna(0.0)
          Xte = Xraw.loc[test,valid_cols].fillna(med).fillna(0.0)
          ytr = df.loc[train,'won'].astype(int).to_numpy()
          yte = df.loc[test,'won'].astype(int).to_numpy()
          mtr = logit(df.loc[train,'fair_market_p'])
          mte = logit(df.loc[test,'fair_market_p'])

          dtr = xgb.DMatrix(Xtr, label=ytr, base_margin=mtr, feature_names=valid_cols)
          dte = xgb.DMatrix(Xte, label=yte, base_margin=mte, feature_names=valid_cols)
          booster = xgb.train(params, dtr, num_boost_round=num_boost_round, verbose_eval=False)
          full_margin = booster.predict(dte, output_margin=True)
          correction = full_margin - mte
          p_market = sigmoid(mte)
          p_model = sigmoid(mte + selected_alpha*correction)

          market_metrics = metrics(yte, p_market)
          model_metrics = metrics(yte, p_model)

          # V2 benchmark, if present.
          v2_path = OUT/'xgboost_market_residual_v2_diffs_summary.json'
          v2 = None
          if v2_path.exists():
              with open(v2_path,'r',encoding='utf-8') as f:
                  v2j = json.load(f)
              v2 = v2j.get('final_test')

          summary = {
              'design': {
                  'name': 'true_market_offset_v3',
                  'one_row_per_fight': True,
                  'target_side': 'red',
                  'pair_probability_rule': 'p_blue = 1 - p_red',
                  'raw_r_b_features_used': False,
                  'fighter_features': 'signed prefight matchup diffs only',
                  'market_as_feature': False,
                  'market_role': 'fair_market_logit supplied as XGBoost base_margin',
                  'learned_quantity': 'additive tree correction to market log-odds',
                  'correction_shrinkage': 'alpha selected on pooled 2021-2024 chronological OOF log loss',
                  'alpha_grid': alpha_grid,
                  'alpha_zero_meaning': 'exact market baseline',
                  'final_test': '2025-01-01 onward; untouched until alpha frozen',
                  'hyperparameters': 'same tree complexity as V1/V2 where applicable',
              },
              'feature_count': len(valid_cols),
              'cv_folds': fold_diagnostics,
              'alpha_selection': alpha_selection,
              'selected_alpha': selected_alpha,
              'final_test': {
                  'train_n_fights': int(train.sum()),
                  'test_n_fights': int(test.sum()),
                  'market': market_metrics,
                  'v3_market_offset': model_metrics,
                  'delta_log_loss_vs_market': float(model_metrics['log_loss'] - market_metrics['log_loss']),
                  'delta_brier_vs_market': float(model_metrics['brier'] - market_metrics['brier']),
                  'raw_correction_mean': float(np.mean(correction)),
                  'raw_correction_mean_abs': float(np.mean(np.abs(correction))),
                  'raw_correction_p95_abs': float(np.quantile(np.abs(correction), 0.95)),
                  'shrunk_probability_move_mean_abs': float(np.mean(np.abs(p_model-p_market))),
                  'shrunk_probability_move_p95_abs': float(np.quantile(np.abs(p_model-p_market),0.95)),
                  'v2_benchmark': v2,
              }
          }

          test_red = df.loc[test, ['fight_id','date','won','fair_market_p','market_overround','outcome_label']].copy()
          test_red['market_logit'] = mte
          test_red['raw_tree_correction_logit'] = correction
          test_red['selected_alpha'] = selected_alpha
          test_red['model_p_red'] = p_model

          # Expand back to both sides for coherent edge/ROI diagnostics.
          side = ml[ml['fight_id'].isin(test_red['fight_id'])].copy()
          side = side.merge(test_red[['fight_id','model_p_red']], on='fight_id', how='inner')
          side['model_p'] = np.where(side['outcome_side'].astype(str).eq('red'), side['model_p_red'], 1.0-side['model_p_red'])
          side['edge'] = side['model_p'] - side['fair_market_p']

          roi = []
          for thr in [0.00,0.02,0.05,0.075,0.10,0.15]:
              g = side[side['edge'] >= thr]
              if len(g) == 0:
                  continue
              profit = np.where(g['won'].eq(1), g['profit_per_100'], -100.0)
              roi.append({
                  'min_edge': thr,
                  'n_bets': int(len(g)),
                  'win_rate': float(g['won'].mean()),
                  'avg_edge': float(g['edge'].mean()),
                  'roi': float(profit.mean()/100.0),
              })
          summary['final_test']['edge_buckets'] = roi
          summary['final_test']['max_pair_sum_error'] = float((side.groupby('fight_id')['model_p'].sum()-1.0).abs().max())

          # Correction-magnitude diagnostic: does larger disagreement become more useful?
          side['abs_edge'] = side['edge'].abs()
          q = pd.qcut(side['abs_edge'].rank(method='first'), 5, labels=False)
          mag = []
          for bucket in sorted(q.unique()):
              g = side[q == bucket]
              mag.append({
                  'quintile': int(bucket)+1,
                  'n': int(len(g)),
                  'mean_abs_edge': float(g['abs_edge'].mean()),
                  'mean_edge': float(g['edge'].mean()),
                  'win_rate': float(g['won'].mean()),
              })
          summary['final_test']['absolute_edge_quintiles'] = mag

          # Gain importance from true residual trees.
          gain = booster.get_score(importance_type='gain')
          summary['final_test']['top_features_by_gain'] = [
              {'feature': k, 'gain': float(v)}
              for k,v in sorted(gain.items(), key=lambda z:z[1], reverse=True)[:30]
          ]

          side.to_csv(OUT/'xgboost_market_offset_v3_test_predictions.csv', index=False)
          oof.to_csv(OUT/'xgboost_market_offset_v3_oof_corrections.csv', index=False)
          with open(OUT/'xgboost_market_offset_v3_summary.json','w',encoding='utf-8') as f:
              json.dump(summary,f,indent=2)

          print(json.dumps(summary,indent=2))
          PY

      - name: Commit research outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f \
            data/research/prop_mispricing/xgboost_market_offset_v3_summary.json \
            data/research/prop_mispricing/xgboost_market_offset_v3_test_predictions.csv \
            data/research/prop_mispricing/xgboost_market_offset_v3_oof_corrections.csv
          git commit -m "Add XGBoost true market-offset V3 results" || echo "No changes to commit"
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
