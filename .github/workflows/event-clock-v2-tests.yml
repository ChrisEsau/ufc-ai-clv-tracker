name: Event Clock V2 Tests

on:
  push:
    branches:
      - "feature/fsr-v3"
    paths:
      - "pipeline/simulation/event_clock_mc_v2/**"
      - "tests/simulation/event_clock_mc_v2/**"
      - ".github/workflows/event-clock-v2-tests.yml"
  pull_request:
    paths:
      - "pipeline/simulation/event_clock_mc_v2/**"
      - "tests/simulation/event_clock_mc_v2/**"
      - ".github/workflows/event-clock-v2-tests.yml"
  workflow_dispatch:

jobs:
  fsr-v3-adapter:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest numpy pandas scipy scikit-learn joblib pyarrow pyyaml
      - name: Compile Event Clock V2 modules
        run: python -m py_compile pipeline/simulation/event_clock_mc_v2/*.py tests/simulation/event_clock_mc_v2/*.py
      - name: Import Event Clock V2 integration modules
        run: python -c "import pipeline.simulation.event_clock_mc_v2.feature_builder; import pipeline.simulation.event_clock_mc_v2.inference; import pipeline.simulation.event_clock_mc_v2.fit_event_clock_bundle; import pipeline.simulation.event_clock_mc_v2.run_event_or_fight_frozen"
      - name: Run Event Clock V2 tests
        run: pytest -q tests/simulation/event_clock_mc_v2
