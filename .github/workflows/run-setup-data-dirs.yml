name: Setup Data Directories

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-data-dirs:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Data Directories
        run: |
          python run_setup_data_dirs.py

      - name: Verify Folder Structure
        run: |
          echo "=== DATA FOLDERS ==="
          find data -type d | sort

      - name: Add .gitkeep Files
        run: |
          touch data/master/.gitkeep
          touch data/staging/.gitkeep
          touch data/audits/.gitkeep
          touch data/status/.gitkeep
          touch data/backups/.gitkeep

      - name: Commit Folder Structure
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/

          git commit -m "Create UFC data folder structure" || echo "No changes to commit"

          git pull --rebase origin main
          git push