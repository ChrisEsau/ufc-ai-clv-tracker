name: Run Style Matchup Analysis

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Style matchup research config path
        required: false
        default: pipeline/research/style_matchups/style_config.yaml
      min_fights:
        description: Minimum fights required for edge-report rows
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  group: style-matchup-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  style-matchup-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-workspace.txt

      - name: Run style matchup analysis
        run: |
          python -m pipeline.research.style_matchups.evaluate_style_matchups \
            --config "${{ inputs.config_path }}" \
            --min-fights "${{ inputs.min_fights }}"

      - name: Commit style matchup analysis outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f \
            data/research/style_matchups/style_matchup_fights.parquet \
            data/research/style_matchups/style_matchup_matrix.csv \
            data/research/style_matchups/style_matchup_edge_report.csv \
            data/research/style_matchups/style_matchup_underdogs.csv \
            data/research/style_matchups/style_matchup_summary.json
          git commit -m "Update style matchup analysis outputs" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
