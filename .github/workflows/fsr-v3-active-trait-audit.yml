name: FSR V3 Active Trait Audit

on:
  push:
    branches:
      - "research/fsr-v3-active-trait-audit"
    paths:
      - "pipeline/fsr_v3/research/active_trait_audit_sources.py"
      - "pipeline/fsr_v3/research/kd_resistance_prior_variance_audit.py"
      - "pipeline/fsr_v3/research/run_kd_resistance_prior_variance_audit.py"
      - "pipeline/fsr_v3/research/submission_attempt_prior_variance_audit.py"
      - "pipeline/fsr_v3/research/run_submission_attempt_prior_variance_audit.py"
      - "pipeline/fsr_v3/research/submission_conversion_trait_audit.py"
      - "pipeline/fsr_v3/research/run_submission_conversion_trait_audit.py"
      - ".github/workflows/fsr-v3-active-trait-audit.yml"
  pull_request:
    paths:
      - "pipeline/fsr_v3/research/active_trait_audit_sources.py"
      - "pipeline/fsr_v3/research/kd_resistance_prior_variance_audit.py"
      - "pipeline/fsr_v3/research/run_kd_resistance_prior_variance_audit.py"
      - "pipeline/fsr_v3/research/submission_attempt_prior_variance_audit.py"
      - "pipeline/fsr_v3/research/run_submission_attempt_prior_variance_audit.py"
      - "pipeline/fsr_v3/research/submission_conversion_trait_audit.py"
      - "pipeline/fsr_v3/research/run_submission_conversion_trait_audit.py"
      - ".github/workflows/fsr-v3-active-trait-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Escape/retention already passed and its artifacts are committed on this
  # research branch. Do not burn runner time recomputing it on repair pushes.
  escape-prior-variance:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "escape audit already complete"

  kd-resistance-prior-variance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pandas scipy pyarrow scikit-learn pyyaml
      - name: Compile KD resistance audit
        run: |
          python -m py_compile pipeline/fsr_v3/research/active_trait_audit_sources.py
          python -m py_compile pipeline/fsr_v3/research/kd_resistance_prior_variance_audit.py
          python -m py_compile pipeline/fsr_v3/research/run_kd_resistance_prior_variance_audit.py
      - name: Run KD resistance audit
        shell: bash
        run: |
          mkdir -p data/diagnostics/fsr_v3/active_trait_audit/kd_resistance
          set -o pipefail
          python -m pipeline.fsr_v3.research.run_kd_resistance_prior_variance_audit 2>&1 | tee data/diagnostics/fsr_v3/active_trait_audit/kd_resistance/run.log
      - name: Upload KD resistance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsr-v3-kd-resistance-prior-variance-audit
          path: data/diagnostics/fsr_v3/active_trait_audit/kd_resistance/
          if-no-files-found: warn

  submission-attempt-prior-variance:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pandas scipy pyarrow
      - name: Compile submission attempt audit
        run: |
          python -m py_compile pipeline/fsr_v3/research/active_trait_audit_sources.py
          python -m py_compile pipeline/fsr_v3/research/submission_attempt_prior_variance_audit.py
          python -m py_compile pipeline/fsr_v3/research/run_submission_attempt_prior_variance_audit.py
      - name: Run submission attempt audit
        shell: bash
        run: |
          mkdir -p data/diagnostics/fsr_v3/active_trait_audit/submission_attempts
          set -o pipefail
          python -m pipeline.fsr_v3.research.run_submission_attempt_prior_variance_audit 2>&1 | tee data/diagnostics/fsr_v3/active_trait_audit/submission_attempts/run.log
      - name: Upload submission attempt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsr-v3-submission-attempt-prior-variance-audit
          path: data/diagnostics/fsr_v3/active_trait_audit/submission_attempts/
          if-no-files-found: warn

  submission-conversion-traits:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pandas scipy pyarrow
      - name: Compile submission conversion audit
        run: |
          python -m py_compile pipeline/fsr_v3/research/active_trait_audit_sources.py
          python -m py_compile pipeline/fsr_v3/research/submission_conversion_trait_audit.py
          python -m py_compile pipeline/fsr_v3/research/run_submission_conversion_trait_audit.py
      - name: Run submission conversion audit
        shell: bash
        run: |
          mkdir -p data/diagnostics/fsr_v3/active_trait_audit/submission_conversion
          set -o pipefail
          python -m pipeline.fsr_v3.research.run_submission_conversion_trait_audit 2>&1 | tee data/diagnostics/fsr_v3/active_trait_audit/submission_conversion/run.log
      - name: Upload submission conversion artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsr-v3-submission-conversion-trait-audit
          path: data/diagnostics/fsr_v3/active_trait_audit/submission_conversion/
          if-no-files-found: warn

  persist-results:
    if: always() && github.event_name == 'push'
    needs:
      - escape-prior-variance
      - kd-resistance-prior-variance
      - submission-attempt-prior-variance
      - submission-conversion-traits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/fsr-v3-active-trait-audit
      - name: Download KD resistance results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fsr-v3-kd-resistance-prior-variance-audit
          path: data/diagnostics/fsr_v3/active_trait_audit/kd_resistance
      - name: Download submission attempt results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fsr-v3-submission-attempt-prior-variance-audit
          path: data/diagnostics/fsr_v3/active_trait_audit/submission_attempts
      - name: Download submission conversion results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fsr-v3-submission-conversion-trait-audit
          path: data/diagnostics/fsr_v3/active_trait_audit/submission_conversion
      - name: Record job status
        run: |
          mkdir -p data/diagnostics/fsr_v3/active_trait_audit
          cat > data/diagnostics/fsr_v3/active_trait_audit/audit_run_status.txt <<EOF
          escape=success_previous_run
          kd_resistance=${{ needs.kd-resistance-prior-variance.result }}
          submission_attempts=${{ needs.submission-attempt-prior-variance.result }}
          submission_conversion=${{ needs.submission-conversion-traits.result }}
          source_sha=${{ github.sha }}
          EOF
      - name: Commit measurement results to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnostics/fsr_v3/active_trait_audit
          if git diff --cached --quiet; then
            echo "No audit artifacts to commit"
            exit 0
          fi
          git commit -m "Record repaired FSR V3 active trait audit results"
          git push origin HEAD:research/fsr-v3-active-trait-audit
