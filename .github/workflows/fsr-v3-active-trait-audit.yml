name: FSR V3 Active Trait Audit

on:
  push:
    branches:
      - "research/fsr-v3-active-trait-audit"
    paths:
      - "pipeline/fsr_v3/research/escape_prior_variance_audit.py"
      - "pipeline/fsr_v3/research/run_escape_prior_variance_audit.py"
      - ".github/workflows/fsr-v3-active-trait-audit.yml"
  pull_request:
    paths:
      - "pipeline/fsr_v3/research/escape_prior_variance_audit.py"
      - "pipeline/fsr_v3/research/run_escape_prior_variance_audit.py"
      - ".github/workflows/fsr-v3-active-trait-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  escape-prior-variance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install numpy pandas scipy pyarrow
      - name: Compile research audit
        run: |
          python -m py_compile pipeline/fsr_v3/research/escape_prior_variance_audit.py
          python -m py_compile pipeline/fsr_v3/research/run_escape_prior_variance_audit.py
      - name: Run escape retention audit
        run: python -m pipeline.fsr_v3.research.run_escape_prior_variance_audit
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsr-v3-escape-prior-variance-audit
          path: data/diagnostics/fsr_v3/active_trait_audit/escape/
          if-no-files-found: warn
