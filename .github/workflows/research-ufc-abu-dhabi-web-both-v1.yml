name: Research UFC Abu Dhabi Web ML + Method V1
on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-ufc-abu-dhabi-web-both-v1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow numpy scikit-learn xgboost
      - name: Score web-sourced Abu Dhabi ML and methods
        run: |
          python - <<'PY'
          import unicodedata
          from difflib import SequenceMatcher
          from pathlib import Path
          import numpy as np, pandas as pd
          from xgboost import XGBClassifier
          OUT=Path('data/research/prop_mispricing'); OUT.mkdir(parents=True,exist_ok=True)
          DATE='2026-07-25'
          K=['win_by_ko_tko_dq','win_by_submission','win_by_decision']
          # Archived closing/pre-fight prices sourced from MMA Index bout pages; Aliev-Davis from Betfair/BetMGM.
          boards={
          ('Magomed Ankalaev','Bogdan Guskov'):{'ml':{'Magomed Ankalaev':-535,'Bogdan Guskov':400},'m':{'Magomed Ankalaev':[-157,750,420],'Bogdan Guskov':[600,2500,1450]},'win':('Magomed Ankalaev','win_by_ko_tko_dq')},
          ('Ramazonbek Temirov','Steve Erceg'):{'ml':{'Ramazonbek Temirov':-105,'Steve Erceg':-115},'m':{'Ramazonbek Temirov':[240,1950,310],'Steve Erceg':[850,875,167]},'win':('Ramazonbek Temirov','win_by_ko_tko_dq')},
          ('Magomed Zaynukov','Damian Rzepecki'):{'ml':{'Magomed Zaynukov':-265,'Damian Rzepecki':215},'m':{'Magomed Zaynukov':[220,900,150],'Damian Rzepecki':[950,750,625]},'win':('Magomed Zaynukov','win_by_decision')},
          ('Rizvan Kuniev','Tyrell Fortune'):{'ml':{'Rizvan Kuniev':-360,'Tyrell Fortune':285},'m':{'Rizvan Kuniev':[205,850,155],'Tyrell Fortune':[750,2800,460]},'win':('Rizvan Kuniev','win_by_ko_tko_dq')},
          ('Abubakar Vagaev','Saygid Izagakhmaev'):{'ml':{'Abubakar Vagaev':-225,'Saygid Izagakhmaev':185},'m':{'Abubakar Vagaev':[510,1150,-118],'Saygid Izagakhmaev':[1400,500,650]},'win':('Abubakar Vagaev','win_by_decision')},
          ('Valter Walker','Thomas Petersen'):{'ml':{'Valter Walker':-166,'Thomas Petersen':140},'m':{'Valter Walker':[600,163,435],'Thomas Petersen':[475,2100,355]},'win':('Valter Walker','win_by_submission')},
          ('Muhammad Said','Dustin Jacoby'):{'ml':{'Muhammad Said':154,'Dustin Jacoby':-185},'m':{'Muhammad Said':[380,1000,460],'Dustin Jacoby':[184,2200,230]},'win':('Muhammad Said','win_by_ko_tko_dq')},
          ('Sam Patterson','Santiago Ponzinibbio'):{'ml':{'Sam Patterson':-485,'Santiago Ponzinibbio':370},'m':{'Sam Patterson':[104,335,423],'Santiago Ponzinibbio':[700,2800,950]},'win':('Sam Patterson','win_by_ko_tko_dq')},
          ('Axel Sola','Ismael Bonfim'):{'ml':{'Axel Sola':-192,'Ismael Bonfim':160},'m':{'Axel Sola':[180,975,263],'Ismael Bonfim':[468,1050,475]},'win':('Axel Sola','win_by_submission')},
          ('Magomed Tuchalov','Brendson Ribeiro'):{'ml':{'Magomed Tuchalov':-850,'Brendson Ribeiro':575},'m':{'Magomed Tuchalov':[-257,700,750],'Brendson Ribeiro':[1000,1900,1900]},'win':('Magomed Tuchalov','win_by_decision')},
          ('Nurullo Aliev','Mike Davis'):{'ml':{'Nurullo Aliev':-225,'Mike Davis':175},'m':{'Nurullo Aliev':[400,1000,100],'Mike Davis':[600,750,500]},'win':('Nurullo Aliev','win_by_decision')},
          ('Abdul Hussein','Cody Gibson'):{'ml':{'Abdul Hussein':-650,'Cody Gibson':475},'m':{'Abdul Hussein':[233,195,250],'Cody Gibson':[1150,1300,1125]},'win':('Abdul Hussein','win_by_submission')},
          }
          def imp(o): return 100/(o+100) if o>0 else (-o)/((-o)+100)
          def norm(s): return ''.join(ch for ch in unicodedata.normalize('NFKD',str(s)) if not unicodedata.combining(ch)).replace('’',"'").lower().strip()
          def sim(a,b): return SequenceMatcher(None,norm(a),norm(b)).ratio()
          market=pd.read_parquet('data/market/historical_market_outcomes.parquet').copy(); market['date']=pd.to_datetime(market.date)
          market=market[(market.bookmaker=='legacy_consensus')&(market.result_status=='graded')&market.won.notna()].copy(); market['won']=market.won.astype(bool).astype(int)
          latest=pd.read_parquet('data/features/latest_fighter_state.parquet').copy(); latest['date']=pd.to_datetime(latest.date); ev=latest[latest.date.dt.strftime('%Y-%m-%d').eq(DATE)].copy()
          def pcols(df):
            z=[]
            for c in df.columns:
              if not pd.api.types.is_numeric_dtype(df[c]): continue
              l=c.lower(); allow=('_pre_' in l or l.startswith('pre_') or 'ewm_' in l or 'recent_form_' in l or l.endswith('_diff') or l.startswith('combined_') or l in {'older_fighter_age','reach_mismatch_abs','height_mismatch_abs','title_fight','total_rounds'}); deny=any(x in l for x in ['winner','result','target','label','finish_round','match_time_sec','profit','odds','implied','market','actual','post_'])
              if allow and not deny:z.append(c)
            return sorted(set(z))
          def sval(s,c):
            if c in {'title_fight','total_rounds'}: return s.get(c,np.nan)
            for pref in ('r_pre_','b_pre_'):
              if c.startswith(pref): return s.get(c[len(pref):],np.nan)
            for pref in ('r_ewm_','b_ewm_'):
              if c.startswith(pref): return s.get('ewm_'+c[len(pref):],np.nan)
            for pref in ('r_recent_form_','b_recent_form_'):
              if c.startswith(pref): return s.get('form_delta_'+c[len(pref):],np.nan)
            return np.nan
          def build(red,blue,cols):
            rec={}; mapped=0
            for c in cols:
              if c in {'title_fight','total_rounds'}: rec[c]=red.get(c,np.nan)
              elif c.startswith(('r_pre_','r_ewm_','r_recent_form_')): rec[c]=sval(red,c)
              elif c.startswith(('b_pre_','b_ewm_','b_recent_form_')): rec[c]=sval(blue,c)
              elif c=='older_fighter_age': rec[c]=max(red.get('age',np.nan),blue.get('age',np.nan))
              elif c=='reach_mismatch_abs': rec[c]=abs(red.get('reach',np.nan)-blue.get('reach',np.nan))
              elif c=='height_mismatch_abs': rec[c]=abs(red.get('height',np.nan)-blue.get('height',np.nan))
              elif c.endswith('_diff'):
                rec[c]=np.nan; stem=c[:-5]
                for base in [stem,'ewm_'+stem,'form_delta_'+stem]:
                  if base in red.index and base in blue.index and pd.notna(red.get(base)) and pd.notna(blue.get(base)): rec[c]=red.get(base)-blue.get(base); break
              elif c.startswith('combined_'):
                rec[c]=np.nan; stem=c[9:]
                for base in [stem,'ewm_'+stem,'form_delta_'+stem]:
                  if base in red.index and base in blue.index and pd.notna(red.get(base)) and pd.notna(blue.get(base)): rec[c]=(red.get(base)+blue.get(base))/2; break
              else: rec[c]=np.nan
              mapped+=int(pd.notna(rec[c]))
            return rec,mapped
          fights=[]
          for fid,g in ev.groupby('fight_id'):
            r=g[g.corner.astype(str).str.lower().eq('red')]; b=g[g.corner.astype(str).str.lower().eq('blue')]
            if not r.empty and not b.empty:fights.append((fid,r.iloc[0],b.iloc[0]))
          def match_board(r,b,used):
            best=None
            for pair,bd in boards.items():
              if pair in used:continue
              sc=max((sim(r.fighter_name,pair[0])+sim(b.fighter_name,pair[1]))/2,(sim(r.fighter_name,pair[1])+sim(b.fighter_name,pair[0]))/2)
              if best is None or sc>best[0]:best=(sc,pair,bd)
            return best
          # ML trainer
          fv=pd.read_parquet('data/features/moneyline_feature_view.parquet').copy(); fv['date']=pd.to_datetime(fv.date); cols=pcols(fv); dif=[c for c in cols if c.endswith('_diff')]
          mm=market[market.market_key.eq('moneyline')].copy(); good=mm.groupby('fight_id').size(); mm=mm[mm.fight_id.isin(good[good==2].index)].copy(); mm['market_overround']=mm.groupby('fight_id').implied_probability.transform('sum'); mm['fair_market_p']=mm.implied_probability/mm.market_overround
          d=mm.merge(fv[['fight_id']+cols],on='fight_id',how='inner'); blue=d.outcome_side.astype(str).eq('blue'); d.loc[blue,dif]=-d.loc[blue,dif]; fc=cols+['fair_market_p','market_overround']; X=d[fc].replace([np.inf,-np.inf],np.nan); valid=[c for c in fc if X[c].notna().any()]; tr=d.date<='2022-12-31'; va=(d.date>='2023-01-01')&(d.date<='2024-12-31'); med=X.loc[tr,valid].median(numeric_only=True); X=X[valid].fillna(med).fillna(0)
          mlm=XGBClassifier(n_estimators=350,max_depth=3,learning_rate=.03,subsample=.8,colsample_bytree=.7,min_child_weight=8,reg_lambda=5,reg_alpha=.5,objective='binary:logistic',eval_metric='logloss',random_state=42,n_jobs=2); mlm.fit(X.loc[tr],d.loc[tr,'won'],eval_set=[(X.loc[va],d.loc[va,'won'])],verbose=False)
          mlrows=[]; used=set()
          for fid,r,b in fights:
            sc,pair,bd=match_board(r,b,used); used.add(pair); feat,mapped=build(r,b,cols); ips={n:imp(o) for n,o in bd['ml'].items()}; over=sum(ips.values())
            for side,s in [('red',r),('blue',b)]:
              name=max(bd['ml'],key=lambda x:sim(s.fighter_name,x)); rec=dict(feat)
              if side=='blue':
                for c in dif:
                  if pd.notna(rec.get(c)):rec[c]=-rec[c]
              rec.update({'fight_id':fid,'fighter':name,'side':side,'american_odds':bd['ml'][name],'fair_market_p':ips[name]/over,'actual_win':int(name==bd['win'][0]),'mapped_predictors':mapped,'total_predictors':len(cols),'market_overround':over})
              xs=pd.DataFrame([rec]).reindex(columns=valid).replace([np.inf,-np.inf],np.nan).fillna(med).fillna(0); rec['model_p']=float(mlm.predict_proba(xs)[0,1]); rec['edge']=rec['model_p']-rec['fair_market_p']; mlrows.append(rec)
          mlout=pd.DataFrame(mlrows); mlkeep=['fight_id','fighter','side','american_odds','fair_market_p','model_p','edge','actual_win','mapped_predictors','total_predictors']; mlout[mlkeep].to_csv(OUT/'ufc_abu_dhabi_moneyline_web_v1.csv',index=False); print('ML fights',mlout.fight_id.nunique()); print(mlout[mlkeep].sort_values('edge',ascending=False).to_string(index=False))
          # method trainers
          fv2=pd.read_parquet('data/features/prop_method_of_victory_feature_view.parquet').copy(); fv2['date']=pd.to_datetime(fv2.date); cols2=pcols(fv2); dif2=[c for c in cols2 if c.endswith('_diff')]; meth=market[market.market_key.isin(K)].copy(); good=meth.groupby('fight_id').size(); meth=meth[meth.fight_id.isin(good[good==6].index)].copy(); meth['market_overround']=meth.groupby('fight_id').implied_probability.transform('sum'); meth['fair_market_p']=meth.implied_probability/meth.market_overround
          models={}
          for key in K:
            dk=meth[meth.market_key.eq(key)].merge(fv2[['fight_id']+cols2],on='fight_id',how='inner'); blu=dk.outcome_side.astype(str).eq('blue'); dk.loc[blu,dif2]=-dk.loc[blu,dif2]; fc2=cols2+['fair_market_p','market_overround']; xx=dk[fc2].replace([np.inf,-np.inf],np.nan); v=[c for c in fc2 if xx[c].notna().any()]; tr2=dk.date<='2022-12-31'; va2=(dk.date>='2023-01-01')&(dk.date<='2024-12-31'); md=xx.loc[tr2,v].median(numeric_only=True); xx=xx[v].fillna(md).fillna(0); m=XGBClassifier(n_estimators=350,max_depth=3,learning_rate=.03,subsample=.8,colsample_bytree=.7,min_child_weight=8,reg_lambda=5,reg_alpha=.5,objective='binary:logistic',eval_metric='logloss',random_state=42,n_jobs=2); m.fit(xx.loc[tr2],dk.loc[tr2,'won'],eval_set=[(xx.loc[va2],dk.loc[va2,'won'])],verbose=False); models[key]=(m,v,md)
          mrows=[]; used=set()
          for fid,r,b in fights:
            sc,pair,bd=match_board(r,b,used); used.add(pair); feat,mapped=build(r,b,cols2); raw=[]
            for n,vals in bd['m'].items():
              for key,o in zip(K,vals):raw.append((n,key,o,imp(o)))
            over=sum(x[3] for x in raw)
            for n,key,o,ip in raw:
              side='red' if sim(r.fighter_name,n)>=sim(b.fighter_name,n) else 'blue'; rec=dict(feat)
              if side=='blue':
                for c in dif2:
                  if pd.notna(rec.get(c)):rec[c]=-rec[c]
              rec.update({'fight_id':fid,'fighter':n,'side':side,'market_key':key,'american_odds':o,'fair_market_p':ip/over,'actual_hit':int((n,key)==bd['win']),'mapped_predictors':mapped,'total_predictors':len(cols2),'market_overround':over}); m,v,md=models[key]; xs=pd.DataFrame([rec]).reindex(columns=v).replace([np.inf,-np.inf],np.nan).fillna(md).fillna(0); rec['model_p']=float(m.predict_proba(xs)[0,1]); rec['edge']=rec['model_p']-rec['fair_market_p']; mrows.append(rec)
          mout=pd.DataFrame(mrows); mkeep=['fight_id','fighter','side','market_key','american_odds','fair_market_p','model_p','edge','actual_hit','mapped_predictors','total_predictors']; mout[mkeep].to_csv(OUT/'ufc_abu_dhabi_method_web_v1.csv',index=False); print('METHOD fights',mout.fight_id.nunique()); print(mout[mkeep].sort_values('edge',ascending=False).to_string(index=False))
          if mlout.fight_id.nunique()!=12 or mout.fight_id.nunique()!=12: raise RuntimeError(f'Expected 12/12 fights, got ML {mlout.fight_id.nunique()} method {mout.fight_id.nunique()}')
          PY
      - name: Commit outputs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f data/research/prop_mispricing/ufc_abu_dhabi_*_web_v1.csv
          git commit -m 'Add web-sourced UFC Abu Dhabi ML and method scores' || echo No-changes
          git pull --rebase origin research/ufc-prop-mispricing-xgboost-20260829 || true
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
