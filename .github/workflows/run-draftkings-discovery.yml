name: Run DraftKings Discovery

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: "DraftKings event ID to discover"
        required: true
        type: string
      subcategory_id:
        description: "Optional single DraftKings subcategory ID"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: draftkings-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-draftkings-discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml

      - name: Run DraftKings Discovery
        run: |
          if [ -n "${{ inputs.subcategory_id }}" ]; then
            python -m pipeline.market.run_draftkings_discovery \
              --event-id "${{ inputs.event_id }}" \
              --subcategory-id "${{ inputs.subcategory_id }}"
          else
            python -m pipeline.market.run_draftkings_discovery \
              --event-id "${{ inputs.event_id }}"
          fi

      - name: Commit DraftKings discovery artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/market/draftkings_market_diagnostic.parquet \
            data/market/draftkings_raw_index.parquet \
            data/market/raw/draftkings

          git commit -m "Update DraftKings discovery artifacts" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
