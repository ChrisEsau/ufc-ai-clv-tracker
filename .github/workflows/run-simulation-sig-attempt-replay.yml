name: Simulator Strike Distribution Replay

on:
  workflow_dispatch:
  push:
    branches:
      - feature/round-fight-simulator-v0
    paths:
      - ".github/workflows/run-simulation-sig-attempt-replay.yml"
      - "pipeline/simulation/round_parameter_provider.py"
      - "pipeline/simulation/sig_attempt_replay.py"
      - "pipeline/simulation/run_replay_sig_attempt_distribution.py"
      - "pipeline/simulation/sig_attempt_calibration.py"
      - "pipeline/simulation/run_calibrate_sig_attempt_model.py"
      - "pipeline/simulation/sig_attempt_model.py"
      - "pipeline/simulation/run_train_sig_attempt_model.py"
      - "pipeline/simulation/artifacts.py"
      - "tests/test_simulation_sig_attempt_replay.py"

permissions:
  contents: read

jobs:
  replay-strike-distribution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout simulator branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run provider and replay tests
        run: |
          python -m unittest tests.test_simulation_sig_attempt_replay
          python -m unittest tests.test_simulation_sig_attempt_calibration
          python -m unittest tests.test_simulation_sig_attempt_model
          python -m unittest tests.test_simulation_terminal_round
          python -m compileall -q pipeline/simulation

      - name: Build leakage-safe fighter-round table
        run: |
          python -m pipeline.simulation.run_build_training_dataset

      - name: Rebuild walk-forward strike benchmark
        run: |
          python -m pipeline.simulation.run_train_sig_attempt_model

      - name: Rebuild sequential calibration
        run: |
          python -m pipeline.simulation.run_calibrate_sig_attempt_model

      - name: Replay calibrated strike distribution
        run: |
          python -m pipeline.simulation.run_replay_sig_attempt_distribution

      - name: Publish replay summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/model_lab/simulation/models/sig_attempt_pace_v0/"
              "replay/replay_summary.json"
          )
          summary = json.loads(path.read_text(encoding="utf-8"))

          with Path("sig_attempt_replay_summary.md").open("w", encoding="utf-8") as handle:
              handle.write("# Significant-strike distribution replay\n\n")
              handle.write(f"- Replay rows: **{summary['replay_rows']:,}**\n")
              handle.write(f"- Replay fights: **{summary['replay_fights']:,}**\n")
              handle.write(
                  f"- Best distribution by NLL: **{summary['best_distribution_by_nll']}**\n"
              )
              handle.write(
                  "- Gamma-Poisson NLL improvement vs calibrated Poisson: "
                  f"**{summary['gamma_poisson_nll_improvement_vs_calibrated_poisson']:.2%}**\n"
              )
              handle.write(
                  "- Paired actual count correlation: "
                  f"**{summary['paired_actual_count_correlation']:.4f}**\n"
              )
              handle.write(
                  "- Paired predicted-mean correlation: "
                  f"**{summary['paired_predicted_mean_correlation']:.4f}**\n"
              )
              handle.write(
                  "- Paired residual correlation: "
                  f"**{summary['paired_residual_correlation']:.4f}**\n\n"
              )
              handle.write("## Aggregate distribution metrics\n\n")
              handle.write("| Distribution | NLL | Poisson deviance | Bias | Variance ratio |\n")
              handle.write("|---|---:|---:|---:|---:|\n")
              for row in summary["aggregate_metrics"]:
                  handle.write(
                      f"| {row['distribution']} | "
                      f"{row['mean_negative_log_likelihood']:.4f} | "
                      f"{row['count_poisson_deviance']:.4f} | "
                      f"{row['mean_bias']:.3f} | "
                      f"{row['variance_ratio_predicted_to_actual']:.3f} |\n"
                  )
              handle.write("\n## Interval coverage\n\n")
              handle.write("| Distribution | Nominal | Empirical | Error | Width |\n")
              handle.write("|---|---:|---:|---:|---:|\n")
              for row in summary["interval_coverage"]:
                  handle.write(
                      f"| {row['distribution']} | "
                      f"{row['nominal_coverage']:.0%} | "
                      f"{row['empirical_coverage']:.2%} | "
                      f"{row['coverage_error']:.2%} | "
                      f"{row['mean_interval_width']:.2f} |\n"
                  )
          PY

          cat sig_attempt_replay_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload strike replay artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simulator-sig-attempt-replay-v0
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: |
            data/model_lab/simulation/models/sig_attempt_pace_v0/**
            data/audits/simulation_fighter_round_training_audit.parquet
            sig_attempt_replay_summary.md
