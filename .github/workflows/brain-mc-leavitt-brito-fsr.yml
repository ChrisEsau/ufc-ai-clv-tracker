name: Leavitt Brito FSR Prefight Diagnostic

on:
  push:
    branches: [research/brain-mc-muhammad-bonfim-500-20260826]
    paths:
      - ".github/workflows/brain-mc-leavitt-brito-fsr.yml"

permissions:
  contents: read
  actions: read

jobs:
  dump-fsr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install pandas pyarrow

      - name: Restore canonical historical Brain MC inputs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32645607979

      - name: Dump exact prefight FSR rows
        run: |
          cp -a restored/canonical-weight-class-state/. data/
          python - <<'PY'
          import pandas as pd
          p='data/fsr_v3/fsr_v3_prefight_snapshots.parquet'
          df=pd.read_parquet(p)
          names={'Jordan Leavitt','Joanderson Brito'}
          mask=pd.Series(False,index=df.index)
          for c in ['fighter_name','fighter','r_name','b_name','red_fighter','blue_fighter']:
              if c in df.columns:
                  mask |= df[c].astype(str).isin(names)
          for c in ['opponent_name','opponent']:
              if c in df.columns:
                  mask |= df[c].astype(str).isin(names)
          sub=df.loc[mask].copy()
          for c in ['fight_date','date','event_date']:
              if c in sub.columns:
                  dt=pd.to_datetime(sub[c],errors='coerce')
                  exact=sub.loc[dt.dt.strftime('%Y-%m-%d').eq('2026-06-06')]
                  if len(exact): sub=exact; break
          for c in ['bout_id','fight_id']:
              if c in sub.columns:
                  exact=sub.loc[sub[c].astype(str).eq('44cfbb8c3c356c65')]
                  if len(exact): sub=exact; break
          print('COLUMNS:', list(df.columns))
          print('MATCHING_ROWS:', len(sub))
          pd.set_option('display.max_columns', None)
          pd.set_option('display.width', 500)
          pd.set_option('display.max_colwidth', 120)
          print(sub.to_string(index=False))
          PY
