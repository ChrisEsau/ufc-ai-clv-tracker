name: Muhammad Bonfim Calibrated Attempt Shadow

on:
  push:
    branches:
      - research/muhammad-bonfim-calibrated-attempt-shadow-20260826
    paths:
      - .github/workflows/muhammad-bonfim-calibrated-attempt-shadow.yml
      - pipeline/simulation/event_clock_mc_v2/diagnostics/muhammad_bonfim_calibrated_attempt_shadow.py

permissions:
  contents: read
  actions: read

jobs:
  muhammad-bonfim-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Sparse shallow checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            configs
            config
            data/master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install numpy pandas pyarrow pyyaml scipy scikit-learn joblib

      - name: Restore canonical historical Brain MC inputs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Run Muhammad Bonfim calibrated shadow only
        run: |
          cp -a restored/canonical-weight-class-state/. data/
          mkdir -p artifacts/muhammad-bonfim-shadow
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.muhammad_bonfim_calibrated_attempt_shadow \
            | tee artifacts/muhammad-bonfim-shadow/result.txt

      - name: Upload shadow result
        uses: actions/upload-artifact@v4
        with:
          name: muhammad-bonfim-calibrated-attempt-shadow-${{ github.run_id }}
          path: artifacts/muhammad-bonfim-shadow/result.txt
          if-no-files-found: error
          retention-days: 30
