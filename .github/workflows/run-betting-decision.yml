name: Run Betting Decision

on:
  workflow_dispatch:

# Scheduled runs are temporarily disabled while Market Pipeline V2 replaces
# the legacy cron-driven odds, betting, and CLV flow.

permissions:
  contents: write

jobs:
  run-betting-decision:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow requests joblib scikit-learn==1.6.1 xgboost

      - name: Run betting decision engine
        run: |
          python run_betting_decision.py

      - name: Commit betting outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/predictions/ufc_betting_board.parquet \
            data/predictions/ufc_live_watchlist.parquet \
            data/predictions/ufc_official_bets.parquet

          git commit -m "Update betting decision outputs" || echo "No changes to commit"

          git push
