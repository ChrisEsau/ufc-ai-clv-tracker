name: Research Standalone Glicko Six Way

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - 'pipeline/research/standalone_glicko_six_way.py'
      - 'pipeline/research/standalone_glicko_six_way_gated.py'
      - 'pipeline/research/standalone_glicko_six_way_partial_sweep.py'
      - '.github/workflows/research-standalone-glicko-six-way.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas pyarrow
      - name: Run partial negative-evidence Glicko six-way sweep
        run: python -m pipeline.research.standalone_glicko_six_way_partial_sweep --holdout-from 2025-01-01
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-glicko-six-way-partial-sweep
          path: data/diagnostics/standalone_glicko_six_way_partial_sweep/
