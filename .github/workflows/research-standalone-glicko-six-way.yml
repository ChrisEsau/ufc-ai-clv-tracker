name: Research Standalone Glicko Six Way

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - 'pipeline/research/inspect_dev_ufc_market_odds.py'
      - '.github/workflows/research-standalone-glicko-six-way.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Download dev historical market odds parquet
        run: curl -L 'https://raw.githubusercontent.com/ChrisEsau/ufc-ai-clv-tracker/dev/data/market/ufc_market_odds.parquet' -o /tmp/ufc_market_odds.parquet
      - name: Inspect dev UFC market odds schema
        run: python -m pipeline.research.inspect_dev_ufc_market_odds
