name: Research Standalone Glicko Six Way

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - 'pipeline/research/glicko_six_way_market_benchmark.py'
      - 'pipeline/research/glicko_winner_market490_benchmark.py'
      - 'pipeline/research/whr_winner_market490_benchmark.py'
      - 'pipeline/research/standalone_glicko_six_way_enhanced_sub.py'
      - '.github/workflows/research-standalone-glicko-six-way.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas pyarrow scipy scikit-learn
      - name: Run enhanced Glicko-6 holdout
        run: python -m pipeline.research.standalone_glicko_six_way_enhanced_sub
      - name: Download historical six-way market outcomes from dev
        run: curl -L 'https://raw.githubusercontent.com/ChrisEsau/ufc-ai-clv-tracker/dev/data/market/historical_market_outcomes.parquet' -o /tmp/historical_market_outcomes.parquet
      - name: Compare enhanced Glicko-6 with no-vig market
        run: python -m pipeline.research.glicko_six_way_market_benchmark
      - name: Run standalone winner Glicko on matched market cohort
        run: python -m pipeline.research.glicko_winner_market490_benchmark
      - name: Run canonical WHR winner on matched market cohort
        run: python -m pipeline.research.whr_winner_market490_benchmark
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: glicko-six-way-market-benchmark
          path: |
            data/diagnostics/glicko_six_way_market_benchmark/
            data/diagnostics/glicko_winner_market490/
            data/diagnostics/whr_winner_market490/
