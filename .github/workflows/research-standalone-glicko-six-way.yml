name: Research Standalone Glicko Six Way

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - 'pipeline/research/submission_incremental_signal_test.py'
      - '.github/workflows/research-standalone-glicko-six-way.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas pyarrow
      - name: Run incremental submission signal test
        run: python -m pipeline.research.submission_incremental_signal_test --holdout-from 2025-01-01
      - uses: actions/upload-artifact@v4
        with:
          name: submission-incremental-signal
          path: data/diagnostics/submission_incremental_signal/
