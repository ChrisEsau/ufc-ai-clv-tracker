name: Research Standalone Glicko Six Way

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - 'pipeline/research/inspect_clv_method_schema.py'
      - '.github/workflows/research-standalone-glicko-six-way.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Inspect CLV method market schema
        run: python -m pipeline.research.inspect_clv_method_schema
