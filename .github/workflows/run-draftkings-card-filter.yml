name: Run DraftKings Card Filter

on:
  workflow_dispatch:
    inputs:
      min_match_score:
        description: "Minimum pair score required to match DraftKings event to live-card fight"
        required: true
        default: "80"
        type: string
      min_single_score:
        description: "Minimum individual fighter score required to match"
        required: true
        default: "70"
        type: string

permissions:
  contents: write

concurrency:
  group: draftkings-card-filter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-draftkings-card-filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DraftKings card filter
        run: |
          python -m pipeline.market.run_draftkings_card_filter \
            --min-match-score "${{ inputs.min_match_score }}" \
            --min-single-score "${{ inputs.min_single_score }}"

      - name: Commit DraftKings card filter artifact
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/market/draftkings_event_card_matches.parquet

          git commit -m "Update DraftKings event card matches artifact" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
