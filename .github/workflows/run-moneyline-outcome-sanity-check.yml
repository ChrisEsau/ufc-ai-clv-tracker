name: Run Moneyline Outcome Sanity Check

on:
  workflow_dispatch:
    inputs:
      model_mode:
        description: "Model mode: production, all, or single"
        required: true
        default: "single"
        type: choice
        options:
          - production
          - all
          - single
      large_edge_threshold:
        description: "Absolute edge threshold for large-edge review flags"
        required: false
        default: "0.20"

permissions:
  contents: write

concurrency:
  group: moneyline-outcome-sanity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-moneyline-outcome-sanity-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml pyarrow

      - name: Run Moneyline Outcome Sanity Check
        run: |
          python -m pipeline.betting.run_moneyline_outcome_sanity_check \
            --model-mode "${{ github.event.inputs.model_mode }}" \
            --large-edge-threshold "${{ github.event.inputs.large_edge_threshold }}"

      - name: Commit sanity artifact
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/audits/ufc_moneyline_outcome_sanity_check.parquet

          git commit -m "Update moneyline outcome sanity artifact" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
