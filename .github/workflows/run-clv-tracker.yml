name: Run UFC CLV Tracker

on:
  workflow_dispatch:

# Scheduled runs are temporarily disabled while Market Pipeline V2 replaces
# the legacy cron-driven odds, betting, and CLV flow.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: market-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-clv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy requests pyarrow joblib streamlit

      - name: Run CLV tracker
        run: |
          python -m pipeline.clv.run_clv_pipeline

      - name: Commit updated parquet files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/market/ufc_normalized_market_snapshots.parquet \
            data/audits/ufc_clv_market_normalization_audit.parquet \
            data/market/ufc_closing_lines.parquet \
            data/market/ufc_clv_results.parquet \
            data/market/ufc_line_movement.parquet \
            data/clv/ufc_model_candidate_tracker.parquet \
            data/clv/ufc_model_candidate_clv.parquet \
            data/bankroll/ufc_bet_ledger.parquet \
            data/bankroll/ufc_open_bets.parquet \
            data/bankroll/ufc_bankroll_snapshots.parquet
          git commit -m "Automated CLV update" || echo "No changes to commit"

          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
