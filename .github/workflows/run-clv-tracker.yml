name: Run UFC CLV Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0,15,30,45 * * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  run-clv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy requests pyarrow joblib streamlit

      - name: Run CLV tracker
        run: |
          python -m pipeline.clv.run_clv_pipeline

      - name: Commit updated parquet files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/market/ufc_market_snapshots.parquet \
            data/market/ufc_closing_lines.parquet \
            data/market/ufc_clv_results.parquet \
            data/market/ufc_line_movement.parquet
          git commit -m "Automated CLV update" || echo "No changes to commit"


          git push
