name: Run Repair Master Match Time

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-repair-master-match-time-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-repair-master-match-time:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow

      - name: Repair master match_time_sec
        run: |
          python -m pipeline.data_maintenance.run_repair_master_match_time

      - name: Commit repaired master and audit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/master/ufc_master.parquet \
            data/audits/ufc_master_match_time_repair_audit.parquet \
            data/backups/ufc_master_backup_*.parquet

          git commit -m "Repair master match_time_sec elapsed fight time" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
