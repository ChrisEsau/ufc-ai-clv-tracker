name: Research UFC 325 FreshRolling Web V4
on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-ufc-325-freshrolling-web-v4.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow numpy scikit-learn xgboost pyyaml requests beautifulsoup4 lxml
      - name: Run UFC 325 scorer with current-card target-id repair
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path('.github/workflows/research-ufc-325-freshrolling-web-v1.yml').read_text()
          m=re.search(r"python - <<'PY'\n(.*?)\n          PY",src,re.S)
          if not m: raise RuntimeError('extract failed')
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in m.group(1).splitlines())
          pattern=r"pages=\[\]\nfor i in range\(3960,4026\):.*?if not pages:raise RuntimeError\('No BFO UFC 325 archive page found'\)"
          repl="u='https://www.bestfightodds.com/events/ufc-3971'\nt=requests.get(u,headers=H,timeout=30).text\npages=[(u,t)]\nif 'volkanovski' not in t.lower() or 'diego lopes' not in t.lower(): raise RuntimeError('Pinned BFO 3971 mismatch')"
          code,n=re.subn(pattern,repl,code,count=1,flags=re.S)
          if n!=1: raise RuntimeError('pin replacement failed')
          needle="master=pd.read_parquet('data/master/ufc_master.parquet').copy(); master['date']=pd.to_datetime(master.date)"
          replacement=needle+"\n# Current-card rows can have winner name populated while canonical winner_id is absent.\n# Fill winner_id in-memory strictly to let chronological rolling emit the PREFIGHT row;\n# the current fight target is consumed only after that prefight row has already been appended.\ncur=master.date.eq(pd.Timestamp(DATE))\nfor idx in master.index[cur]:\n  if pd.isna(master.at[idx,'winner_id']):\n    wn=norm(master.at[idx,'winner'])\n    if wn==norm(master.at[idx,'r_name']): master.at[idx,'winner_id']=master.at[idx,'r_id']\n    elif wn==norm(master.at[idx,'b_name']): master.at[idx,'winner_id']=master.at[idx,'b_id']\nprint('current rows',int(cur.sum()),'missing winner_id after repair',int(master.loc[cur,'winner_id'].isna().sum()))"
          if needle not in code: raise RuntimeError('master load needle missing')
          code=code.replace(needle,replacement,1)
          exec(compile(code,'<ufc325_v4>','exec'),{})
          PY
      - name: Commit UFC 325 scores
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f data/research/prop_mispricing/ufc_325_*_v1.csv
          git commit -m 'research: add UFC 325 frozen freshrolling scores' || echo No-changes
          git pull --rebase origin research/ufc-prop-mispricing-xgboost-20260829 || true
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
