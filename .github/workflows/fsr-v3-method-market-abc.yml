name: FSR V3 Method Market ABC Validation

on:
  push:
    branches:
      - "feature/fsr-v3"
    paths:
      - "pipeline/fsr_v3/replay/power.py"
      - "pipeline/fsr_v3/config.py"
      - "pipeline/fsr_v3/paths.py"
      - "pipeline/fsr_v3/build.py"
      - "pipeline/fsr_v3/publish/**"
      - "pipeline/simulation/event_clock_mc_v2/fit_event_clock_bundle.py"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/method_market_abc_validation.py"
      - ".github/workflows/fsr-v3-method-market-abc.yml"
  pull_request:
    paths:
      - "pipeline/fsr_v3/replay/power.py"
      - "pipeline/fsr_v3/config.py"
      - "pipeline/fsr_v3/paths.py"
      - "pipeline/fsr_v3/build.py"
      - "pipeline/fsr_v3/publish/**"
      - "pipeline/simulation/event_clock_mc_v2/fit_event_clock_bundle.py"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/method_market_abc_validation.py"
      - ".github/workflows/fsr-v3-method-market-abc.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  method-market-abc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn statsmodels joblib pyarrow pyyaml pytest

      - name: Compile method-market validation
        run: python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/method_market_abc_validation.py

      - name: Build frozen FSR V2 histories
        id: fsr2build
        run: |
          set -o pipefail
          python -m pipeline.fsr_v2.build --all 2>&1 | tee /tmp/fsr2build.log

      - name: Publish frozen FSR V2 snapshots
        id: fsr2pub
        run: |
          set -o pipefail
          python -m pipeline.fsr_v2.publish 2>&1 | tee /tmp/fsr2pub.log

      - name: Build canonical FSR V3
        id: fsr3
        run: |
          set -o pipefail
          python -m pipeline.fsr_v3.build --all 2>&1 | tee /tmp/fsr3.log

      - name: Patch incomplete-row guard in CI checkout only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("pipeline/simulation/event_mc_v1/diagnostics/fresh_100_fight_predictive_replay.py")
          text = path.read_text()
          old = '''            and method in METHODS\n            and int(row["total_rounds"]) in {3, 5}\n            and pd.notna(row["match_time_sec"])\n'''
          new = '''            and method in METHODS\n            and pd.notna(row["total_rounds"])\n            and int(row["total_rounds"]) in {3, 5}\n            and pd.notna(row["match_time_sec"])\n'''
          if old not in text:
              raise RuntimeError("Expected frozen cohort-selector block not found")
          path.write_text(text.replace(old, new, 1))
          print("Applied CI-only null guard; frozen repository source unchanged")
          PY

      - name: Patch validation output ordering in CI checkout only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pipeline/simulation/event_clock_mc_v2/diagnostics/method_market_abc_validation.py")
          text = path.read_text()
          write_block = '''    args.out_dir.mkdir(parents=True, exist_ok=True)\n    stem = f"abc_{len(cohort)}f_{args.paths}paths"\n    files = {\n        "cohort": cohort,\n        "summary": summary,\n        "fight_scores": scores,\n        "fight_metrics": fight_metrics,\n        "outcomes": outcomes,\n        "outcome_metrics": outcome_metrics,\n        "bet_metrics": bet_metrics,\n        "edge_bins": edge_bins,\n        "fighter_profiles": fighter_profiles,\n        "bootstrap": bootstrap,\n    }\n    for name, frame in files.items():\n        path = args.out_dir / f"{stem}_{name}.csv"\n        frame.to_csv(path, index=False)\n        print(path)\n'''
          anchor = '''    bootstrap = _bootstrap_deltas(scores)\n'''
          if text.count(write_block) != 1:
              raise RuntimeError("Expected exactly one validation CSV write block")
          if text.count(anchor) != 1:
              raise RuntimeError("Expected exactly one bootstrap anchor")
          text = text.replace(write_block, "", 1)
          text = text.replace(anchor, anchor + "\n" + write_block + "\n", 1)
          path.write_text(text)
          print("Moved CSV persistence ahead of verbose result printing in CI checkout only")
          PY

      - name: Fit frozen Event Clock V1 bundle
        id: v1
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v1.fit_event_clock_bundle 2>&1 | tee /tmp/v1.log

      - name: Fit Event Clock V2 V3-direct bundle
        id: v2
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.fit_event_clock_bundle 2>&1 | tee /tmp/v2.log

      - name: Run held-out A/B/C method-market validation
        id: validation
        run: |
          set -o pipefail
          python pipeline/simulation/event_clock_mc_v2/diagnostics/method_market_abc_validation.py \
            --paths 500 --quota-per-bucket 50 2>&1 | tee /tmp/method_market_abc.log

      - name: Upload method-market validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsr-v3-method-market-abc
          path: data/diagnostics/event_clock_mc_v2/method_market_abc/*.csv
          if-no-files-found: warn

      - name: Post method-market result to PR 68
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FSR2_BUILD_STATUS: ${{ steps.fsr2build.outcome }}
          FSR2_PUBLISH_STATUS: ${{ steps.fsr2pub.outcome }}
          FSR3_STATUS: ${{ steps.fsr3.outcome }}
          V1_STATUS: ${{ steps.v1.outcome }}
          V2_STATUS: ${{ steps.v2.outcome }}
          VALIDATION_STATUS: ${{ steps.validation.outcome }}
        run: |
          {
            echo "## FSR V2/V3 six-way method-market A/B/C validation"
            echo
            echo "Primary test: fighter DEC/KO/SUB probabilities, historical method-market edge, and debut/low-evidence behavior."
            echo
            echo "- FSR V2 histories: **${FSR2_BUILD_STATUS}**"
            echo "- FSR V2 publication: **${FSR2_PUBLISH_STATUS}**"
            echo "- FSR V3 build: **${FSR3_STATUS}**"
            echo "- ECV1 bundle: **${V1_STATUS}**"
            echo "- ECV2 bundle: **${V2_STATUS}**"
            echo "- A/B/C validation: **${VALIDATION_STATUS}**"
            echo
            if [ -f /tmp/method_market_abc.log ]; then
              echo '<details open><summary>Validation output</summary>'
              echo
              echo '```text'
              tail -n 520 /tmp/method_market_abc.log
              echo '```'
              echo '</details>'
            else
              echo '<details open><summary>Last available build output</summary>'
              echo
              echo '```text'
              if [ -f /tmp/v2.log ]; then tail -n 140 /tmp/v2.log;
              elif [ -f /tmp/v1.log ]; then tail -n 140 /tmp/v1.log;
              elif [ -f /tmp/fsr3.log ]; then tail -n 120 /tmp/fsr3.log;
              elif [ -f /tmp/fsr2pub.log ]; then tail -n 120 /tmp/fsr2pub.log;
              elif [ -f /tmp/fsr2build.log ]; then tail -n 120 /tmp/fsr2build.log;
              else echo 'No build log was produced.'; fi
              echo '```'
              echo '</details>'
            fi
          } > /tmp/method_market_abc_comment.md
          gh pr comment 68 --repo ChrisEsau/ufc-ai-clv-tracker --body-file /tmp/method_market_abc_comment.md
