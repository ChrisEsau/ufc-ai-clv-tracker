name: Wire SUB finish clock into locked Brain

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - .github/requests/wire-sub-finish-clock-locked-v2.request

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ko-system-v3-from-scratch-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python pipeline/research/wire_sub_finish_clock_patch.py
      - name: Syntax check
        run: python -m py_compile pipeline/research/locked_brain_tick_clock.py pipeline/research/locked_brain_mc.py pipeline/research/sub_time_survival_locked_clock.py
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pipeline/research/locked_brain_tick_clock.py pipeline/research/locked_brain_mc.py
          git commit -m "Wire validated SUB survival clock into locked Brain"
          git push origin HEAD:research/ko-system-v3-from-scratch-20260826
