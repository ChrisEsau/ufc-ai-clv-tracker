name: Run Calibration Diagnostic

on:
  push:
    branches:
      - calibration/event-mc
    paths:
      - ".github/calibration/experiment.json"
      - "pipeline/simulation/event_clock_mc_v1/**"
      - "pipeline/features/fsr_v2/**"
      - "scripts/run_calibration_diagnostic.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calibration-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact committed state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install calibration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pyarrow joblib

      - name: Show experiment specification
        run: |
          cat .github/calibration/experiment.json

      - name: Run diagnostic
        id: diagnostic
        run: |
          set +e
          python scripts/run_calibration_diagnostic.py \
            --spec .github/calibration/experiment.json
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-${{ github.run_id }}-${{ github.sha }}
          path: calibration-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "## Calibration diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exit code: \`${{ steps.diagnostic.outputs.exit_code }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f calibration-artifacts/run_metadata.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat calibration-artifacts/run_metadata.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
