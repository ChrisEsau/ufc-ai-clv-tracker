name: Run Staged Master Alignment Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-staged-master-alignment-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow

      - name: Run staged master alignment audit
        run: |
          python run_staged_master_alignment_audit.py

      - name: Commit alignment audit output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add ufc_alignment_audit.parquet

          git commit -m "Update staged master alignment audit" || echo "No changes to commit"

          git push
