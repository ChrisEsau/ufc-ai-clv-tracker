name: Research Prefight Strength

on:
  workflow_dispatch:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - pipeline/research/prefight_strength_elo.py
      - pipeline/research/prefight_strength_fightmatrix_modified_elo.py
      - pipeline/research/prefight_strength_fightmatrix_glicko.py
      - pipeline/research/prefight_strength_fightmatrix_whr.py
      - pipeline/research/prefight_strength_glicko_ablation.py
      - .github/workflows/research-prefight-strength.yml

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: python -m pip install --upgrade pandas pyarrow numpy scipy

      - name: Build Glicko signal ablation
        run: |
          python -m pipeline.research.prefight_strength_glicko_ablation \
            --input data/master/ufc_master.parquet \
            --output-dir data/diagnostics/prefight_strength_glicko_ablation \
            --holdout-from 2025-01-01

      - name: Show summary
        run: cat data/diagnostics/prefight_strength_glicko_ablation/summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: prefight-strength-glicko-ablation
          path: data/diagnostics/prefight_strength_glicko_ablation/
          if-no-files-found: error
