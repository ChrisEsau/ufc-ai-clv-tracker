name: Research Prefight Strength

on:
  workflow_dispatch:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - pipeline/research/prefight_strength_elo.py
      - .github/workflows/research-prefight-strength.yml

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: python -m pip install --upgrade pandas pyarrow numpy

      - name: Build leakage-safe prefight strength ratings
        run: |
          python pipeline/research/prefight_strength_elo.py \
            --input data/master/ufc_master.parquet \
            --output-dir data/diagnostics/prefight_strength \
            --k-factor 170 \
            --base-rating 1000

      - name: Show summary
        run: |
          cat data/diagnostics/prefight_strength/summary.json
          echo
          head -n 20 data/diagnostics/prefight_strength/fight_prefight_strength.csv

      - uses: actions/upload-artifact@v4
        with:
          name: prefight-strength-elo
          path: data/diagnostics/prefight_strength/
          if-no-files-found: error
