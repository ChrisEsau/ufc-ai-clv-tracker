name: Research Prefight Strength

on:
  workflow_dispatch:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - pipeline/research/prefight_strength_elo.py
      - pipeline/research/prefight_strength_fightmatrix_modified_elo.py
      - pipeline/research/prefight_strength_fightmatrix_glicko.py
      - .github/workflows/research-prefight-strength.yml

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: python -m pip install --upgrade pandas pyarrow numpy

      - name: Build plain leakage-safe Elo baseline
        run: |
          python pipeline/research/prefight_strength_elo.py \
            --input data/master/ufc_master.parquet \
            --output-dir data/diagnostics/prefight_strength \
            --k-factor 170 \
            --base-rating 1000

      - name: Build FightMatrix Modified Elo benchmark
        run: |
          python -m pipeline.research.prefight_strength_fightmatrix_modified_elo \
            --input data/master/ufc_master.parquet \
            --output-dir data/diagnostics/prefight_strength_fightmatrix_modified_elo \
            --holdout-from 2025-01-01

      - name: Build FightMatrix-style Glicko benchmark
        run: |
          python -m pipeline.research.prefight_strength_fightmatrix_glicko \
            --input data/master/ufc_master.parquet \
            --output-dir data/diagnostics/prefight_strength_fightmatrix_glicko \
            --holdout-from 2025-01-01

      - name: Show summaries
        run: |
          cat data/diagnostics/prefight_strength/summary.json
          echo
          cat data/diagnostics/prefight_strength_fightmatrix_modified_elo/summary.json
          echo
          cat data/diagnostics/prefight_strength_fightmatrix_glicko/summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: prefight-strength-fightmatrix-glicko
          path: |
            data/diagnostics/prefight_strength/
            data/diagnostics/prefight_strength_fightmatrix_modified_elo/
            data/diagnostics/prefight_strength_fightmatrix_glicko/
          if-no-files-found: error
