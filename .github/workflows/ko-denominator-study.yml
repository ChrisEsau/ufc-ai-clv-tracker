name: KO Denominator OOS Study

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - pipeline/research/ko_denominator_study.py
      - .github/workflows/ko-denominator-study.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  study:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            data/master
            data/fight_details
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow scipy scikit-learn
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Run KO denominator study
        run: |
          set -euo pipefail
          cp -a restored/canonical-weight-class-state/. data/
          python -m pipeline.research.ko_denominator_study | tee ko-denominator-study.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ko-denominator-study-${{ github.run_id }}
          path: |
            ko-denominator-study.txt
            data/research/ko_denominator_study/
