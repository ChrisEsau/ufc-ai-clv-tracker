name: Patch Method Runner Cold-Start Source

on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-method-cold-start-runner-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0
      - name: Patch runner to use authoritative prefight counts from feature view
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pipeline/research/xgboost_method_market_offset.py')
          s=p.read_text()
          old='''    feature_rows = fv[["fight_id"] + features].drop_duplicates("fight_id")
          if feature_rows["fight_id"].duplicated().any():
              raise RuntimeError("duplicate feature-view fight_id")

          df = meta.merge(market_frame, on="fight_id", how="inner").merge(feature_rows, on="fight_id", how="inner")
          df["fight_id"] = df["fight_id"].astype(str)
          flags = _cold_start_flags(df["fight_id"], develop_only)
          df = df.merge(flags.drop(columns=["state_date"]), on="fight_id", how="left")
          if df["betting_eligible"].isna().any():
              miss = df.loc[df["betting_eligible"].isna(), "fight_id"].head(20).tolist()
              raise RuntimeError(f"missing authoritative cold-start state for fights: {miss}")
          df = df.sort_values(["date", "fight_id"]).reset_index(drop=True)
'''
          new='''    aux = ["state_fight_id", "r_pre_fights", "b_pre_fights"]
          missing_aux = [c for c in aux if c not in fv.columns]
          if missing_aux:
              raise RuntimeError(f"cold-start prefight columns missing from feature view: {missing_aux}")
          feature_rows = fv[["fight_id"] + aux + features].drop_duplicates("fight_id")
          if feature_rows["fight_id"].duplicated().any():
              raise RuntimeError("duplicate feature-view fight_id")

          df = meta.merge(market_frame, on="fight_id", how="inner").merge(feature_rows, on="fight_id", how="inner")
          df["fight_id"] = df["fight_id"].astype(str)
          df["red_prior_ufc_fights"] = pd.to_numeric(df["r_pre_fights"], errors="coerce")
          df["blue_prior_ufc_fights"] = pd.to_numeric(df["b_pre_fights"], errors="coerce")
          if df[["red_prior_ufc_fights", "blue_prior_ufc_fights"]].isna().any(axis=None):
              miss = df.loc[df[["red_prior_ufc_fights", "blue_prior_ufc_fights"]].isna().any(axis=1), "fight_id"].head(20).tolist()
              raise RuntimeError(f"missing prefight prior-UFC-fight counts: {miss}")
          df["min_prior_ufc_fights"] = df[["red_prior_ufc_fights", "blue_prior_ufc_fights"]].min(axis=1)
          df["cold_start"] = df["min_prior_ufc_fights"] < COLD_START_MIN_PRIOR_UFC_FIGHTS
          df["betting_eligible"] = ~df["cold_start"]
          df = df.sort_values(["date", "fight_id"]).reset_index(drop=True)
'''
          if old not in s:
              raise SystemExit('build-row cold-start snippet not found')
          s=s.replace(old,new,1)

          old2='''    fight_dates = m.groupby("fight_id")["date"].min()
          rows = []
          years = sorted(int(y) for y in fight_dates.dt.year.dropna().unique())
'''
          new2='''    fight_dates = m.groupby("fight_id")["date"].min()
          fv_elig = pd.read_parquet(FEATURE_PATH, columns=["fight_id", "r_pre_fights", "b_pre_fights"]).drop_duplicates("fight_id")
          fv_elig["r_pre_fights"] = pd.to_numeric(fv_elig["r_pre_fights"], errors="coerce")
          fv_elig["b_pre_fights"] = pd.to_numeric(fv_elig["b_pre_fights"], errors="coerce")
          rows = []
          years = sorted(int(y) for y in fight_dates.dt.year.dropna().unique())
'''
          if old2 not in s:
              raise SystemExit('audit prelude snippet not found')
          s=s.replace(old2,new2,1)

          old3='''        flags = _cold_start_flags(list(map(str, complete)), False) if len(complete) else pd.DataFrame()
          rows.append({
              "year": year,
              "market_fights": int(len(ids)),
              "complete_six_price_fights": int(len(complete)),
              "duplicate_or_missing_six_price_fights": int(len(ids) - len(complete)),
              "cold_start_exclusions": int(flags["cold_start"].sum()) if len(flags) else 0,
              "betting_eligible_complete_fights": int(flags["betting_eligible"].sum()) if len(flags) else 0,
          })
'''
          new3='''        flags = fv_elig[fv_elig["fight_id"].isin(complete)].copy()
          flags["missing_prefight_counts"] = flags[["r_pre_fights", "b_pre_fights"]].isna().any(axis=1)
          flags["cold_start"] = flags[["r_pre_fights", "b_pre_fights"]].min(axis=1) < COLD_START_MIN_PRIOR_UFC_FIGHTS
          flags["betting_eligible"] = ~flags["missing_prefight_counts"] & ~flags["cold_start"]
          rows.append({
              "year": year,
              "market_fights": int(len(ids)),
              "complete_six_price_fights": int(len(complete)),
              "duplicate_or_missing_six_price_fights": int(len(ids) - len(complete)),
              "complete_price_fights_with_feature_view": int(len(flags)),
              "missing_prefight_count_rows": int(flags["missing_prefight_counts"].sum()) if len(flags) else 0,
              "cold_start_exclusions": int(flags["cold_start"].sum()) if len(flags) else 0,
              "betting_eligible_complete_fights": int(flags["betting_eligible"].sum()) if len(flags) else 0,
          })
'''
          if old3 not in s:
              raise SystemExit('audit flags snippet not found')
          s=s.replace(old3,new3,1)

          s=s.replace('''"source": "data/features/latest_fighter_state.parquet:fights",''','''"source": "data/features/moneyline_feature_view.parquet:r_pre_fights,b_pre_fights (prefight state counts; state_fight_id retained)",''')
          s=s.replace('''"cold_start_rule": "betting eligible iff both fighters have >=2 prior UFC fights at prefight latest_fighter_state.fights; whole fight excluded otherwise",''','''"cold_start_rule": "betting eligible iff both fighters have >=2 prior UFC fights using prefight r_pre_fights/b_pre_fights from moneyline_feature_view; whole fight excluded otherwise",''')
          s=s.replace('''"cold_start_eligibility": "whole fight betting-ineligible if either prefight latest_fighter_state.fights < 2; OOF scoring/selection eligible only",''','''"cold_start_eligibility": "whole fight betting-ineligible if either prefight r_pre_fights/b_pre_fights < 2; OOF scoring/selection eligible only",''')
          p.write_text(s)
          PY
      - name: Commit patched runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/research/xgboost_method_market_offset.py
          git diff --cached --quiet && exit 0
          git commit -m "research: use feature-view prefight counts for cold-start gate"
          git pull --rebase origin research/ufc-prop-mispricing-xgboost-20260829
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
