name: Refresh DraftKings Markets

on:
  workflow_dispatch:
    inputs:
      sleep_seconds:
        description: "Delay between DraftKings requests"
        required: true
        default: "3"
        type: string
      max_events:
        description: "Optional limit for testing (blank/all = all matched events)"
        required: false
        type: string
      min_match_score:
        description: "Minimum market matching score"
        required: true
        default: "65"
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-draftkings-markets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-draftkings-markets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml scikit-learn==1.6.1 xgboost

      - name: Run matched DraftKings discovery
        run: |
          ARGS=(--sleep-seconds "${{ github.event.inputs.sleep_seconds }}")
          MAX_EVENTS="${{ github.event.inputs.max_events }}"
          MAX_EVENTS_NORMALIZED="$(echo "$MAX_EVENTS" | tr '[:upper:]' '[:lower:]' | xargs)"

          if [ -n "$MAX_EVENTS_NORMALIZED" ] && \
             [ "$MAX_EVENTS_NORMALIZED" != "all" ] && \
             [ "$MAX_EVENTS_NORMALIZED" != "none" ] && \
             [ "$MAX_EVENTS_NORMALIZED" != "null" ]; then
            ARGS+=(--max-events "$MAX_EVENTS_NORMALIZED")
          fi

          python -m pipeline.market.run_draftkings_matched_discovery "${ARGS[@]}"

      - name: Normalize DraftKings markets
        run: |
          python -m pipeline.market.run_normalize_provider_markets \
            --provider draftkings

      - name: Match DraftKings markets to live card
        run: |
          python -m pipeline.market.run_market_matching \
            --registry-path configs/market/providers/draftkings_ufc_registry.yaml \
            --min-match-score "${{ github.event.inputs.min_match_score }}"

      - name: Commit market outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/market/draftkings_market_diagnostic.parquet \
            data/market/draftkings_raw_index.parquet \
            data/market/canonical_market_catalog.parquet \
            data/market/market_outcomes.parquet \
            data/audits/canonical_market_catalog_audit.parquet \
            data/audits/ufc_market_match_audit_v2.parquet

          git commit -m "Refresh DraftKings market artifacts" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
