name: Raw Signal TSFresh V1

on:
  workflow_dispatch:
  push:
    branches:
      - "research/raw-signal-discovery-v1"
    paths:
      - "pipeline/research/raw_signal_tsfresh_v1/**"
      - ".github/workflows/raw-signal-tsfresh-v1.yml"

permissions:
  contents: write

jobs:
  tsfresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow pyyaml scikit-learn xgboost tsfresh

      - name: Compile tsfresh challenger
        run: |
          python -m py_compile pipeline/research/raw_signal_tsfresh_v1/run.py
          python -m py_compile pipeline/research/raw_signal_tsfresh_v1/entrypoint.py

      - name: Run development-only tsfresh challenger
        run: python -m pipeline.research.raw_signal_tsfresh_v1.entrypoint

      - name: Upload tsfresh research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-signal-tsfresh-v1
          path: data/research/raw_signal_tsfresh_v1/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist compact tsfresh results on branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/research/raw_signal_tsfresh_v1/tsfresh_fold_metrics.csv \
            data/research/raw_signal_tsfresh_v1/tsfresh_metric_summary.csv \
            data/research/raw_signal_tsfresh_v1/tsfresh_feature_manifest.csv \
            data/research/raw_signal_tsfresh_v1/tsfresh_history_coverage.csv \
            data/research/raw_signal_tsfresh_v1/tsfresh_audit.csv \
            data/research/raw_signal_tsfresh_v1/tsfresh_fold_importance.csv \
            data/research/raw_signal_tsfresh_v1/tsfresh_signal_stability.csv \
            data/research/raw_signal_tsfresh_v1/tsfresh_calculator_summary.csv \
            data/research/raw_signal_tsfresh_v1/tsfresh_summary.json
          if git diff --cached --quiet; then
            echo "No compact tsfresh result changes to commit"
          else
            git commit -m "research: persist raw signal tsfresh v1 results"
            git push origin HEAD:research/raw-signal-discovery-v1
          fi
