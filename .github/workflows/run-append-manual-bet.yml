name: Append Manual Bankroll Bet

on:
  workflow_dispatch:
    inputs:
      bet_json:
        description: JSON payload for one manually confirmed bet
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: bankroll-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  append-manual-bet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow

      - name: Append manual bet to ledger
        env:
          BET_JSON: ${{ inputs.bet_json }}
        run: |
          python -m pipeline.bankroll.run_append_manual_bet --bet-json "$BET_JSON"

      - name: Commit bankroll ledger artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/bankroll/ufc_bet_ledger.parquet \
            data/bankroll/ufc_open_bets.parquet \
            data/bankroll/ufc_bankroll_snapshots.parquet

          git commit -m "Append manual bankroll bet" || echo "No changes to commit"
          git push
