name: KO V3 O50 Defender Prior Sweep

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - 'pipeline/simulation/event_clock_mc_v2/diagnostics/ko_v3_o50_d_prior_sweep.py'
      - '.github/workflows/ko-v3-o50-d-prior-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run-sweep:
    strategy:
      fail-fast: false
      matrix:
        d_prior: [25,50,100,200,400,800]
        target_index: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-24.04
    env:
      D_PRIOR_STRENGTH: ${{ matrix.d_prior }}
      TARGET_INDEX: ${{ matrix.target_index }}
    steps:
      - name: Sparse shallow checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            configs
            config
            data/master
            data/fight_details

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install numpy pandas pyarrow pyyaml scipy scikit-learn joblib

      - name: Restore canonical historical Brain MC inputs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ github.token }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Run O50 defender-prior sweep fight
        run: |
          set -euo pipefail
          cp -a restored/canonical-weight-class-state/. data/
          mkdir -p artifacts/ko-v3-o50-d-sweep
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.ko_v3_o50_d_prior_sweep \
            | tee artifacts/ko-v3-o50-d-sweep/result-d${D_PRIOR_STRENGTH}-f${TARGET_INDEX}.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ko-v3-o50-d${{ matrix.d_prior }}-f${{ matrix.target_index }}-${{ github.run_id }}
          path: artifacts/ko-v3-o50-d-sweep/result-d${{ matrix.d_prior }}-f${{ matrix.target_index }}.txt
          if-no-files-found: error
          retention-days: 30
