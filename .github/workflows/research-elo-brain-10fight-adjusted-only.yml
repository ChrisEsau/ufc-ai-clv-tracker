name: Research Elo Brain 10 Fight Adjusted Only

on:
  push:
    branches:
      - research/elo-brain-10fight-pilot-20260828
    paths:
      - pipeline/research/elo_fsr_brain_10fight_adjusted_only.py
      - .github/workflows/research-elo-brain-10fight-adjusted-only.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas pyarrow scipy scikit-learn pyyaml joblib

      - name: Restore locked Brain bundle cache
        id: bundle-cache
        uses: actions/cache@v4
        with:
          path: data/research/locked_brain_bundle
          key: locked-brain-bundle-v2-${{ hashFiles('pipeline/research/locked_brain_bundle.py', 'pipeline/research/fsr_recency_cohort_shadow.py', 'pipeline/research/ko_time_survival_oos.py', 'pipeline/research/sub_time_survival_oos.py') }}

      - name: Require locked Brain bundle
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        run: |
          echo 'LOCKED Brain bundle cache is missing.' >&2
          exit 1

      - name: Run 10-fight Elo-adjusted Brain pilot
        run: python -m pipeline.research.elo_fsr_brain_10fight_adjusted_only

      - name: Show combined results
        run: cat data/diagnostics/elo_fsr_brain_10fight_adjusted_only/elo_adjusted_10fight_results.csv

      - uses: actions/upload-artifact@v4
        with:
          name: elo-brain-10fight-adjusted-only
          path: data/diagnostics/elo_fsr_brain_10fight_adjusted_only/
          if-no-files-found: error
