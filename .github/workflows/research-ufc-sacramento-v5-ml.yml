name: Research UFC Sacramento Frozen V5 Moneyline
on:
  pull_request:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths:
      - .github/workflows/research-ufc-sacramento-v5-ml.yml
      - pipeline/research/score_ufc_sacramento_v5_ml.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Install exact frozen V5 packages
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6 scikit-learn==1.9.0 scipy==1.17.1 xgboost==3.2.0 joblib==1.5.3 threadpoolctl==3.6.0 python-dateutil==2.9.0.post0
      - name: Score UFC Sacramento with frozen V5
        run: python -m pipeline.research.score_ufc_sacramento_v5_ml
      - uses: actions/upload-artifact@v4
        with:
          name: ufc-sacramento-v5-moneyline-20260822
          path: |
            data/research/prop_mispricing/ufc_sacramento_v5_moneyline_20260822.csv
            data/research/prop_mispricing/ufc_sacramento_v5_betting_logit030_no_cold_exclusion_20260822.csv
