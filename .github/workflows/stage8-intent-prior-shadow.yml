name: Stage 8 Intent Prior Shadow

on:
  push:
    branches:
      - research/stage8-intent-priors
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  intent-prior-shadow:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas pyarrow pytest

      - name: Restore canonical FSR V3 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Place and verify canonical FSR V3 artifact
        run: |
          test -f data/canonical-weight-class-state/fsr_v3/fsr_v3_prefight_snapshots.parquet
          cp -a data/canonical-weight-class-state/. data/
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f data/fsr_v3/fsr_v3_latest.parquet
          test -f data/fight_details/ufc_round_stats.parquet
          test -f data/master/ufc_master.parquet

      - name: Test intent-prior contract
        run: pytest -q tests/simulation/event_clock_mc_v2/test_brain_intent_priors.py

      - name: Run clinch-entry intent sweep
        run: |
          echo "GITHUB_SHA=${GITHUB_SHA}"
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.stage8_clinch_intent_sweep \
            --fights 25 \
            --paths-per-fight 20 \
            --seed-base 20260825 \
            --ratios 0.01,0.02,0.04,0.06,0.08,0.10 \
            --output data/diagnostics/event_clock_mc_v2/stage8_clinch_intent_sweep.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: stage8-clinch-intent-sweep
          path: data/diagnostics/event_clock_mc_v2/stage8_clinch_intent_sweep.json
          if-no-files-found: error
