name: Control Duration OOS Validation

on:
  push:
    branches: [research/ko-system-v3-from-scratch-20260826]
    paths:
      - 'pipeline/research/control_duration_oos_validation.py'
      - '.github/workflows/control-duration-oos-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            data/fight_details
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow scikit-learn
      - name: Run OOS validation
        run: |
          set -euo pipefail
          python -m pipeline.research.control_duration_oos_validation | tee control-duration-oos-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: control-duration-oos-validation-${{ github.run_id }}
          path: control-duration-oos-validation.json
