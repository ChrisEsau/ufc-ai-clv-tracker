name: Research UFC Paris Moneyline V3
on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-ufc-paris-moneyline-v1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow numpy scikit-learn xgboost
      - name: Score UFC Paris from latest prefight fighter states
        run: |
          python - <<'PY'
          import unicodedata
          from pathlib import Path
          import numpy as np, pandas as pd
          from xgboost import XGBClassifier
          from pipeline.features.views.moneyline import build_moneyline_feature_view

          OUT=Path('data/research/prop_mispricing'); OUT.mkdir(parents=True,exist_ok=True)
          hist=pd.read_parquet('data/market/historical_market_outcomes.parquet').copy()
          hist=hist[(hist.bookmaker=='legacy_consensus')&(hist.result_status=='graded')&hist.won.notna()&(hist.market_key=='moneyline')].copy()
          hist['date']=pd.to_datetime(hist.date); hist['won']=hist.won.astype(bool).astype(int)
          good=hist.groupby('fight_id').size(); hist=hist[hist.fight_id.isin(good[good==2].index)].copy()
          hist['market_overround']=hist.groupby('fight_id').implied_probability.transform('sum'); hist['fair_market_p']=hist.implied_probability/hist.market_overround
          fv=pd.read_parquet('data/features/moneyline_feature_view.parquet').copy(); fv['date']=pd.to_datetime(fv.date)
          def pc(df):
            z=[]
            for c in df.columns:
              if not pd.api.types.is_numeric_dtype(df[c]): continue
              l=c.lower(); allow=('_pre_' in l or l.startswith('pre_') or 'ewm_' in l or 'recent_form_' in l or l.endswith('_diff') or l.startswith('combined_') or l in {'older_fighter_age','reach_mismatch_abs','height_mismatch_abs','title_fight','total_rounds'}); deny=any(x in l for x in ['winner','result','target','label','finish_round','match_time_sec','profit','odds','implied','market','actual','post_'])
              if allow and not deny:z.append(c)
            return sorted(set(z))
          cols=pc(fv); diffs=[c for c in cols if c.endswith('_diff')]
          d=hist.merge(fv[['fight_id']+cols],on='fight_id',how='inner'); blue=d.outcome_side.astype(str).eq('blue'); d.loc[blue,diffs]=-d.loc[blue,diffs]
          fc=cols+['fair_market_p','market_overround']; X=d[fc].replace([np.inf,-np.inf],np.nan); valid=[c for c in fc if X[c].notna().any()]
          tr=d.date<='2022-12-31'; va=(d.date>='2023-01-01')&(d.date<='2024-12-31'); med=X.loc[tr,valid].median(numeric_only=True); X=X[valid].fillna(med).fillna(0)
          model=XGBClassifier(n_estimators=350,max_depth=3,learning_rate=.03,subsample=.8,colsample_bytree=.7,min_child_weight=8,reg_lambda=5,reg_alpha=.5,objective='binary:logistic',eval_metric='logloss',random_state=42,n_jobs=2)
          model.fit(X.loc[tr],d.loc[tr,'won'],eval_set=[(X.loc[va],d.loc[va,'won'])],verbose=False)

          fights=[
            ('Dan Hooker','Salahdine Parnasse',375,-500,'UFC'),('Fares Ziam','Axel Sola',-150,125,'UFC'),('Michael Page','Nursulton Ruziboev',-200,165,'UFC'),
            ('Daniil Donchenko','Punahele Soriano',-215,172,'Oddschecker'),('Morgan Charriere','Felipe Lima',170,-205,'UFC'),('Losene Keita','Muhammad Naimov',-300,240,'UFC'),
            ('Mario Pinto','Ryan Spann',-260,210,'UFC'),('Kurtis Campbell','Trevor Peek',-340,270,'UFC'),('Oumar Sy','Modestas Bukauskas',-185,155,'UFC'),
            ('Nathaniel Wood','Mairon Santos',108,-134,'BestFightOdds'),('Michael Aljarouj','Fabia Sintes',-155,130,'UFC'),('Nora Cornolle','Klaudia Sygula',-130,110,'UFC'),
            ('Matthieu Letho Duclos','Luis Felipe Dias',100,-120,'UFC'),('Delphine Benouaich','Sofia Montenegro',-160,135,'UFC')]
          def norm(s): return ''.join(ch for ch in unicodedata.normalize('NFKD',str(s)) if not unicodedata.combining(ch)).replace('’',"'").lower().strip()
          latest=pd.read_parquet('data/features/latest_fighter_state.parquet').copy(); latest['fighter_id']=latest['fighter_id'].astype(str)
          name_col='fighter_name' if 'fighter_name' in latest.columns else None
          if name_col is None: raise RuntimeError(f'latest_fighter_state lacks fighter_name: {list(latest.columns)}')
          latest['_norm_name']=latest[name_col].map(norm)

          prep_rows=[]; state_rows=[]; meta={}
          for i,(a,b,ao_a,ao_b,src) in enumerate(fights,1):
            fid=f'paris_20260905_{i:02d}'
            ids=[]; found=[]
            for nm in [a,b]:
              hit=latest[latest._norm_name.eq(norm(nm))]
              if len(hit):
                rec=hit.iloc[-1].drop(labels=['_norm_name']).to_dict(); fighter_id=str(rec['fighter_id']); is_found=True
              else:
                rec={c:np.nan for c in latest.columns if c!='_norm_name'}; fighter_id=f'missing::{norm(nm)}'; rec['fighter_id']=fighter_id; rec['fighter_name']=nm; is_found=False
              rec['fight_id']=fid; state_rows.append(rec); ids.append(fighter_id); found.append(is_found)
            prep_rows.append({'fight_id':fid,'r_id':ids[0],'b_id':ids[1],'r_name':a,'b_name':b,'date':pd.Timestamp('2026-09-05'),'title_fight':False,'total_rounds':5 if i==1 else 3})
            meta[fid]={'r':(a,ao_a,src,found[0]),'b':(b,ao_b,src,found[1])}
          prep=pd.DataFrame(prep_rows); state_live=pd.DataFrame(state_rows)
          livefv=build_moneyline_feature_view(prepared_fights_df=prep,fighter_state_history_df=state_live)

          outrows=[]
          for _,r in livefv.iterrows():
            pair=[]
            for side,key in [('red','r'),('blue','b')]:
              label,ao,src,found=meta[r.fight_id][key]; ip=100/(ao+100) if ao>0 else (-ao)/((-ao)+100); pair.append((side,label,ao,src,found,ip))
            over=sum(x[5] for x in pair)
            for side,label,ao,src,found,ip in pair:
              vals={c:(r[c] if c in livefv.columns else np.nan) for c in valid}; vals['fair_market_p']=ip/over; vals['market_overround']=over
              if side=='blue':
                for c in [x for x in valid if x.endswith('_diff') and pd.notna(vals.get(x))]: vals[c]=-vals[c]
              XS=pd.DataFrame([vals],columns=valid).replace([np.inf,-np.inf],np.nan).fillna(med).fillna(0)
              p=float(model.predict_proba(XS)[0,1]); outrows.append({'fight_id':r.fight_id,'fighter':label,'side':side,'american_odds':ao,'market_source':src,'fighter_state_found':found,'fair_market_p':ip/over,'model_p':p,'edge':p-ip/over,'market_overround':over})
          out=pd.DataFrame(outrows); out.sort_values(['fight_id','side']).to_csv(OUT/'ufc_paris_moneyline_v1.csv',index=False); print(out.sort_values(['fight_id','side']).to_string(index=False)); print('matched_fights',out.fight_id.nunique()); print('missing_states',out.loc[~out.fighter_state_found,'fighter'].tolist())
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f data/research/prop_mispricing/ufc_paris_moneyline_v1.csv
          git commit -m 'Add valid UFC Paris live prefight moneyline scores' || echo No-changes
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
