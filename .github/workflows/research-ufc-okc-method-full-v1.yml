name: Research UFC OKC Method Full V1
on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-ufc-okc-method-full-v1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow numpy scikit-learn xgboost
      - name: Score UFC Oklahoma City full method card
        run: |
          python - <<'PY'
          import unicodedata
          from difflib import SequenceMatcher
          from pathlib import Path
          import numpy as np, pandas as pd
          from xgboost import XGBClassifier

          OUT=Path('data/research/prop_mispricing'); OUT.mkdir(parents=True,exist_ok=True)
          market=pd.read_parquet('data/market/historical_market_outcomes.parquet').copy()
          market=market[(market.bookmaker=='legacy_consensus')&(market.result_status=='graded')&market.won.notna()].copy()
          market['date']=pd.to_datetime(market.date); market['won']=market.won.astype(bool).astype(int)
          keys=['win_by_decision','win_by_ko_tko_dq','win_by_submission']
          mm=market[market.market_key.isin(keys)].copy(); good=mm.groupby('fight_id').size(); good=good[good==6].index; mm=mm[mm.fight_id.isin(good)].copy()
          mm['market_overround']=mm.groupby('fight_id').implied_probability.transform('sum'); mm['fair_market_p']=mm.implied_probability/mm.market_overround
          fv=pd.read_parquet('data/features/prop_method_of_victory_feature_view.parquet').copy(); fv['date']=pd.to_datetime(fv.date)
          latest=pd.read_parquet('data/features/latest_fighter_state.parquet').copy(); latest['date']=pd.to_datetime(latest.date)

          def predictor_cols(df):
            out=[]
            for c in df.columns:
              if not pd.api.types.is_numeric_dtype(df[c]): continue
              l=c.lower(); allow=('_pre_' in l or l.startswith('pre_') or 'ewm_' in l or 'recent_form_' in l or l.endswith('_diff') or l.startswith('combined_') or l in {'older_fighter_age','reach_mismatch_abs','height_mismatch_abs','title_fight','total_rounds'})
              deny=any(x in l for x in ['winner','result','target','label','finish_round','match_time_sec','profit','odds','implied','market','actual','post_'])
              if allow and not deny: out.append(c)
            return sorted(set(out))
          cols=predictor_cols(fv); diffs=[c for c in cols if c.endswith('_diff')]

          def train(key):
            d=mm[mm.market_key==key].merge(fv[['fight_id']+cols],on='fight_id',how='inner')
            blue=d.outcome_side.astype(str).eq('blue'); d.loc[blue,diffs]=-d.loc[blue,diffs]
            fc=cols+['fair_market_p','market_overround']; X=d[fc].replace([np.inf,-np.inf],np.nan)
            valid=[c for c in fc if X[c].notna().any()]
            tr=d.date<='2022-12-31'; va=(d.date>='2023-01-01')&(d.date<='2024-12-31')
            med=X.loc[tr,valid].median(numeric_only=True); X=X[valid].fillna(med).fillna(0)
            model=XGBClassifier(n_estimators=350,max_depth=3,learning_rate=.03,subsample=.8,colsample_bytree=.7,min_child_weight=8,reg_lambda=5,reg_alpha=.5,objective='binary:logistic',eval_metric='logloss',random_state=42,n_jobs=2)
            model.fit(X.loc[tr],d.loc[tr,'won'],eval_set=[(X.loc[va],d.loc[va,'won'])],verbose=False)
            return model,valid,med
          models={k:train(k) for k in keys}

          boards={
            ('Dricus Du Plessis','Kamaru Usman'):{'Dricus Du Plessis':{'win_by_ko_tko_dq':230,'win_by_submission':900,'win_by_decision':175},'Kamaru Usman':{'win_by_ko_tko_dq':525,'win_by_submission':2000,'win_by_decision':423}},
            ('Christian Leroy Duncan','Jared Cannonier'):{'Christian Leroy Duncan':{'win_by_ko_tko_dq':170,'win_by_submission':2200,'win_by_decision':132},'Jared Cannonier':{'win_by_ko_tko_dq':550,'win_by_submission':2800,'win_by_decision':650}},
            ('Chase Hooper','Mitch Ramirez'):{'Chase Hooper':{'win_by_ko_tko_dq':370,'win_by_submission':160,'win_by_decision':310},'Mitch Ramirez':{'win_by_ko_tko_dq':488,'win_by_submission':2400,'win_by_decision':900}},
            ('Fatima Kline','Tabatha Ricci'):{'Fatima Kline':{'win_by_ko_tko_dq':520,'win_by_submission':850,'win_by_decision':-172},'Tabatha Ricci':{'win_by_ko_tko_dq':1800,'win_by_submission':1500,'win_by_decision':575}},
            ('Tommy McMillen','Alberto Montes'):{'Tommy McMillen':{'win_by_ko_tko_dq':253,'win_by_submission':328,'win_by_decision':525},'Alberto Montes':{'win_by_ko_tko_dq':750,'win_by_submission':333,'win_by_decision':675}},
            ('Jose Delgado','Austin Bashi'):{'Jose Delgado':{'win_by_ko_tko_dq':290,'win_by_submission':675,'win_by_decision':410},'Austin Bashi':{'win_by_ko_tko_dq':1000,'win_by_submission':468,'win_by_decision':215}},
            ('Jean-Paul Lebosnoyani','Seokhyeon Ko'):{'Jean-Paul Lebosnoyani':{'win_by_ko_tko_dq':700,'win_by_submission':800,'win_by_decision':420},'Seokhyeon Ko':{'win_by_ko_tko_dq':425,'win_by_submission':750,'win_by_decision':138}},
            ('Felipe Franco','Levi Rodrigues'):{'Felipe Franco':{'win_by_ko_tko_dq':-110,'win_by_submission':2200,'win_by_decision':925},'Levi Rodrigues':{'win_by_ko_tko_dq':455,'win_by_submission':525,'win_by_decision':500}},
            ('Ezra Elliott','Damien Anderson'):{'Ezra Elliott':{'win_by_ko_tko_dq':750,'win_by_submission':300,'win_by_decision':400},'Damien Anderson':{'win_by_ko_tko_dq':450,'win_by_submission':333,'win_by_decision':333}},
            ('Alden Coria','Stewart Nicoll'):{'Alden Coria':{'win_by_ko_tko_dq':138,'win_by_submission':245,'win_by_decision':265},'Stewart Nicoll':{'win_by_ko_tko_dq':2450,'win_by_submission':1600,'win_by_decision':1400}},
            ('RJ Harris','Alvin Hines'):{'RJ Harris':{'win_by_ko_tko_dq':355,'win_by_submission':588,'win_by_decision':500},'Alvin Hines':{'win_by_ko_tko_dq':200,'win_by_submission':1250,'win_by_decision':375}},
            ('Dione Barbosa','Anna Melisano'):{'Dione Barbosa':{'win_by_ko_tko_dq':700,'win_by_submission':-105,'win_by_decision':215},'Anna Melisano':{'win_by_ko_tko_dq':1500,'win_by_submission':1300,'win_by_decision':1000}},
          }
          actual={('Dricus Du Plessis','win_by_decision'),('Christian Leroy Duncan','win_by_decision'),('Chase Hooper','win_by_submission'),('Fatima Kline','win_by_decision'),('Tommy McMillen','win_by_ko_tko_dq'),('Jose Delgado','win_by_decision'),('Jean-Paul Lebosnoyani','win_by_decision'),('Felipe Franco','win_by_ko_tko_dq'),('Ezra Elliott','win_by_decision'),('Alden Coria','win_by_decision'),('RJ Harris','win_by_ko_tko_dq'),('Dione Barbosa','win_by_submission')}

          def norm(s): return ''.join(ch for ch in unicodedata.normalize('NFKD',str(s)) if not unicodedata.combining(ch)).replace('’',"'").lower().strip()
          def sim(a,b): return SequenceMatcher(None,norm(a),norm(b)).ratio()
          event=latest[latest.date.dt.strftime('%Y-%m-%d').eq('2026-07-18')].copy()
          print('July 18 state rows',len(event),'fights',event.fight_id.nunique())

          def state_value(s,col):
            if col in {'title_fight','total_rounds'}: return s.get(col,np.nan)
            for pref in ('r_pre_','b_pre_'):
              if col.startswith(pref): return s.get(col[len(pref):],np.nan)
            for pref in ('r_ewm_','b_ewm_'):
              if col.startswith(pref): return s.get('ewm_'+col[len(pref):],np.nan)
            for pref in ('r_recent_form_','b_recent_form_'):
              if col.startswith(pref): return s.get('form_delta_'+col[len(pref):],np.nan)
            return np.nan
          def build(red,blue):
            rec={}; mapped=0
            for c in cols:
              if c in {'title_fight','total_rounds'}: rec[c]=red.get(c,np.nan)
              elif c.startswith(('r_pre_','r_ewm_','r_recent_form_')): rec[c]=state_value(red,c)
              elif c.startswith(('b_pre_','b_ewm_','b_recent_form_')): rec[c]=state_value(blue,c)
              elif c=='older_fighter_age': rec[c]=max(red.get('age',np.nan),blue.get('age',np.nan))
              elif c=='reach_mismatch_abs': rec[c]=abs(red.get('reach',np.nan)-blue.get('reach',np.nan))
              elif c=='height_mismatch_abs': rec[c]=abs(red.get('height',np.nan)-blue.get('height',np.nan))
              elif c.endswith('_diff'):
                stem=c[:-5]; rec[c]=np.nan
                for base in [stem,'ewm_'+stem,'form_delta_'+stem]:
                  if base in red.index and base in blue.index and pd.notna(red.get(base)) and pd.notna(blue.get(base)): rec[c]=red.get(base)-blue.get(base); break
              elif c.startswith('combined_'):
                stem=c[len('combined_'):]; rec[c]=np.nan
                for base in [stem,'ewm_'+stem,'form_delta_'+stem]:
                  if base in red.index and base in blue.index and pd.notna(red.get(base)) and pd.notna(blue.get(base)): rec[c]=(red.get(base)+blue.get(base))/2; break
              else: rec[c]=np.nan
              mapped += int(pd.notna(rec[c]))
            return rec,mapped

          fights=[]
          for fid,g in event.groupby('fight_id'):
            red=g[g.corner.astype(str).str.lower().eq('red')]; blue=g[g.corner.astype(str).str.lower().eq('blue')]
            if not red.empty and not blue.empty: fights.append((red.iloc[0],blue.iloc[0]))
          rows=[]; used=set()
          for red,blue in fights:
            best=None
            for pair,board in boards.items():
              if pair in used: continue
              direct=(sim(red.fighter_name,pair[0])+sim(blue.fighter_name,pair[1]))/2
              cross=(sim(red.fighter_name,pair[1])+sim(blue.fighter_name,pair[0]))/2
              score=max(direct,cross)
              if best is None or score>best[0]: best=(score,pair,board)
            if best is None or best[0]<0.70: continue
            score,pair,board=best; used.add(pair)
            feat,mapped=build(red,blue); print('matched',red.fighter_name,'vs',blue.fighter_name,'->',pair,'score',round(score,3),'mapped',mapped,'/',len(cols))
            remaining=set(board); tmp=[]
            for side,s in [('red',red),('blue',blue)]:
              name=max(remaining,key=lambda x:sim(s.fighter_name,x)); remaining.remove(name)
              for key,ao in board[name].items():
                ip=100/(ao+100) if ao>0 else (-ao)/((-ao)+100); tmp.append((side,name,key,ao,ip))
            over=sum(x[4] for x in tmp)
            for side,name,key,ao,ip in tmp:
              model,valid,med=models[key]; rec=dict(feat)
              if side=='blue':
                for c in diffs:
                  if pd.notna(rec.get(c)): rec[c]=-rec[c]
              rec.update({'fight_id':red.fight_id,'fighter':name,'side':side,'market_key':key,'american_odds':ao,'market_overround':over,'fair_market_p':ip/over,'actual_hit':int((name,key) in actual),'mapped_predictors':mapped,'total_predictors':len(cols)})
              X=pd.DataFrame([rec]).reindex(columns=valid).replace([np.inf,-np.inf],np.nan).fillna(med).fillna(0)
              rec['model_p']=float(model.predict_proba(X)[0,1]); rec['edge']=rec['model_p']-rec['fair_market_p']; rows.append(rec)
          if not rows: raise RuntimeError('No UFC OKC rows built')
          out=pd.DataFrame(rows); keep=['fight_id','fighter','side','market_key','american_odds','fair_market_p','model_p','edge','actual_hit','mapped_predictors','total_predictors']
          out[keep].to_csv(OUT/'ufc_okc_method_full_v1.csv',index=False)
          print(out[keep].sort_values('edge',ascending=False).to_string(index=False)); print('scored fights',out.fight_id.nunique(),'used boards',len(used))
          if out.fight_id.nunique()!=12: raise RuntimeError(f'Expected 12 scored fights, got {out.fight_id.nunique()}')
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f data/research/prop_mispricing/ufc_okc_method_full_v1.csv
          git commit -m 'Add UFC Oklahoma City full method scores' || echo No-changes
          git pull --rebase origin research/ufc-prop-mispricing-xgboost-20260829 || true
          git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829
