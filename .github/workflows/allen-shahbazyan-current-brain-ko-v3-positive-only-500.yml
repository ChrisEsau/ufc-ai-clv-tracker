name: Allen Shahbazyan Current Brain KO V3 Positive-Only 500

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - pipeline/research/allen_shahbazyan_current_brain_ko_v3_positive_only_500.py
      - .github/workflows/allen-shahbazyan-current-brain-ko-v3-positive-only-500.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run500:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            configs
            config
            data/master
            data/fight_details
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow scipy scikit-learn pyyaml joblib
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Run 500-path Allen current Brain + KO V3 positive-only
        run: |
          set -euo pipefail
          cp -a restored/canonical-weight-class-state/. data/
          python -m pipeline.research.allen_shahbazyan_current_brain_ko_v3_positive_only_500 | tee allen-shahbazyan-current-brain-ko-v3-positive-only-500.txt
      - uses: actions/upload-artifact@v4
        with:
          name: allen-shahbazyan-current-brain-ko-v3-positive-only-500-${{ github.run_id }}
          path: |
            allen-shahbazyan-current-brain-ko-v3-positive-only-500.txt
            data/research/allen_shahbazyan_current_brain_ko_v3_positive_only_500/
