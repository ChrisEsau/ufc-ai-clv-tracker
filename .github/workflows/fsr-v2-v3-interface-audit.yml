name: FSR V2 V3 Interface Audit

# Measurement-only CI diagnostic; no simulator mechanics are modified.
on:
  push:
    branches:
      - "feature/fsr-v3"
    paths:
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/**"
      - ".github/workflows/fsr-v2-v3-interface-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  interface-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn statsmodels joblib pyarrow pyyaml pytest

      - name: Compile diagnostic
        run: python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/fsr_v2_v3_interface_audit.py

      - name: Build frozen FSR V2 histories
        id: fsr2build
        run: |
          set -o pipefail
          python -m pipeline.fsr_v2.build --all 2>&1 | tee /tmp/fsr2build.log

      - name: Publish frozen FSR V2 snapshots
        id: fsr2pub
        run: |
          set -o pipefail
          python -m pipeline.fsr_v2.publish 2>&1 | tee /tmp/fsr2pub.log

      - name: Build canonical FSR V3
        id: fsr3
        run: |
          set -o pipefail
          python -m pipeline.fsr_v3.build --all 2>&1 | tee /tmp/fsr3.log

      - name: Patch incomplete-row guard in CI checkout only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pipeline/simulation/event_mc_v1/diagnostics/fresh_100_fight_predictive_replay.py")
          text = path.read_text()
          old = '''            and method in METHODS\n            and int(row["total_rounds"]) in {3, 5}\n            and pd.notna(row["match_time_sec"])\n'''
          new = '''            and method in METHODS\n            and pd.notna(row["total_rounds"])\n            and int(row["total_rounds"]) in {3, 5}\n            and pd.notna(row["match_time_sec"])\n'''
          if old not in text:
              raise RuntimeError("Expected frozen cohort-selector block not found")
          path.write_text(text.replace(old, new, 1))
          print("Applied CI-only null guard; repository source remains unchanged")
          PY

      - name: Run July 25 source-fitted interface audit
        id: audit
        run: |
          set -o pipefail
          python pipeline/simulation/event_clock_mc_v2/diagnostics/fsr_v2_v3_interface_audit.py \
            --event-date 2026-07-25 2>&1 | tee /tmp/interface_audit.log

      - name: Upload interface audit
        if: steps.audit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fsr-v2-v3-interface-audit-2026-07-25
          path: data/diagnostics/event_clock_mc_v2/interface_audit/2026_07_25_*.csv
          if-no-files-found: error

      - name: Post audit result to PR 68
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FSR2_BUILD_STATUS: ${{ steps.fsr2build.outcome }}
          FSR2_PUBLISH_STATUS: ${{ steps.fsr2pub.outcome }}
          FSR3_STATUS: ${{ steps.fsr3.outcome }}
          AUDIT_STATUS: ${{ steps.audit.outcome }}
        run: |
          {
            echo "## FSR V2 → V3 source-fitted interface audit (2026-07-25)"
            echo
            echo "Measurement only — no persisted Event Clock bundles loaded and no fight mechanics executed."
            echo
            echo "- FSR V2 history build: **${FSR2_BUILD_STATUS}**"
            echo "- FSR V2 snapshot publication: **${FSR2_PUBLISH_STATUS}**"
            echo "- FSR V3 build: **${FSR3_STATUS}**"
            echo "- Direct-interface audit: **${AUDIT_STATUS}**"
            echo
            if [ -f /tmp/interface_audit.log ]; then
              echo '<details open><summary>Audit output</summary>'
              echo
              echo '```text'
              tail -n 260 /tmp/interface_audit.log
              echo '```'
              echo '</details>'
            else
              echo '<details open><summary>Last available build output</summary>'
              echo
              echo '```text'
              if [ -f /tmp/fsr3.log ]; then tail -n 120 /tmp/fsr3.log;
              elif [ -f /tmp/fsr2pub.log ]; then tail -n 120 /tmp/fsr2pub.log;
              elif [ -f /tmp/fsr2build.log ]; then tail -n 120 /tmp/fsr2build.log;
              else echo 'No build log was produced.'; fi
              echo '```'
              echo '</details>'
            fi
          } > /tmp/audit_comment.md
          gh pr comment 68 --repo ChrisEsau/ufc-ai-clv-tracker --body-file /tmp/audit_comment.md
