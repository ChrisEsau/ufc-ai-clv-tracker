name: Rakic-Tybura Full Brain Trace

on:
  push:
    branches:
      - refactor/event-clock-v2-brain-timeline
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-brain-trace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install diagnostic dependencies
        run: python -m pip install --upgrade pip numpy pandas pyarrow

      - name: Restore canonical FSR V3 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32645607979

      - name: Place and verify canonical FSR V3 artifact
        run: |
          test -f data/canonical-weight-class-state/fsr_v3/fsr_v3_latest.parquet
          test -f data/canonical-weight-class-state/fsr_v3/fsr_v3_prefight_snapshots.parquet
          cp -a data/canonical-weight-class-state/. data/
          test -f data/fsr_v3/fsr_v3_latest.parquet
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet

      - name: Run one Rakic-Tybura path with full brain probabilities
        run: |
          echo "GITHUB_SHA=${GITHUB_SHA}"
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.rakic_tybura_full_brain_trace \
            --red "Aleksandar Rakic" \
            --blue "Marcin Tybura" \
            --seed 20260825 \
            --horizon 900 \
            --output data/diagnostics/event_clock_mc_v2/rakic_tybura_full_brain_trace.json

      - name: Upload full brain trace
        uses: actions/upload-artifact@v4
        with:
          name: rakic-tybura-full-brain-trace
          path: data/diagnostics/event_clock_mc_v2/rakic_tybura_full_brain_trace.json
          if-no-files-found: error
