name: Stage 6 Real Causal Path Diagnostic

on:
  push:
    branches:
      - refactor/event-clock-v2-brain-timeline
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-causal-path:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install diagnostic dependencies
        run: python -m pip install --upgrade pip numpy pandas pyarrow

      - name: Restore canonical FSR V3 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32645607979

      - name: Verify canonical FSR V3 artifact
        run: |
          test -f data/fsr_v3/fsr_v3_latest.parquet
          ls -lh data/fsr_v3/fsr_v3_latest.parquet

      - name: Run actual Stage 6 engine path
        run: |
          echo "GITHUB_SHA=${GITHUB_SHA}"
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.stage6_real_causal_path \
            --red "Aleksandar Rakic" \
            --blue "Marcin Tybura" \
            --seed 20260825 \
            --horizon 300 \
            --output data/diagnostics/event_clock_mc_v2/stage6_real_causal_path.json

      - name: Upload real causal path result
        uses: actions/upload-artifact@v4
        with:
          name: stage6-real-causal-path
          path: data/diagnostics/event_clock_mc_v2/stage6_real_causal_path.json
          if-no-files-found: error
