name: Research KO Method Full-History Specialist

on:
  push:
    branches:
      - research/ko-method-edge-xgb-20260831
    paths:
      - 'pipeline/research/analyze_ko_method_full_history_specialist.py'
      - '.github/workflows/research-ko-method-full-history-specialist.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ko-method-edge-xgb-20260831

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'

      - name: Install research dependencies
        run: pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6 xgboost

      - name: Run full-history KO specialist benchmark
        run: python -m pipeline.research.analyze_ko_method_full_history_specialist

      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: ko-method-full-history-specialist
          path: |
            data/research/prop_mispricing/xgboost_ko_method_full_history_specialist_predictions.csv
            data/research/prop_mispricing/xgboost_ko_method_full_history_specialist_metrics.csv
            data/research/prop_mispricing/xgboost_ko_method_full_history_specialist_feature_importance.csv
            data/research/prop_mispricing/xgboost_ko_method_full_history_specialist_summary.json

      - name: Commit research outputs to isolated branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/research/prop_mispricing/xgboost_ko_method_full_history_specialist_predictions.csv \
            data/research/prop_mispricing/xgboost_ko_method_full_history_specialist_metrics.csv \
            data/research/prop_mispricing/xgboost_ko_method_full_history_specialist_feature_importance.csv \
            data/research/prop_mispricing/xgboost_ko_method_full_history_specialist_summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: persist full-history KO specialist outputs'
          git push origin HEAD:research/ko-method-edge-xgb-20260831
