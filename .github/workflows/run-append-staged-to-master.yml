name: Run Append Staged To Master

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-append-staged-to-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull latest repo state
        run: |
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow

      - name: Run append staged to master
        run: |
          python run_append_staged_to_master.py

      - name: Commit appended master and audit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add ufc_master.parquet
          git add ufc_append_audit.parquet
          git add ufc_master_backup_before_append_*.parquet

          git commit -m "Append staged UFC fights to master dataset" || echo "No changes to commit"

          git pull --rebase origin main
          git push
