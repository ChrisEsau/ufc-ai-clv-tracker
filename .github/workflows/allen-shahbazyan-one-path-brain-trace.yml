name: Allen Shahbazyan One Path Brain Trace

on:
  push:
    branches: [research/ko-system-v3-from-scratch-20260826]
    paths:
      - 'pipeline/research/allen_shahbazyan_one_path_brain_trace.py'
      - '.github/workflows/allen-shahbazyan-one-path-brain-trace.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            configs
            config
            data/master
            data/fight_details
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas pyarrow scipy scikit-learn pyyaml joblib
      - name: Restore canonical historical Brain MC inputs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ github.token }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Run one-path trace
        run: |
          set -euo pipefail
          cp -a restored/canonical-weight-class-state/. data/
          python -m pipeline.research.allen_shahbazyan_one_path_brain_trace | tee allen-shahbazyan-one-path-brain-trace.json
      - uses: actions/upload-artifact@v4
        with:
          name: allen-shahbazyan-one-path-brain-trace-${{ github.run_id }}
          path: allen-shahbazyan-one-path-brain-trace.json
          if-no-files-found: error
          retention-days: 30
