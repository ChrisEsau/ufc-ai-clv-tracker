name: FSR V3 Cold Start Tests

on:
  push:
    branches:
      - "feature/fsr-v3"
    paths:
      - "pipeline/fsr_v3/cold_start/**"
      - "tests/fsr_v3/test_cold_start.py"
      - ".github/workflows/fsr-v3-cold-start-tests.yml"
  pull_request:
    paths:
      - "pipeline/fsr_v3/cold_start/**"
      - "tests/fsr_v3/test_cold_start.py"
      - ".github/workflows/fsr-v3-cold-start-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-start-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install numpy pandas scipy pyarrow duckdb pytest
      - name: Compile cold-start package
        run: python -m compileall -q pipeline/fsr_v3/cold_start
      - name: Run cold-start regression tests
        run: pytest -q tests/fsr_v3/test_cold_start.py
