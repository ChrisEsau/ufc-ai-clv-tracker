name: Run Dataset Status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-dataset-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow

      - name: Run dataset status
        run: |
          python -m pipeline.data_maintenance.run_dataset_status

      - name: Commit dataset status outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add \
            data/status/ufc_dataset_status.parquet \
            data/status/ufc_dataset_event_status.parquet

          git commit -m "Update dataset status artifacts" || echo "No changes to commit"

          git push
