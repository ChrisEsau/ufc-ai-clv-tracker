name: Research Market Catalog Method Coverage

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-market-catalog-method-coverage.yml'
      - 'pipeline/research/market_catalog_method_coverage.py'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow
      - run: python -m pipeline.research.market_catalog_method_coverage
