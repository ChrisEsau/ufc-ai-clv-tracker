name: Research KO Archetype June-Aug 2026 Audit

on:
  push:
    branches:
      - research/ko-method-edge-xgb-20260831
  workflow_dispatch:

jobs:
  audit-june-aug-2026:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'

      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6

      - name: Run fixed-rule June-Aug audit
        run: python -m pipeline.research.audit_ko_archetype_june_aug_2026

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ko-archetype-june-aug-2026-audit
          path: |
            data/research/prop_mispricing/ko_archetype_june_aug_2026_all_sides.csv
            data/research/prop_mispricing/ko_archetype_june_aug_2026_exact_and_near_misses.csv
            data/research/prop_mispricing/ko_archetype_june_aug_2026_summary.json
