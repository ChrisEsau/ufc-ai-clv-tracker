name: Research KO Method Market Price Integrity 2021-2025

on:
  push:
    branches:
      - research/ko-method-edge-xgb-20260831
    paths:
      - 'pipeline/research/audit_ko_method_market_price_integrity_2021_2025.py'
      - '.github/workflows/research-ko-method-market-price-integrity-2021-2025.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ko-method-edge-xgb-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Install audit dependencies
        run: pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6
      - name: Audit method-price integrity through 2025 only
        run: python -m pipeline.research.audit_ko_method_market_price_integrity_2021_2025
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: ko-method-market-price-integrity-2021-2025
          path: |
            data/research/prop_mispricing/ko_method_market_price_integrity_2021_2025_summary.json
            data/research/prop_mispricing/ko_method_market_price_integrity_2021_2025_yearly.csv
            data/research/prop_mispricing/ko_method_market_price_integrity_2021_2025_sources.csv
            data/research/prop_mispricing/ko_method_market_price_integrity_2025_fights.csv
