name: Research V5 Frozen Current Continuation

on:
  push:
    branches:
      - research/ufc-prop-mispricing-xgboost-20260829
    paths:
      - .github/workflows/research-v5-frozen-current-continuation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  continuation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0

      - name: Set up exact V5 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'

      - name: Install exact V5 packages
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install \
            pandas==3.0.5 \
            pyarrow==25.0.1 \
            numpy==2.4.6 \
            scikit-learn==1.9.0 \
            scipy==1.17.1 \
            xgboost==3.2.0 \
            joblib==1.5.3 \
            threadpoolctl==3.6.0 \
            python-dateutil==2.9.0.post0

      - name: Preserve current append-only scoring data
        run: |
          cp data/market/historical_market_outcomes.parquet /tmp/current_historical_market_outcomes.parquet
          cp data/features/moneyline_feature_view.parquet /tmp/current_moneyline_feature_view.parquet

      - name: Restore frozen V5 training snapshot
        run: |
          git checkout 7df1b61126be1f4e036b256d1c774c531b8a281f -- \
            data/market/historical_market_outcomes.parquet \
            data/features/moneyline_feature_view.parquet

      - name: Run frozen continuation with reproduction gates
        run: python pipeline/research/v5_frozen_current_continuation.py

      - name: Restore branch data and commit research outputs
        run: |
          git restore --source=HEAD -- data/market/historical_market_outcomes.parquet data/features/moneyline_feature_view.parquet
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f \
            data/research/prop_mispricing/v5_frozen_logit020_2026_continuation_predictions.csv \
            data/research/prop_mispricing/v5_frozen_logit020_2026_continuation_ledger.csv \
            data/research/prop_mispricing/v5_frozen_logit020_2026_continuation_by_card.csv \
            data/research/prop_mispricing/v5_frozen_logit020_2026_continuation_summary.json \
            data/research/prop_mispricing/v5_frozen_logit020_combined_ledger.csv
          git diff --cached --quiet && exit 0
          git commit -m 'Add frozen V5 2026 continuation results'
          for i in 1 2 3 4 5; do
            git fetch origin research/ufc-prop-mispricing-xgboost-20260829
            git rebase origin/research/ufc-prop-mispricing-xgboost-20260829 || { git rebase --abort; sleep 2; continue; }
            git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829 && exit 0
            sleep 3
          done
          exit 1
