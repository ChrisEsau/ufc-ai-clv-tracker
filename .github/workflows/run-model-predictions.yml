name: Run Model Predictions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-model-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow joblib scikit-learn==1.6.1 xgboost

      - name: Run model predictions
        run: |
          python run_model_predictions.py

      - name: Commit model prediction outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add \
            ufc_model_predictions.parquet \
            ufc_live_feature_audit.parquet \
            ufc_live_match_audit.parquet

          git commit -m "Update model prediction outputs" || echo "No changes to commit"

          git push
