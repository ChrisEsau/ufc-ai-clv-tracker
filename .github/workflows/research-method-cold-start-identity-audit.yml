name: Research Method Cold-Start Identity Audit

on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-method-cold-start-identity-audit.yml]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - run: pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6
      - name: Verify feature-view prefight fight counts against state source
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd

          F='data/features/moneyline_feature_view.parquet'
          S='data/features/latest_fighter_state.parquet'
          fv=pd.read_parquet(F,columns=['fight_id','date','state_fight_id','r_pre_fights','b_pre_fights']).copy()
          st=pd.read_parquet(S,columns=['fight_id','date','corner','fights']).copy()
          fv['state_fight_id']=fv.state_fight_id.astype(str)
          st['fight_id']=st.fight_id.astype(str)
          st['fights']=pd.to_numeric(st.fights,errors='coerce')
          rows=[]
          for fid,g in st.groupby('fight_id'):
              r=g[g.corner.astype(str).str.lower().eq('red')]
              b=g[g.corner.astype(str).str.lower().eq('blue')]
              if len(r)==1 and len(b)==1:
                  rows.append({'state_fight_id':fid,'state_r_fights':float(r.fights.iloc[0]),'state_b_fights':float(b.fights.iloc[0])})
          sm=pd.DataFrame(rows)
          z=fv.merge(sm,on='state_fight_id',how='left')
          matched=z.state_r_fights.notna() & z.state_b_fights.notna()
          rr=pd.to_numeric(z.r_pre_fights,errors='coerce')
          bb=pd.to_numeric(z.b_pre_fights,errors='coerce')
          eq=matched & np.isclose(rr,z.state_r_fights,equal_nan=False) & np.isclose(bb,z.state_b_fights,equal_nan=False)
          print('feature rows',len(z))
          print('state_fight_id matches',int(matched.sum()))
          print('exact r/b pre-fight count matches',int(eq.sum()))
          print('mismatches among state matches',int((matched & ~eq).sum()))
          if (matched & ~eq).any():
              print(z.loc[matched & ~eq,['fight_id','date','state_fight_id','r_pre_fights','b_pre_fights','state_r_fights','state_b_fights']].head(50).to_string(index=False))
              raise RuntimeError('feature-view prefight fight counts disagree with latest_fighter_state')
          if int(matched.sum()) != len(z):
              missing=z.loc[~matched,['fight_id','date','state_fight_id','r_pre_fights','b_pre_fights']]
              print('unmatched state_fight_id rows',len(missing))
              print(missing.head(50).to_string(index=False))
          print('cold-start rule can use r_pre_fights/b_pre_fights: whole fight excluded if min < 2')
          PY