name: ECV2 Literal V3 Standing Experiment

# Diagnostic-only A/B/C experiment. Production Event Clock mechanics are unchanged.
on:
  push:
    branches:
      - "feature/fsr-v3"
    paths:
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/standing_literal_interface_experiment.py"
      - ".github/workflows/event-clock-v2-standing-literal-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  standing-literal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn statsmodels joblib pyarrow pyyaml pytest

      - name: Compile experiment
        run: python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/standing_literal_interface_experiment.py

      - name: Build frozen FSR V2 histories
        id: fsr2build
        run: |
          set -o pipefail
          python -m pipeline.fsr_v2.build --all 2>&1 | tee /tmp/fsr2build.log

      - name: Publish frozen FSR V2 snapshots
        id: fsr2pub
        run: |
          set -o pipefail
          python -m pipeline.fsr_v2.publish 2>&1 | tee /tmp/fsr2pub.log

      - name: Build canonical FSR V3
        id: fsr3
        run: |
          set -o pipefail
          python -m pipeline.fsr_v3.build --all 2>&1 | tee /tmp/fsr3.log

      - name: Patch incomplete-row guard in CI checkout only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pipeline/simulation/event_mc_v1/diagnostics/fresh_100_fight_predictive_replay.py")
          text = path.read_text()
          old = '''            and method in METHODS\n            and int(row["total_rounds"]) in {3, 5}\n            and pd.notna(row["match_time_sec"])\n'''
          new = '''            and method in METHODS\n            and pd.notna(row["total_rounds"])\n            and int(row["total_rounds"]) in {3, 5}\n            and pd.notna(row["match_time_sec"])\n'''
          if old not in text:
              raise RuntimeError("Expected frozen cohort-selector block not found")
          path.write_text(text.replace(old, new, 1))
          print("Applied CI-only null guard; repository source remains unchanged")
          PY

      - name: Fit frozen Event Clock V1 bundle
        id: v1
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v1.fit_event_clock_bundle 2>&1 | tee /tmp/v1.log

      - name: Fit Event Clock V2 V3-direct bundle
        id: v2
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.fit_event_clock_bundle 2>&1 | tee /tmp/v2.log

      - name: Run 2000-path standing A/B/C experiment
        id: experiment
        run: |
          set -o pipefail
          python pipeline/simulation/event_clock_mc_v2/diagnostics/standing_literal_interface_experiment.py \
            --event-date 2026-07-25 --paths 2000 2>&1 | tee /tmp/standing_experiment.log

      - name: Upload standing experiment outputs
        if: steps.experiment.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ecv2-standing-literal-2026-07-25-2000paths
          path: data/diagnostics/event_clock_mc_v2/standing_literal_interface/2026_07_25_*.csv
          if-no-files-found: error

      - name: Post standing experiment result to PR 68
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FSR2_BUILD_STATUS: ${{ steps.fsr2build.outcome }}
          FSR2_PUBLISH_STATUS: ${{ steps.fsr2pub.outcome }}
          FSR3_STATUS: ${{ steps.fsr3.outcome }}
          V1_STATUS: ${{ steps.v1.outcome }}
          V2_STATUS: ${{ steps.v2.outcome }}
          EXP_STATUS: ${{ steps.experiment.outcome }}
        run: |
          {
            echo "## ECV2 literal V3 standing interface experiment (2026-07-25)"
            echo
            echo "Standing-only A/B/C diagnostic with 2,000 paths per fight per arm. No production fight mechanics changed."
            echo
            echo "- FSR V2 histories: **${FSR2_BUILD_STATUS}**"
            echo "- FSR V2 publication: **${FSR2_PUBLISH_STATUS}**"
            echo "- FSR V3 build: **${FSR3_STATUS}**"
            echo "- ECV1 bundle build: **${V1_STATUS}**"
            echo "- ECV2 bundle build: **${V2_STATUS}**"
            echo "- Standing experiment: **${EXP_STATUS}**"
            echo
            if [ -f /tmp/standing_experiment.log ]; then
              echo '<details open><summary>Experiment output</summary>'
              echo
              echo '```text'
              tail -n 320 /tmp/standing_experiment.log
              echo '```'
              echo '</details>'
            else
              echo '<details open><summary>Last available build output</summary>'
              echo
              echo '```text'
              if [ -f /tmp/v2.log ]; then tail -n 140 /tmp/v2.log;
              elif [ -f /tmp/v1.log ]; then tail -n 140 /tmp/v1.log;
              elif [ -f /tmp/fsr3.log ]; then tail -n 120 /tmp/fsr3.log;
              elif [ -f /tmp/fsr2pub.log ]; then tail -n 120 /tmp/fsr2pub.log;
              elif [ -f /tmp/fsr2build.log ]; then tail -n 120 /tmp/fsr2build.log;
              else echo 'No build log was produced.'; fi
              echo '```'
              echo '</details>'
            fi
          } > /tmp/standing_comment.md
          gh pr comment 68 --repo ChrisEsau/ufc-ai-clv-tracker --body-file /tmp/standing_comment.md
