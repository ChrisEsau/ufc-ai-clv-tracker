name: Run Underdog Backtest Bet Audit

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model ID"
        required: true
        default: "moneyline_xgboost_v11"
      market_key:
        description: "Market key"
        required: true
        default: "moneyline"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas pyarrow
      - name: Run audit
        run: |
          python -m pipeline.research.underdog_analysis.run_backtest_bet_audit \
            --model-id "${{ github.event.inputs.model_id }}" \
            --market-key "${{ github.event.inputs.market_key }}"
      - uses: actions/upload-artifact@v4
        with:
          name: underdog-backtest-bet-audit
          path: data/research/underdog_audit/**
