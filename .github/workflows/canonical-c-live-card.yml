name: Canonical C Live Card

on:
  push:
    branches:
      - "research/canonical-c-sacramento-card"
    paths:
      - "pipeline/simulation/event_clock_mc_v2/run_live_card_canonical_c.py"
      - ".github/workflows/canonical-c-live-card.yml"
  pull_request:
    paths:
      - "pipeline/simulation/event_clock_mc_v2/run_live_card_canonical_c.py"
      - ".github/workflows/canonical-c-live-card.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn statsmodels joblib pyarrow pyyaml pytest requests beautifulsoup4 lxml selenium webdriver-manager

      - name: Compile live-card runner
        run: python -m py_compile pipeline/simulation/event_clock_mc_v2/run_live_card_canonical_c.py

      - name: Refresh UFCStats upcoming card in CI checkout
        run: python -m pipeline.prediction.run_refresh_upcoming_events --max-events 3

      - name: Build frozen FSR V2 source histories
        run: python -m pipeline.fsr_v2.build --all

      - name: Publish frozen FSR V2 source snapshots
        run: python -m pipeline.fsr_v2.publish

      - name: Build final canonical FSR V3
        run: python -m pipeline.fsr_v3.build_canonical

      - name: Patch incomplete-row cohort guard in CI checkout only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("pipeline/simulation/event_mc_v1/diagnostics/fresh_100_fight_predictive_replay.py")
          text = path.read_text()
          old = '''            and method in METHODS\n            and int(row["total_rounds"]) in {3, 5}\n            and pd.notna(row["match_time_sec"])\n'''
          new = '''            and method in METHODS\n            and pd.notna(row["total_rounds"])\n            and int(row["total_rounds"]) in {3, 5}\n            and pd.notna(row["match_time_sec"])\n'''
          if old not in text:
              raise RuntimeError("Expected frozen cohort-selector block not found")
          path.write_text(text.replace(old, new, 1))
          print("Applied CI-only null guard; frozen repository source unchanged")
          PY

      - name: Fit frozen Event Clock V1 parent bundle
        run: python -m pipeline.simulation.event_clock_mc_v1.fit_event_clock_bundle

      - name: Fit Event Clock V2 direct bundle from final V3
        run: python -m pipeline.simulation.event_clock_mc_v2.fit_event_clock_bundle

      - name: Run Sacramento card — canonical C only
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.run_live_card_canonical_c \
            --event-date 2026-08-22 --paths 2000 2>&1 | tee /tmp/canonical_c_card.log

      - name: Print card output
        if: always()
        run: |
          if [ -f /tmp/canonical_c_card.log ]; then
            tail -n 160 /tmp/canonical_c_card.log
          fi

      - name: Upload card predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-c-sacramento-card
          path: data/diagnostics/event_clock_mc_v2/live_card_canonical_c/*.csv
          if-no-files-found: warn
