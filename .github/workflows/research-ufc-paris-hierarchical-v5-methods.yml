name: Research UFC Paris Hierarchical V5 Methods

on:
  push:
    branches: [research/ufc-prop-mispricing-xgboost-20260829]
    paths: [.github/workflows/research-ufc-paris-hierarchical-v5-methods.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install frozen research packages
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6 scikit-learn==1.9.0 scipy==1.17.1 xgboost==3.2.0 joblib==1.5.3 threadpoolctl==3.6.0 python-dateutil==2.9.0.post0 requests pyyaml
      - name: Run frozen Paris hierarchical V5 method scorer
        run: |
          python -m pipeline.research.score_ufc_paris_hierarchical_v5_methods
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/research/prop_mispricing/ufc_paris_hierarchical_v5_methods_current_20260831.csv
          git commit -m "research: add UFC Paris hierarchical V5 method scores" || echo No-changes
          for i in 1 2 3; do
            git pull --rebase origin research/ufc-prop-mispricing-xgboost-20260829 || true
            git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829 && exit 0
            sleep 3
          done
          exit 1
