name: Clinch Timing Simulation OOS Diagnostic

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - 'pipeline/research/clinch_timing_simulation_oos_diagnostic.py'
      - '.github/workflows/clinch-timing-simulation-oos-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            configs
            config
            data/master
            data/fight_details
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow scipy scikit-learn pyyaml joblib
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Diagnose clinch timing
        run: |
          set -euo pipefail
          cp -a restored/canonical-weight-class-state/. data/
          python -m pipeline.research.clinch_timing_simulation_oos_diagnostic | tee clinch-timing-simulation-oos-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: clinch-timing-simulation-oos-${{ github.run_id }}
          path: |
            clinch-timing-simulation-oos-diagnostic.json
            data/research/clinch_timing_simulation_oos/results.json
            data/research/clinch_timing_simulation_oos/fight_level_results.csv
