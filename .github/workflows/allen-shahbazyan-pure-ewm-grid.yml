name: Allen Shahbazyan Pure EWM Grid

on:
  push:
    branches:
      - research/allen-shahbazyan-pure-ewm-grid-20260826

permissions:
  contents: read
  actions: read

jobs:
  allen-shahbazyan-pure-ewm-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Sparse shallow checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            configs
            config
            data/master
            data/fight_details

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install numpy pandas pyarrow pyyaml scipy scikit-learn joblib

      - name: Restore canonical historical Brain MC inputs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ github.token }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Run Allen Shahbazyan pure EWM grid only
        run: |
          cp -a restored/canonical-weight-class-state/. data/
          mkdir -p artifacts/allen-shahbazyan-pure-ewm-grid
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.allen_shahbazyan_pure_ewm_grid \
            | tee artifacts/allen-shahbazyan-pure-ewm-grid/result.txt

      - name: Upload grid result
        uses: actions/upload-artifact@v4
        with:
          name: allen-shahbazyan-pure-ewm-grid-${{ github.run_id }}
          path: artifacts/allen-shahbazyan-pure-ewm-grid/result.txt
          if-no-files-found: error
          retention-days: 30
