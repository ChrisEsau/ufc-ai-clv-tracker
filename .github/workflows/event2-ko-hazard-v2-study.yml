name: Event2 KO Hazard V2 Study

on:
  push:
    branches:
      - research/schnell-costa-ewm05-sixway-20260826
    paths:
      - 'pipeline/research/run_event2_ko_hazard_v2_study.py'
      - 'pipeline/research/run_event2_ko_hazard_v2_study_fast.py'
      - '.github/workflows/event2-ko-hazard-v2-study.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ko-hazard-v2-study:
    runs-on: ubuntu-24.04
    steps:
      - name: Sparse shallow checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            data/master
            data/fight_details

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install numpy pandas pyarrow scipy scikit-learn pyyaml joblib

      - name: Restore canonical historical FSR V3 state
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ github.token }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Run grouped-strike KO hazard study
        run: |
          cp -a restored/canonical-weight-class-state/. data/
          python -m pipeline.research.run_event2_ko_hazard_v2_study_fast \
            --bootstrap 500 \
            --output-dir data/research/event2_ko_hazard_v2 \
            | tee event2-ko-hazard-v2.log

      - name: Upload study outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event2-ko-hazard-v2-study-${{ github.run_id }}
          path: |
            data/research/event2_ko_hazard_v2
            event2-ko-hazard-v2.log
          if-no-files-found: warn
          retention-days: 30
