name: KO V3 Positive-Only Defense Nine Fight

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - 'pipeline/simulation/event_clock_mc_v2/diagnostics/ko_v3_positive_only_defense_nine_fight_cohort.py'
      - '.github/workflows/ko-v3-positive-only-defense-nine-fight.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run-cohort:
    strategy:
      fail-fast: false
      matrix:
        target_index: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-24.04
    env:
      TARGET_INDEX: ${{ matrix.target_index }}
    steps:
      - name: Sparse shallow checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            configs
            config
            data/master
            data/fight_details
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas pyarrow pyyaml scipy scikit-learn joblib
      - name: Restore canonical historical Brain MC inputs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ github.token }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Run positive-only defense cohort fight
        run: |
          set -euo pipefail
          cp -a restored/canonical-weight-class-state/. data/
          mkdir -p artifacts/ko-v3-positive-only-defense
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.ko_v3_positive_only_defense_nine_fight_cohort \
            | tee artifacts/ko-v3-positive-only-defense/result-${TARGET_INDEX}.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ko-v3-positive-only-defense-${{ matrix.target_index }}-${{ github.run_id }}
          path: artifacts/ko-v3-positive-only-defense/result-${{ matrix.target_index }}.txt
          if-no-files-found: error
          retention-days: 30
