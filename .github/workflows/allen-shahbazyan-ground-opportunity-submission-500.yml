name: Allen Shahbazyan Ground Opportunity Submission 500

on:
  workflow_dispatch:
  push:
    paths:
      - 'pipeline/research/allen_shahbazyan_ground_opportunity_submission_500.py'
      - '.github/workflows/allen-shahbazyan-ground-opportunity-submission-500.yml'

permissions:
  contents: read
  actions: read

jobs:
  run500:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pipeline
            configs
            config
            data/master
            data/fight_details
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow scipy scikit-learn pyyaml joblib
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ github.token }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Run 500-path Allen MC
        run: |
          set -euo pipefail
          cp -a restored/canonical-weight-class-state/. data/
          python -m pipeline.research.allen_shahbazyan_ground_opportunity_submission_500 | tee allen-shahbazyan-ground-opportunity-submission-500.txt
      - uses: actions/upload-artifact@v4
        with:
          name: allen-shahbazyan-ground-opportunity-submission-500-${{ github.run_id }}
          path: |
            allen-shahbazyan-ground-opportunity-submission-500.txt
            data/research/allen_shahbazyan_ground_opportunity_submission_500/
