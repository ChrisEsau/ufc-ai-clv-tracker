name: Run Post-KO Next Fight Study

on:
  workflow_dispatch:
    inputs:
      include_doctor_stoppage:
        description: "Include doctor stoppages as KO/TKO losses"
        required: true
        default: false
        type: boolean
      include_same_day_next_fights:
        description: "Include same-day next fights in modern outputs"
        required: true
        default: false
        type: boolean
      modern_era_start:
        description: "Modern-era start date"
        required: true
        default: "2005-01-01"
      recent_era_start:
        description: "Recent-era start date"
        required: true
        default: "2015-01-01"
      prime_era_start:
        description: "Prime-era start date"
        required: true
        default: "2020-01-01"

permissions:
  contents: write

concurrency:
  group: post-ko-next-fight-study-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-post-ko-next-fight-study:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas pyarrow

      - name: Run Post-KO Next Fight Study
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.include_doctor_stoppage }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --include-doctor-stoppage"
          fi
          if [ "${{ github.event.inputs.include_same_day_next_fights }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --include-same-day-next-fights"
          fi
          python -m pipeline.research.run_post_ko_next_fight_study \
            --modern-era-start "${{ github.event.inputs.modern_era_start }}" \
            --recent-era-start "${{ github.event.inputs.recent_era_start }}" \
            --prime-era-start "${{ github.event.inputs.prime_era_start }}" \
            $EXTRA_ARGS

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: post-ko-next-fight-study
          path: |
            data/research/post_ko_next_fight_study.parquet
            data/research/post_ko_next_fight_study.csv
            data/research/post_ko_next_fight_summary.csv
            data/research/post_ko_next_fight_bucket_summary.csv
            data/research/post_ko_next_fight_era_summary.csv
            data/research/post_ko_next_fight_modern_study.parquet
            data/research/post_ko_next_fight_modern_study.csv
            data/research/post_ko_next_fight_modern_summary.csv
            data/research/post_ko_next_fight_modern_bucket_summary.csv
            data/research/post_ko_next_fight_age_summary.csv
            data/research/post_ko_next_fight_ko_count_summary.csv
          if-no-files-found: error

      - name: Commit research artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/research/post_ko_next_fight_study.parquet \
            data/research/post_ko_next_fight_study.csv \
            data/research/post_ko_next_fight_summary.csv \
            data/research/post_ko_next_fight_bucket_summary.csv \
            data/research/post_ko_next_fight_era_summary.csv \
            data/research/post_ko_next_fight_modern_study.parquet \
            data/research/post_ko_next_fight_modern_study.csv \
            data/research/post_ko_next_fight_modern_summary.csv \
            data/research/post_ko_next_fight_modern_bucket_summary.csv \
            data/research/post_ko_next_fight_age_summary.csv \
            data/research/post_ko_next_fight_ko_count_summary.csv

          git commit -m "Update post-KO next fight research artifacts" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
