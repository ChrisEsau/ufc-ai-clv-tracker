name: Run Post-KO Next Fight Study

on:
  workflow_dispatch:
    inputs:
      include_doctor_stoppage:
        description: "Include doctor stoppages as KO/TKO losses"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: post-ko-next-fight-study-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-post-ko-next-fight-study:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas pyarrow

      - name: Run Post-KO Next Fight Study
        run: |
          if [ "${{ github.event.inputs.include_doctor_stoppage }}" = "true" ]; then
            python -m pipeline.research.run_post_ko_next_fight_study --include-doctor-stoppage
          else
            python -m pipeline.research.run_post_ko_next_fight_study
          fi

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: post-ko-next-fight-study
          path: |
            data/research/post_ko_next_fight_study.parquet
            data/research/post_ko_next_fight_study.csv
            data/research/post_ko_next_fight_summary.csv
            data/research/post_ko_next_fight_bucket_summary.csv
          if-no-files-found: error

      - name: Commit research artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/research/post_ko_next_fight_study.parquet \
            data/research/post_ko_next_fight_study.csv \
            data/research/post_ko_next_fight_summary.csv \
            data/research/post_ko_next_fight_bucket_summary.csv

          git commit -m "Update post-KO next fight research artifacts" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
