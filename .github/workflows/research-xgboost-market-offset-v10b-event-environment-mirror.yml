name: Research XGBoost Market Offset V10b Event Environment Mirror

on:
  push:
    branches:
      - research/ufc-prop-mispricing-xgboost-20260829
    paths:
      - .github/workflows/research-xgboost-market-offset-v10b-event-environment-mirror.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v10b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy scikit-learn xgboost requests beautifulsoup4
      - name: Run V10 with GitHub-mirrored UFCStats event locations
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('.github/workflows/research-xgboost-market-offset-v10-event-environment.yml')
          s=p.read_text()
          marker="          python - <<'PY'\n"
          start=s.index(marker)+len(marker)
          end=s.index("\n          PY",start)
          code=textwrap.dedent(s[start:end])
          old="""# Authoritative historical event locations from UFCStats completed-event listing.\nurl='https://ufcstats.com/statistics/events/completed?page=all'\nr=requests.get(url,headers={'User-Agent':'Mozilla/5.0 UFC research'},timeout=30); r.raise_for_status()\nsoup=BeautifulSoup(r.text,'html.parser')\nevents=[]\nfor row in soup.select('tr.b-statistics__table-row'):\n    link=row.select_one('a.b-link.b-link_style_black')\n    cols=row.select('td.b-statistics__table-col')\n    if not link or len(cols)<2: continue\n    name=link.get_text(' ',strip=True)\n    date_el=row.select_one('.b-statistics__date')\n    date=pd.to_datetime(date_el.get_text(' ',strip=True) if date_el else None,errors='coerce')\n    location=cols[-1].get_text(' ',strip=True)\n    if pd.notna(date) and name and location:\n        events.append({'event_name_ufcstats':name,'date':date.normalize(),'location':location,'event_norm':norm(name)})\nev=pd.DataFrame(events).drop_duplicates(['date','event_norm'])\nif ev.empty: raise RuntimeError('No UFCStats event locations parsed')\n"""
          new="""# Historical UFCStats event locations from a maintained GitHub mirror.\nurl='https://raw.githubusercontent.com/OppositeMusical/MMA-AI/main/ufc_event_details.csv'\nev=pd.read_csv(url)\nev=ev.rename(columns={'EVENT':'event_name_ufcstats','DATE':'date','LOCATION':'location'})\nev['date']=pd.to_datetime(ev['date'],errors='coerce').dt.normalize()\nev['event_norm']=ev['event_name_ufcstats'].map(norm)\nev=ev.dropna(subset=['date','location','event_name_ufcstats']).drop_duplicates(['date','event_norm'])\nif ev.empty: raise RuntimeError('No mirrored UFCStats event locations loaded')\n"""
          if old not in code:
              raise RuntimeError('Expected V10 source block not found')
          code=code.replace(old,new)
          code=code.replace("'name':'market_offset_v10_event_environment'","'name':'market_offset_v10b_event_environment_mirror'")
          code=code.replace("xgboost_market_offset_v10_event_environment_summary.json","xgboost_market_offset_v10b_event_environment_summary.json")
          exec(compile(code,'v10b_dynamic.py','exec'),{})
          PY
      - name: Commit output safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/prop_mispricing/xgboost_market_offset_v10b_event_environment_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "Add V10b event environment research outputs"
          for i in 1 2 3 4 5; do
            git fetch origin research/ufc-prop-mispricing-xgboost-20260829
            git rebase origin/research/ufc-prop-mispricing-xgboost-20260829 || { git rebase --abort; sleep 2; continue; }
            git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829 && exit 0
            sleep 3
          done
          exit 1
