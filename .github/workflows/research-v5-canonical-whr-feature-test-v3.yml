name: Research V5 Canonical WHR Feature Test V3

on:
  push:
    paths:
      - 'data/research/prop_mispricing/v5_canonical_whr_feature_test_v3_trigger.txt'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ufc-prop-mispricing-xgboost-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - run: |
          python -m pip install --upgrade pip==26.2.1
          pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6 scikit-learn==1.9.0 scipy==1.17.1 xgboost==3.2.0
      - name: Restore exact V5-era data snapshot
        run: |
          git checkout 7df1b61126be1f4e036b256d1c774c531b8a281f -- \
            data/market/historical_market_outcomes.parquet \
            data/features/moneyline_feature_view.parquet \
            data/master/ufc_master.parquet
      - name: Materialize canonical prior WHR implementation
        run: |
          git show 8f18b071a0d4913b165471a3133a5464776e680c:pipeline/research/prefight_strength_elo.py > /tmp/prefight_strength_elo.py
          git show 8f18b071a0d4913b165471a3133a5464776e680c:pipeline/research/prefight_strength_fightmatrix_whr.py \
            | sed 's/from pipeline.research.prefight_strength_elo import build_bouts/from prefight_strength_elo import build_bouts/' \
            > /tmp/prefight_strength_fightmatrix_whr.py
      - name: Build leakage-safe canonical WHR prefight snapshots through 2024
        run: |
          python - <<'PY'
          import pandas as pd
          p='data/master/ufc_master.parquet'
          d=pd.read_parquet(p)
          date_col=next(c for c in ['date','event_date','fight_date','bout_date'] if c in d.columns)
          dates=pd.to_datetime(d[date_col],errors='coerce')
          d=d[dates <= pd.Timestamp('2024-12-31')].copy()
          d.to_parquet('/tmp/v5_whr_master_through_2024.parquet',index=False)
          print('WHR source rows through 2024:',len(d))
          PY
          mkdir -p /tmp/v5_whr
          PYTHONPATH=/tmp python /tmp/prefight_strength_fightmatrix_whr.py \
            --input /tmp/v5_whr_master_through_2024.parquet \
            --output-dir /tmp/v5_whr \
            --holdout-from 2010-01-01 \
            --w2 7.5625
      - name: Run exact V5 plus WHR OOF test
        run: python pipeline/research/v5_whr_feature_test_v3.py
      - name: Commit research outputs
        run: |
          git restore --source=HEAD -- data/market/historical_market_outcomes.parquet data/features/moneyline_feature_view.parquet data/master/ufc_master.parquet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/research/prop_mispricing/v5_whr_feature_test_summary.json data/research/prop_mispricing/v5_whr_feature_test_oof.csv
          git diff --cached --quiet && exit 0
          git commit -m "Add canonical V5 WHR feature test results"
          for i in 1 2 3 4 5; do
            git fetch origin research/ufc-prop-mispricing-xgboost-20260829
            git rebase origin/research/ufc-prop-mispricing-xgboost-20260829 || { git rebase --abort; sleep 2; continue; }
            git push origin HEAD:research/ufc-prop-mispricing-xgboost-20260829 && exit 0
            sleep 3
          done
          exit 1
