name: Run Monday Reset Orchestrator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "production"
        type: choice
        options:
          - test
          - production
      max_events:
        description: "Maximum missing completed events to ingest; use all for every missing event"
        required: true
        default: "1"
        type: string
      auto_append:
        description: "Append staged rows to master after all hard checks pass"
        required: true
        default: true
        type: boolean
      skip_bankroll:
        description: "Skip bankroll status refresh"
        required: true
        default: false
        type: boolean
      skip_clv:
        description: "Skip CLV tracker refresh"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: monday-reset-orchestrator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-monday-reset-orchestrator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-workspace.txt
          pip install pyyaml scikit-learn==1.6.1 xgboost

      - name: Run Monday Reset orchestrator
        run: |
          ARGS=(
            --mode "${{ inputs.mode }}"
            --max-events "${{ inputs.max_events }}"
          )

          if [ "${{ inputs.auto_append }}" = "true" ]; then
            ARGS+=(--auto-append)
          fi

          if [ "${{ inputs.skip_bankroll }}" = "true" ]; then
            ARGS+=(--skip-bankroll)
          fi

          if [ "${{ inputs.skip_clv }}" = "true" ]; then
            ARGS+=(--skip-clv)
          fi

          python -m pipeline.operations.run_monday_reset_with_market "${ARGS[@]}"

      - name: Commit Monday Reset artifacts
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Stage model-scoped outputs after Monday Reset has generated them.
          find data/predictions/by_model -type f \(
            -name 'model_outcomes.parquet' -o
            -name 'ensemble_details.parquet' -o
            -name 'ensemble_exclusions.parquet'
          \) -print0 2>/dev/null | xargs -0 -r git add -f

          git add -f \
            data/status/monday_reset_status.json \
            data/status/ufc_ufcstats_event_check.parquet \
            data/cards/ufcstats_upcoming_events.parquet \
            data/cards/ufcstats_upcoming_fights.parquet \
            data/cards/ufc_selected_live_card_event.parquet \
            data/predictions/ufc_live_card.parquet \
            data/market/draftkings_event_index.parquet \
            data/market/draftkings_event_card_matches.parquet \
            data/market/draftkings_market_diagnostic.parquet \
            data/market/draftkings_raw_index.parquet \
            data/market/fanduel_market_catalog.parquet \
            data/market/fanduel_market_diagnostic.parquet \
            data/market/fanduel_event_card_matches.parquet \
            data/market/fanduel_event_index.parquet \
            data/market/draftkings_market_catalog.parquet \
            data/market/canonical_market_catalog.parquet \
            data/market/market_outcomes.parquet \
            data/audits/canonical_market_catalog_audit.parquet \
            data/audits/ufc_market_match_audit_v2.parquet \
            data/market/market_intelligence_history.parquet \
            data/audits/market_intelligence_history_audit.parquet \
            data/market/market_signals.parquet \
            data/audits/market_signals_audit.parquet \
            data/features/fighter_state_history.parquet \
            data/features/latest_fighter_state.parquet \
            data/features/moneyline_feature_view.parquet \
            data/predictions/live_model_features.parquet \
            data/predictions/model_outcomes.parquet \
            data/predictions/betting_outcomes.parquet \
            data/audits/production_prediction_audit.parquet \
            data/audits/ufc_live_feature_audit.parquet \
            data/audits/ufc_betting_outcomes_audit.parquet \
            data/audits/ufc_betting_join_key_diagnostic.parquet \
            data/snapshots/model_market_snapshots.parquet \
            data/audits/model_market_snapshot_audit.parquet \
            data/audits/ufc_live_card_build_audit.parquet \
            data/audits/ufc_live_card_rejected_rows.parquet \
            data/staging/ufc_missing_events.parquet \
            data/staging/ufc_staged_fight_rows.parquet \
            data/staging/ufc_staged_fight_details.parquet \
            data/staging/ufc_staged_master_rows.parquet \
            data/staging/ufc_staged_master_rows_enriched.parquet \
            data/staging/ufc_staged_fighter_profiles.parquet \
            data/staging/ufc_staged_master_rows_profiled.parquet \
            data/audits/ufc_missing_event_ingestion_audit.parquet \
            data/audits/ufc_fight_scrape_audit.parquet \
            data/audits/ufc_fight_detail_scrape_audit.parquet \
            data/audits/ufc_staged_master_mapping_audit.parquet \
            data/audits/ufc_staged_derived_stats_audit.parquet \
            data/audits/ufc_fighter_profile_scrape_audit.parquet \
            data/audits/ufc_master_column_validation.parquet \
            data/audits/ufc_append_precheck.parquet \
            data/audits/ufc_append_duplicate_check.parquet \
            data/audits/ufc_append_required_field_audit.parquet \
            data/audits/ufc_staged_final_review.parquet \
            data/audits/ufc_append_audit.parquet \
            data/audits/ufc_bet_settlement_audit.parquet \
            data/status/ufc_dataset_status.parquet \
            data/status/ufc_dataset_event_status.parquet \
            data/bankroll/ufc_bankroll_settings.parquet \
            data/bankroll/ufc_bet_ledger.parquet \
            data/bankroll/ufc_open_bets.parquet \
            data/bankroll/ufc_bankroll_snapshots.parquet \
            data/market/ufc_normalized_market_snapshots.parquet \
            data/audits/ufc_clv_market_normalization_audit.parquet \
            data/market/ufc_closing_lines.parquet \
            data/market/ufc_clv_results.parquet \
            data/market/ufc_line_movement.parquet || true


          if [ "${{ inputs.auto_append }}" = "true" ]; then
            git add -f data/master/ufc_master.parquet || true
            git add -f data/backups/ufc_master_backup_before_append_*.parquet 2>/dev/null || true
          fi

          git commit -m "Run Monday Reset orchestrator" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
