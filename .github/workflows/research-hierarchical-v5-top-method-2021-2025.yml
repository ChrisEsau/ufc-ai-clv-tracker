name: Research Hierarchical V5 Top Method 2021-2025

on:
  workflow_dispatch:
  push:
    branches:
      - research/ko-method-edge-xgb-20260831
    paths:
      - .github/workflows/research-hierarchical-v5-top-method-2021-2025.yml
      - pipeline/research/evaluate_hierarchical_v5_top_method_2021_2025.py

permissions:
  contents: read

jobs:
  top-method-roi:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/ko-method-edge-xgb-20260831
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install scoring dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.4.6

      - name: Score exact one-bet-per-fight rule
        run: python -m pipeline.research.evaluate_hierarchical_v5_top_method_2021_2025

      - name: Upload ROI outputs
        uses: actions/upload-artifact@v4
        with:
          name: hierarchical-v5-top-method-2021-2025
          path: |
            data/research/prop_mispricing/hierarchical_v5_top_method_2021_2025_ledger.csv
            data/research/prop_mispricing/hierarchical_v5_top_method_2021_2025_summary.csv
            data/research/prop_mispricing/hierarchical_v5_top_method_2021_2025_summary.json
          if-no-files-found: error
