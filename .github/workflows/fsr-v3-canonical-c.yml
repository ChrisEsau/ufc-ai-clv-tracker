name: Event Clock V2 Bantamweight Three Arm Validation

# High-path men's bantamweight validation for the three shortlisted consequence arms.
on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_three_arm_validation.py"

permissions:
  contents: read
  actions: read

jobs:
  simulate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy statsmodels pyarrow pyyaml scikit-learn joblib

      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Verify frozen inputs and bantamweight validation
        run: |
          test -f data/fight_details/ufc_round_stats.parquet
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f data/fsr_v3/fsr_v3_prefight_uncertainty.parquet
          test -f data/models/event_clock_mc_v1/event_clock_frozen_bundle.joblib
          test -f data/models/event_clock_mc_v2/event_clock_v2_fsr_v3_bundle.joblib
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/kd_finishing_sequence_screen.py
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/flyweight_joint_tuning_screen.py
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_three_arm_validation.py

      - name: Run bantamweight three arm validation
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.bantamweight_three_arm_validation \
            --target-n 100 \
            --paths 100 \
            --seed 20260823 \
            --out-dir data/diagnostics/event_clock_mc_v2/bantamweight_three_arm_validation \
            2>&1 | tee /tmp/bantamweight_three_arm_validation.log

      - name: Print bantamweight validation results
        if: always()
        run: |
          if [ -f /tmp/bantamweight_three_arm_validation.log ]; then
            tail -n 500 /tmp/bantamweight_three_arm_validation.log
          fi

      - name: Upload bantamweight validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-bantamweight-three-arm-validation
          path: data/diagnostics/event_clock_mc_v2/bantamweight_three_arm_validation/*.csv
          if-no-files-found: warn
