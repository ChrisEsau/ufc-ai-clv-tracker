name: Event Clock V2 Bantamweight Prefight Form Market Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_prefight_form_market_audit.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scikit-learn

      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Download completed dog compression diagnostic
        uses: actions/download-artifact@v4
        with:
          name: event-clock-v2-bantamweight-dog-compression-diagnostic
          path: /tmp/bantamweight_dog_compression_diagnostic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32728541146

      - name: Verify form-audit inputs
        run: |
          test -f data/master/ufc_master.parquet
          test -f /tmp/bantamweight_dog_compression_diagnostic/favorite_dog_fight_level.csv
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_prefight_form_market_audit.py

      - name: Run prefight form vs market audit
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.bantamweight_prefight_form_market_audit \
            --priced-fights-path /tmp/bantamweight_dog_compression_diagnostic/favorite_dog_fight_level.csv \
            --out-dir data/diagnostics/event_clock_mc_v2/bantamweight_prefight_form_market_audit \
            2>&1 | tee /tmp/bantamweight_prefight_form_market_audit.log

      - name: Print form audit
        if: always()
        run: |
          if [ -f /tmp/bantamweight_prefight_form_market_audit.log ]; then
            cat /tmp/bantamweight_prefight_form_market_audit.log
          fi

      - name: Upload form audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-bantamweight-prefight-form-market-audit
          path: data/diagnostics/event_clock_mc_v2/bantamweight_prefight_form_market_audit/*.csv
          if-no-files-found: warn
