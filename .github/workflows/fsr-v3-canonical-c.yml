name: Event Clock V2 Phase Imposition Falsification

on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/phase_imposition_falsification.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scipy scikit-learn joblib pyyaml
      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Download frozen bantamweight market audit
        uses: actions/download-artifact@v4
        with:
          name: event-clock-v2-bantamweight-market-edge-audit
          path: /tmp/market_edge
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32726886999
      - name: Verify phase-imposition inputs
        run: |
          test -f data/fight_details/ufc_round_stats.parquet
          test -f data/master/ufc_master.parquet
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f /tmp/market_edge/bet_level_audit.csv
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/phase_imposition_falsification.py
          mkdir -p data/diagnostics/event_clock_mc_v2/phase_imposition_falsification
      - name: Run phase-imposition falsification
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.phase_imposition_falsification \
            2>&1 | tee /tmp/phase_imposition_falsification.log
      - name: Print phase-imposition falsification
        if: always()
        run: cat /tmp/phase_imposition_falsification.log || true
      - name: Upload phase-imposition falsification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-phase-imposition-falsification
          path: data/diagnostics/event_clock_mc_v2/phase_imposition_falsification/*.csv
          if-no-files-found: warn
