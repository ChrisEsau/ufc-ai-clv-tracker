name: Weight Class Audit - Women's Bantamweight

# Trigger refresh: 2026-08-23 women's-bantamweight simulate-only audit
on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"

permissions:
  contents: read
  actions: read

jobs:
  simulate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn statsmodels joblib pyarrow pyyaml

      - name: Download frozen canonical simulation state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Verify frozen state
        run: |
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f data/fsr_v3/fsr_v3_prefight_uncertainty.parquet
          test -f data/models/event_clock_mc_v1/event_clock_frozen_bundle.joblib
          test -f data/models/event_clock_mc_v2/event_clock_v2_fsr_v3_bundle.joblib
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/weight_class_audit.py

      - name: Run women's bantamweight audit
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.weight_class_audit \
            --division "women's bantamweight" \
            --target-n 100 \
            --paths 500 \
            --seed 20260823 \
            --out-dir data/diagnostics/event_clock_mc_v2/weight_class_audit/womens_bantamweight \
            2>&1 | tee /tmp/womens_bantamweight_audit.log

      - name: Print women's bantamweight audit headline
        if: always()
        run: |
          if [ -f /tmp/womens_bantamweight_audit.log ]; then
            tail -n 180 /tmp/womens_bantamweight_audit.log
          fi

      - name: Upload women's bantamweight audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weight-class-audit-womens-bantamweight
          path: data/diagnostics/event_clock_mc_v2/weight_class_audit/womens_bantamweight/*.csv
          if-no-files-found: warn
