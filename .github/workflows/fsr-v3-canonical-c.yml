name: Weight Class Audit Seed - Men's Bantamweight

on:
  pull_request:
    paths:
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/weight_class_audit.py"
      - ".github/workflows/fsr-v3-canonical-c.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn statsmodels joblib pyarrow pyyaml pytest

      - name: Compile audit module
        run: python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/weight_class_audit.py

      - name: Build frozen FSR V2 source histories
        run: python -m pipeline.fsr_v2.build --all

      - name: Publish frozen FSR V2 source snapshots
        run: python -m pipeline.fsr_v2.publish

      - name: Build final canonical FSR V3
        run: python -m pipeline.fsr_v3.build_canonical

      - name: Patch incomplete-row cohort guard in CI checkout only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("pipeline/simulation/event_mc_v1/diagnostics/fresh_100_fight_predictive_replay.py")
          text = path.read_text()
          old = '''            and method in METHODS\n            and int(row["total_rounds"]) in {3, 5}\n            and pd.notna(row["match_time_sec"])\n'''
          new = '''            and method in METHODS\n            and pd.notna(row["total_rounds"])\n            and int(row["total_rounds"]) in {3, 5}\n            and pd.notna(row["match_time_sec"])\n'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Fit frozen Event Clock V1 parent bundle
        run: python -m pipeline.simulation.event_clock_mc_v1.fit_event_clock_bundle

      - name: Fit Event Clock V2 direct bundle from final V3
        run: python -m pipeline.simulation.event_clock_mc_v2.fit_event_clock_bundle

      - name: Persist canonical weight-class simulation state
        uses: actions/upload-artifact@v4
        with:
          name: canonical-weight-class-state
          path: |
            data/fsr_v3/**
            data/models/event_clock_mc_v1/**
            data/models/event_clock_mc_v2/**
          if-no-files-found: error
          retention-days: 90

      - name: Run men's bantamweight audit
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.weight_class_audit \
            --division bantamweight \
            --target-n 100 \
            --paths 500 \
            --seed 20260823 \
            --out-dir data/diagnostics/event_clock_mc_v2/weight_class_audit/bantamweight \
            2>&1 | tee /tmp/bantamweight_audit.log

      - name: Print bantamweight audit headline
        if: always()
        run: |
          if [ -f /tmp/bantamweight_audit.log ]; then
            tail -n 180 /tmp/bantamweight_audit.log
          fi

      - name: Upload bantamweight audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weight-class-audit-bantamweight
          path: data/diagnostics/event_clock_mc_v2/weight_class_audit/bantamweight/*.csv
          if-no-files-found: warn
