name: Event Clock V2 Basharat Vazquez FSR Market Target

on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/basharat_vazquez_fsr_market_target.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scipy scikit-learn joblib pyyaml
      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Verify FSR market target inputs
        run: |
          test -f data/master/ufc_master.parquet
          test -f data/market/historical_market_outcomes.parquet
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f data/fsr_v3/fsr_v3_prefight_uncertainty.parquet
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/basharat_vazquez_fsr_market_target.py
      - name: Run Basharat Vazquez FSR market target audit
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.basharat_vazquez_fsr_market_target \
            2>&1 | tee /tmp/basharat_vazquez_fsr_market_target.log
      - name: Print FSR market target audit
        if: always()
        run: cat /tmp/basharat_vazquez_fsr_market_target.log || true
      - name: Upload FSR market target audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-basharat-vazquez-fsr-market-target
          path: data/diagnostics/event_clock_mc_v2/basharat_vazquez_fsr_market_target/*.csv
          if-no-files-found: warn
