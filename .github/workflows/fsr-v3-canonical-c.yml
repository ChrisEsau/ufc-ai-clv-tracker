name: Event Clock V2 Held-Out Decision Judge Sharpness Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_judge_sharpness_audit.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scikit-learn joblib pyyaml scipy statsmodels

      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Verify judge-audit inputs
        run: |
          test -f data/master/ufc_master.parquet
          test -f data/diagnostics/event_clock_mc_v1/stage10_decision_judge_fresh.csv
          test -f data/models/event_clock_mc_v2/event_clock_v2_fsr_v3_bundle.joblib
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_judge_sharpness_audit.py

      - name: Run held-out judge sharpness audit
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.bantamweight_judge_sharpness_audit \
            --out-dir data/diagnostics/event_clock_mc_v2/bantamweight_judge_sharpness_audit \
            2>&1 | tee /tmp/bantamweight_judge_sharpness_audit.log

      - name: Print judge sharpness audit
        if: always()
        run: |
          if [ -f /tmp/bantamweight_judge_sharpness_audit.log ]; then
            cat /tmp/bantamweight_judge_sharpness_audit.log
          fi

      - name: Upload judge sharpness outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-held-out-decision-judge-sharpness-audit
          path: data/diagnostics/event_clock_mc_v2/bantamweight_judge_sharpness_audit/*.csv
          if-no-files-found: warn
