name: Event Clock V2 Bantamweight Market Edge Audit

# Retrospective betting-value audit for selected men's bantamweight i10_b0 candidate.
on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_market_edge_audit.py"

permissions:
  contents: read
  actions: read

jobs:
  market-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scikit-learn

      - name: Download completed bantamweight validation outputs
        uses: actions/download-artifact@v4
        with:
          name: event-clock-v2-bantamweight-three-arm-validation
          path: /tmp/bantamweight_three_arm_validation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32723807594

      - name: Verify audit inputs
        run: |
          test -f /tmp/bantamweight_three_arm_validation/fight_summaries.csv
          test -f data/market/historical_market_outcomes.parquet
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_market_edge_audit.py

      - name: Run bantamweight market edge audit
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.bantamweight_market_edge_audit \
            --predictions-path /tmp/bantamweight_three_arm_validation/fight_summaries.csv \
            --market-path data/market/historical_market_outcomes.parquet \
            --out-dir data/diagnostics/event_clock_mc_v2/bantamweight_market_edge_audit \
            2>&1 | tee /tmp/bantamweight_market_edge_audit.log

      - name: Print market edge audit
        if: always()
        run: |
          if [ -f /tmp/bantamweight_market_edge_audit.log ]; then
            cat /tmp/bantamweight_market_edge_audit.log
          fi

      - name: Upload market edge audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-bantamweight-market-edge-audit
          path: data/diagnostics/event_clock_mc_v2/bantamweight_market_edge_audit/*.csv
          if-no-files-found: warn
