name: Event Clock V2 Bantamweight Decision Path Input Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_decision_path_input_audit.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scikit-learn joblib pyyaml scipy statsmodels

      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Download completed dog compression diagnostic
        uses: actions/download-artifact@v4
        with:
          name: event-clock-v2-bantamweight-dog-compression-diagnostic
          path: /tmp/bantamweight_dog_compression_diagnostic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32728541146

      - name: Verify decision-path inputs
        run: |
          test -f /tmp/bantamweight_dog_compression_diagnostic/favorite_dog_fight_level.csv
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f data/fsr_v3/fsr_v3_prefight_uncertainty.parquet
          test -f data/models/event_clock_mc_v2/event_clock_v2_fsr_v3_bundle.joblib
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_decision_path_input_audit.py

      - name: Run path-level decision input audit
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.bantamweight_decision_path_input_audit \
            --priced-fights-path /tmp/bantamweight_dog_compression_diagnostic/favorite_dog_fight_level.csv \
            --paths 100 \
            --seed 20260823 \
            --out-dir data/diagnostics/event_clock_mc_v2/bantamweight_decision_path_input_audit \
            2>&1 | tee /tmp/bantamweight_decision_path_input_audit.log

      - name: Print decision-path audit
        if: always()
        run: |
          if [ -f /tmp/bantamweight_decision_path_input_audit.log ]; then
            cat /tmp/bantamweight_decision_path_input_audit.log
          fi

      - name: Upload decision-path outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-bantamweight-decision-path-input-audit
          path: data/diagnostics/event_clock_mc_v2/bantamweight_decision_path_input_audit/*.csv
          if-no-files-found: warn
