name: Event Clock V2 Full Men's KD Sequence Validation

# Full-cohort A/B validation of the selected post-KD finishing-sequence candidate.
on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/full_mens_kd_sequence_validation.py"

permissions:
  contents: read
  actions: read

jobs:
  simulate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy statsmodels pyarrow pyyaml scikit-learn joblib

      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Verify frozen inputs and full A/B diagnostic
        run: |
          test -f data/fight_details/ufc_round_stats.parquet
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f data/fsr_v3/fsr_v3_prefight_uncertainty.parquet
          test -f data/models/event_clock_mc_v1/event_clock_frozen_bundle.joblib
          test -f data/models/event_clock_mc_v2/event_clock_v2_fsr_v3_bundle.joblib
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/full_mens_kd_sequence_validation.py
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/kd_finishing_sequence_screen.py

      - name: Run full men's KD sequence A/B validation
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.full_mens_kd_sequence_validation \
            --target-n 100 \
            --paths 30 \
            --seed 20260823 \
            --out-dir data/diagnostics/event_clock_mc_v2/full_mens_kd_sequence_validation \
            2>&1 | tee /tmp/full_mens_kd_sequence_validation.log

      - name: Print validation results
        if: always()
        run: |
          if [ -f /tmp/full_mens_kd_sequence_validation.log ]; then
            tail -n 500 /tmp/full_mens_kd_sequence_validation.log
          fi

      - name: Upload full men's KD sequence validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-full-mens-kd-sequence-validation
          path: data/diagnostics/event_clock_mc_v2/full_mens_kd_sequence_validation/*.csv
          if-no-files-found: warn
