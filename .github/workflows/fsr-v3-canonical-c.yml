name: Event Clock V2 Pace Survival Decomposition

# Trigger refresh: 2026-08-23 all-division pace-survival diagnostic 50 paths
on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"

permissions:
  contents: read
  actions: read

jobs:
  simulate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn statsmodels joblib pyarrow pyyaml

      - name: Download frozen canonical simulation state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Verify frozen state and diagnostic
        run: |
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f data/fsr_v3/fsr_v3_prefight_uncertainty.parquet
          test -f data/models/event_clock_mc_v1/event_clock_frozen_bundle.joblib
          test -f data/models/event_clock_mc_v2/event_clock_v2_fsr_v3_bundle.joblib
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/pace_survival_decomposition.py

      - name: Run all-division pace and survival decomposition
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.pace_survival_decomposition \
            --target-n 100 \
            --paths 50 \
            --seed 20260823 \
            --out-dir data/diagnostics/event_clock_mc_v2/pace_survival_decomposition \
            2>&1 | tee /tmp/pace_survival_decomposition.log

      - name: Print diagnostic headline
        if: always()
        run: |
          if [ -f /tmp/pace_survival_decomposition.log ]; then
            tail -n 260 /tmp/pace_survival_decomposition.log
          fi

      - name: Upload pace survival outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-pace-survival-decomposition
          path: data/diagnostics/event_clock_mc_v2/pace_survival_decomposition/*.csv
          if-no-files-found: warn
