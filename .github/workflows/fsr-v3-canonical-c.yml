name: Event Clock V2 Bantamweight Dog Compression Diagnostic

# Measurement-only decomposition of bantamweight underdog probability inflation.
on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_dog_compression_diagnostic.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scikit-learn joblib pyyaml scipy statsmodels

      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Download completed bantamweight market audit
        uses: actions/download-artifact@v4
        with:
          name: event-clock-v2-bantamweight-market-edge-audit
          path: /tmp/bantamweight_market_edge_audit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32726886999

      - name: Verify diagnostic inputs
        run: |
          test -f /tmp/bantamweight_market_edge_audit/bet_level_audit.csv
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_dog_compression_diagnostic.py

      - name: Run bantamweight dog compression diagnostic
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.bantamweight_dog_compression_diagnostic \
            --bet-audit-path /tmp/bantamweight_market_edge_audit/bet_level_audit.csv \
            --out-dir data/diagnostics/event_clock_mc_v2/bantamweight_dog_compression_diagnostic \
            2>&1 | tee /tmp/bantamweight_dog_compression_diagnostic.log

      - name: Print compression diagnostic
        if: always()
        run: |
          if [ -f /tmp/bantamweight_dog_compression_diagnostic.log ]; then
            cat /tmp/bantamweight_dog_compression_diagnostic.log
          fi

      - name: Upload compression diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-bantamweight-dog-compression-diagnostic
          path: data/diagnostics/event_clock_mc_v2/bantamweight_dog_compression_diagnostic/*.csv
          if-no-files-found: warn
