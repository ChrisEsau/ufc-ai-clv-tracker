name: Event Clock V2 KD Follow-up Clustering Screen

# Research-only men's screen of post-KD temporal strike clustering.
on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/kd_followup_clustering_screen.py"

permissions:
  contents: read
  actions: read

jobs:
  simulate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy statsmodels pyarrow pyyaml scikit-learn joblib

      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Verify frozen inputs and research diagnostic
        run: |
          test -f data/fight_details/ufc_round_stats.parquet
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f data/fsr_v3/fsr_v3_prefight_uncertainty.parquet
          test -f data/models/event_clock_mc_v1/event_clock_frozen_bundle.joblib
          test -f data/models/event_clock_mc_v2/event_clock_v2_fsr_v3_bundle.joblib
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/kd_followup_clustering_screen.py

      - name: Run KD follow-up clustering screen
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.kd_followup_clustering_screen \
            --target-n 100 \
            --sim-n-per-division 20 \
            --paths 10 \
            --seed 20260823 \
            --out-dir data/diagnostics/event_clock_mc_v2/kd_followup_clustering_screen \
            2>&1 | tee /tmp/kd_followup_clustering_screen.log

      - name: Print screen results
        if: always()
        run: |
          if [ -f /tmp/kd_followup_clustering_screen.log ]; then
            tail -n 320 /tmp/kd_followup_clustering_screen.log
          fi

      - name: Upload KD follow-up clustering outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-kd-followup-clustering-screen
          path: data/diagnostics/event_clock_mc_v2/kd_followup_clustering_screen/*.csv
          if-no-files-found: warn
