name: Event Clock V2 Bantamweight Standing Offense Evidence Trace

on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_standing_offense_evidence_trace.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scipy scikit-learn joblib pyyaml
      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Verify evidence trace inputs
        run: |
          test -f data/master/ufc_master.parquet
          test -f data/market/historical_market_outcomes.parquet
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f data/fight_details/ufc_round_stats.parquet
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_standing_offense_evidence_trace.py
      - name: Run standing offense evidence trace
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.bantamweight_standing_offense_evidence_trace \
            2>&1 | tee /tmp/bantamweight_standing_offense_trace.log
      - name: Print standing offense evidence trace
        if: always()
        run: cat /tmp/bantamweight_standing_offense_trace.log || true
      - name: Upload standing offense evidence trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-bantamweight-standing-offense-evidence-trace
          path: data/diagnostics/event_clock_mc_v2/bantamweight_standing_offense_evidence_trace/*.csv
          if-no-files-found: warn
