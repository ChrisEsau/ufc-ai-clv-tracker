name: Event Clock V2 FSR Market Residual Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/fsr_market_residual_audit.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scikit-learn

      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Verify residual-audit inputs
        run: |
          test -f data/master/ufc_master.parquet
          test -f data/market/historical_market_outcomes.parquet
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/fsr_market_residual_audit.py

      - name: Run chronological FSR market residual audit
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.fsr_market_residual_audit \
            --out-dir data/diagnostics/event_clock_mc_v2/fsr_market_residual_audit \
            2>&1 | tee /tmp/fsr_market_residual_audit.log

      - name: Print residual audit
        if: always()
        run: |
          if [ -f /tmp/fsr_market_residual_audit.log ]; then
            cat /tmp/fsr_market_residual_audit.log
          fi

      - name: Upload residual outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-fsr-market-residual-audit
          path: data/diagnostics/event_clock_mc_v2/fsr_market_residual_audit/*.csv
          if-no-files-found: warn
