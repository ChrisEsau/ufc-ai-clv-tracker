name: Event Clock V2 Shared Power Decay Grid

# Research-only men's R1-R3 effective-power curve calibration.
on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"

permissions:
  contents: read
  actions: read

jobs:
  simulate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy statsmodels pyarrow pyyaml scikit-learn joblib

      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Verify frozen inputs and research diagnostic
        run: |
          test -f data/fight_details/ufc_round_stats.parquet
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f data/fsr_v3/fsr_v3_prefight_uncertainty.parquet
          test -f data/models/event_clock_mc_v1/event_clock_frozen_bundle.joblib
          test -f data/models/event_clock_mc_v2/event_clock_v2_fsr_v3_bundle.joblib
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/shared_power_decay_grid.py

      - name: Run men's shared power decay grid
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.shared_power_decay_grid \
            --target-n 100 \
            --coarse-paths 8 \
            --validation-paths 25 \
            --top-k 3 \
            --seed 20260823 \
            --out-dir data/diagnostics/event_clock_mc_v2/shared_power_decay_grid \
            2>&1 | tee /tmp/shared_power_decay_grid.log

      - name: Print grid results
        if: always()
        run: |
          if [ -f /tmp/shared_power_decay_grid.log ]; then
            tail -n 360 /tmp/shared_power_decay_grid.log
          fi

      - name: Upload shared power decay outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-shared-power-decay-grid
          path: data/diagnostics/event_clock_mc_v2/shared_power_decay_grid/*.csv
          if-no-files-found: warn
