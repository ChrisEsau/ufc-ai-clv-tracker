name: Event Clock V2 Bantamweight Budget Variance Decomposition

on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_budget_variance_decomposition.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scikit-learn joblib

      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Verify variance-decomposition inputs
        run: |
          test -f data/master/ufc_master.parquet
          test -f data/market/historical_market_outcomes.parquet
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_budget_variance_decomposition.py

      - name: Run budget variance decomposition
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.bantamweight_budget_variance_decomposition \
            --paths 100 \
            --mean-draws 512 \
            --out-dir data/diagnostics/event_clock_mc_v2/bantamweight_budget_variance_decomposition \
            2>&1 | tee /tmp/bantamweight_budget_variance_decomposition.log

      - name: Print variance decomposition
        if: always()
        run: |
          if [ -f /tmp/bantamweight_budget_variance_decomposition.log ]; then
            cat /tmp/bantamweight_budget_variance_decomposition.log
          fi

      - name: Upload variance outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-bantamweight-budget-variance-decomposition
          path: data/diagnostics/event_clock_mc_v2/bantamweight_budget_variance_decomposition/*.csv
          if-no-files-found: warn
