name: Event Clock V2 Dynamic Fighter Policy Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/dynamic_fighter_policy_prototype.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scipy scikit-learn joblib pyyaml
      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Download frozen bantamweight market audit
        uses: actions/download-artifact@v4
        with:
          name: event-clock-v2-bantamweight-market-edge-audit
          path: /tmp/market_edge
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32726886999
      - name: Verify dynamic policy inputs
        run: |
          test -f data/master/ufc_master.parquet
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f /tmp/market_edge/bet_level_audit.csv
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/dynamic_fighter_policy_prototype.py
          mkdir -p data/diagnostics/event_clock_mc_v2/dynamic_fighter_policy_prototype
      - name: Run dynamic fighter policy prototype
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.dynamic_fighter_policy_prototype \
            2>&1 | tee /tmp/dynamic_fighter_policy_prototype.log
      - name: Print dynamic fighter policy prototype
        if: always()
        run: cat /tmp/dynamic_fighter_policy_prototype.log || true
      - name: Upload dynamic fighter policy prototype
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-dynamic-fighter-policy-prototype
          path: data/diagnostics/event_clock_mc_v2/dynamic_fighter_policy_prototype/*.csv
          if-no-files-found: warn
