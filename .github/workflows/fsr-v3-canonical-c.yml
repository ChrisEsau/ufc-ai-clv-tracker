name: Event Clock V2 Bantamweight Population FSR Market Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_fsr_population_inverse_market_audit.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scikit-learn joblib pyyaml
      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Verify population audit inputs
        run: |
          test -f data/master/ufc_master.parquet
          test -f data/market/historical_market_outcomes.parquet
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          test -f data/fight_details/ufc_round_stats.parquet
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_fsr_population_inverse_market_audit.py
      - name: Run population FSR + market audit
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.bantamweight_fsr_population_inverse_market_audit \
            --current-paths 100 \
            --actual-paths 200 \
            2>&1 | tee /tmp/bantamweight_population_audit.log
      - name: Print population audit
        if: always()
        run: cat /tmp/bantamweight_population_audit.log || true
      - name: Upload population audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-bantamweight-fsr-population-market-audit
          path: data/diagnostics/event_clock_mc_v2/bantamweight_fsr_population_inverse_market_audit/*.csv
          if-no-files-found: warn
