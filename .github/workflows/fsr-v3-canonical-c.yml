name: Event Clock V2 Bantamweight Outcome Path Sensitivity

# Research-only counterfactual attribution of favorite-vs-dog probability compression.
on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"
      - "pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_outcome_path_sensitivity.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn

      - name: Download completed matchup decomposition
        uses: actions/download-artifact@v4
        with:
          name: event-clock-v2-bantamweight-matchup-sensitivity-decomposition
          path: /tmp/bantamweight_matchup_sensitivity_decomposition
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32730372808

      - name: Verify sensitivity inputs
        run: |
          test -f /tmp/bantamweight_matchup_sensitivity_decomposition/fight_level_stage_decomposition.csv
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/bantamweight_outcome_path_sensitivity.py

      - name: Run outcome-path causal sensitivity
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.bantamweight_outcome_path_sensitivity \
            --decomposition-path /tmp/bantamweight_matchup_sensitivity_decomposition/fight_level_stage_decomposition.csv \
            --out-dir data/diagnostics/event_clock_mc_v2/bantamweight_outcome_path_sensitivity \
            2>&1 | tee /tmp/bantamweight_outcome_path_sensitivity.log

      - name: Print sensitivity results
        if: always()
        run: |
          if [ -f /tmp/bantamweight_outcome_path_sensitivity.log ]; then
            cat /tmp/bantamweight_outcome_path_sensitivity.log
          fi

      - name: Upload sensitivity outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-clock-v2-bantamweight-outcome-path-sensitivity
          path: data/diagnostics/event_clock_mc_v2/bantamweight_outcome_path_sensitivity/*.csv
          if-no-files-found: warn
