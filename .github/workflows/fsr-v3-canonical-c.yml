name: Historical Stamina Lethality Interaction

# Trigger refresh: 2026-08-23 historical stamina x round lethality study
on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - ".github/workflows/fsr-v3-canonical-c.yml"

permissions:
  contents: read
  actions: read

jobs:
  analyze-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy statsmodels pyarrow pyyaml scikit-learn joblib

      - name: Download frozen canonical research state
        uses: actions/download-artifact@v4
        with:
          name: canonical-weight-class-state
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979

      - name: Verify historical inputs and diagnostic
        run: |
          test -f data/fight_details/ufc_round_stats.parquet
          test -f data/fsr_v3/fsr_v3_prefight_snapshots.parquet
          python -m py_compile pipeline/simulation/event_clock_mc_v2/diagnostics/stamina_lethality_interaction.py

      - name: Run historical stamina x round lethality interaction
        run: |
          set -o pipefail
          python -m pipeline.simulation.event_clock_mc_v2.diagnostics.stamina_lethality_interaction \
            --target-n 100 \
            --out-dir data/diagnostics/event_clock_mc_v2/stamina_lethality_interaction \
            2>&1 | tee /tmp/stamina_lethality_interaction.log

      - name: Print interaction results
        if: always()
        run: |
          if [ -f /tmp/stamina_lethality_interaction.log ]; then
            tail -n 320 /tmp/stamina_lethality_interaction.log
          fi

      - name: Upload stamina interaction outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-stamina-lethality-interaction
          path: data/diagnostics/event_clock_mc_v2/stamina_lethality_interaction/*.csv
          if-no-files-found: warn
