name: Standard Fighter V1 Synthetic Scenarios

on:
  workflow_dispatch:
  push:
    branches:
      - research/weight-class-audit-20260823
    paths:
      - pipeline/simulation/event_clock_mc_v2/standard_fighter_v1/**
      - pipeline/simulation/event_clock_mc_v2/STANDARD_FIGHTER_V1_DESIGN.md
      - .github/workflows/standard-fighter-v1-scenarios.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install -q numpy pandas scipy scikit-learn statsmodels joblib pyarrow pyyaml
      - name: Restore canonical FSR V3 state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data /tmp/canonical-weight-class-state
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9494902022/zip > /tmp/canonical-weight-class-state.zip
          unzip -q /tmp/canonical-weight-class-state.zip -d data
          test -f data/fsr_v3/fsr_v3_latest.parquet
          test -f data/models/event_clock_mc_v2/event_clock_v2_fsr_v3_bundle.joblib
      - name: Compile prototype
        run: |
          python -m py_compile pipeline/simulation/event_clock_mc_v2/standard_fighter_v1/policy.py
          python -m py_compile pipeline/simulation/event_clock_mc_v2/standard_fighter_v1/capability_translation.py
          python -m py_compile pipeline/simulation/event_clock_mc_v2/standard_fighter_v1/scenario_validation.py
          python -m py_compile pipeline/simulation/event_clock_mc_v2/standard_fighter_v1/magnitude_audit.py
          python -m py_compile pipeline/simulation/event_clock_mc_v2/standard_fighter_v1/real_fsr_audit.py
          python -m py_compile pipeline/simulation/event_clock_mc_v2/standard_fighter_v1/shadow_single_path_trace.py
      - name: Run synthetic scenario validation
        run: python -m pipeline.simulation.event_clock_mc_v2.standard_fighter_v1.scenario_validation
      - name: Run magnitude audit
        run: python -m pipeline.simulation.event_clock_mc_v2.standard_fighter_v1.magnitude_audit
      - name: Run real FSR V3 capability audit
        run: python -m pipeline.simulation.event_clock_mc_v2.standard_fighter_v1.real_fsr_audit
      - name: Run Rakic vs Tybura single-path shadow trace
        run: python -m pipeline.simulation.event_clock_mc_v2.standard_fighter_v1.shadow_single_path_trace --fight-id eb8753ed0476b3d1 --seed 20260824
