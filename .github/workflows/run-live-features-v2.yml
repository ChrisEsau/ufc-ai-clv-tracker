name: Run Live Features V2

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model ID"
        required: false
        default: "moneyline_xgboost_v5"

permissions:
  contents: write

concurrency:
  group: live-features-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-live-features-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml scikit-learn==1.6.1 xgboost

      - name: Run Live Features V2
        run: |
          python -m pipeline.prediction.run_live_features --model-id "${{ inputs.model_id }}"

      - name: Commit live feature outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            data/predictions/live_model_features.parquet \
            data/audits/ufc_live_feature_audit.parquet

          git commit -m "Update live feature artifacts" || echo "No changes to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
