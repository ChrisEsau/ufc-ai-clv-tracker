name: LOCKED Brain MC Kape Horiguchi TD Audit

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - pipeline/research/locked_brain_mc_allen_shahbazyan.py
      - .github/workflows/locked-brain-mc-allen-shahbazyan.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runner dependencies
        run: python -m pip install numpy pandas pyarrow scipy scikit-learn pyyaml joblib
      - name: Restore canonical FSR V3 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Run locked Kape Horiguchi with TD-channel observer
        run: |
          set -euo pipefail
          cp -a restored/canonical-weight-class-state/. data/
          python - <<'PY' | tee locked-brain-mc-kape-horiguchi.txt
          from pathlib import Path
          import pandas as pd
          from pipeline.research import locked_brain_mc_allen_shahbazyan as harness
          from pipeline.simulation.event_clock_mc_v2.causal.events import ActionFamily
          from pipeline.simulation.event_clock_mc_v2.causal.state import Side

          event_date = pd.Timestamp('2026-06-20')
          fighter_a = 'Manel Kape'
          fighter_b = 'Kyoji Horiguchi'
          master = pd.read_parquet('data/master/ufc_master.parquet').copy()
          master['date'] = pd.to_datetime(master['date']).dt.normalize()
          same_day = master.loc[master['date'].eq(event_date)].copy()
          mask = (
              (same_day['r_name'].astype(str).eq(fighter_a) & same_day['b_name'].astype(str).eq(fighter_b))
              | (same_day['r_name'].astype(str).eq(fighter_b) & same_day['b_name'].astype(str).eq(fighter_a))
          )
          rows = same_day.loc[mask]
          if len(rows) != 1:
              raise RuntimeError(f'expected one Kape-Horiguchi fight row, found {len(rows)}')
          fight_id = str(rows.iloc[0]['fight_id'])
          print('LOCKED_TARGET_OVERRIDE', {
              'fight_id': fight_id,
              'event_date': str(event_date.date()),
              'fighters': [fighter_a, fighter_b],
              'mechanics_changed': False,
              'instrumentation_only': True,
          })

          harness.validated_kd.base_trace.FIGHT_ID = fight_id
          harness.time_ko.base_trace.FIGHT_ID = fight_id
          harness.scored.base_trace.FIGHT_ID = fight_id
          harness.timing.base_trace.FIGHT_ID = fight_id
          harness.timing.target.FIGHT_ID = fight_id

          original_round_stats = harness.scored.round_absolute_stats
          td_rows = []
          last_out = [None]

          fight, _, _, _, _ = harness.scored.pressure_mod.build_setup()
          names = {Side.RED: str(fight.r_name), Side.BLUE: str(fight.b_name)}

          def observed_round_stats(out, round_number, round_length=300.0):
              result = original_round_stats(out, round_number, round_length)
              # scored.main calls this sequentially for rounds 1..N of each path.
              # Keep the previous object itself alive and compare identity, avoiding
              # Python id() reuse after garbage collection.
              if out is not last_out[0]:
                  last_out[0] = out
                  row = {
                      'observed_decision_path_index': len(td_rows),
                      'decision_winner': names[out.termination.winner],
                      'fight_seconds': float(out.reported_through_seconds),
                  }
                  for side in (Side.RED, Side.BLUE):
                      prefix = 'kape' if names[side] == fighter_a else 'horiguchi'
                      direct_attempts = direct_completions = 0
                      clinch_attempts = clinch_completions = 0
                      for event in out.events:
                          if event.actor is not side:
                              continue
                          if event.selected_action is ActionFamily.TAKEDOWN_ENTRY:
                              direct_attempts += 1
                              direct_completions += int(event.transition_kind is not None)
                          elif event.selected_action is ActionFamily.CLINCH_TAKEDOWN:
                              clinch_attempts += 1
                              clinch_completions += int(event.transition_kind is not None)
                      ctrl = sum(float(seg.duration) for seg in out.timeline_segments if seg.controller is side)
                      row[f'{prefix}_direct_td_attempts'] = direct_attempts
                      row[f'{prefix}_direct_td_completions'] = direct_completions
                      row[f'{prefix}_clinch_td_attempts'] = clinch_attempts
                      row[f'{prefix}_clinch_td_completions'] = clinch_completions
                      row[f'{prefix}_total_td_attempts'] = direct_attempts + clinch_attempts
                      row[f'{prefix}_total_td_completions'] = direct_completions + clinch_completions
                      row[f'{prefix}_control_seconds'] = ctrl
                  td_rows.append(row)
              return result

          harness.scored.round_absolute_stats = observed_round_stats
          try:
              harness.main()
          finally:
              harness.scored.round_absolute_stats = original_round_stats

          outdir = Path('data/research/locked_brain_mc_allen_shahbazyan')
          detail = pd.DataFrame(td_rows)
          required = [
              'kape_direct_td_attempts', 'kape_clinch_td_attempts',
              'horiguchi_direct_td_attempts', 'horiguchi_clinch_td_attempts'
          ]
          missing = [c for c in required if c not in detail.columns]
          if missing:
              raise RuntimeError(f'TD observer produced no usable rows; missing={missing}, rows={len(detail)}')
          detail.to_csv(outdir / 'td_channel_decision_paths.csv', index=False)

          summary_rows = []
          for winner, g in detail.groupby('decision_winner'):
              r = {'decision_winner': winner, 'paths': int(len(g))}
              for fighter in ('kape', 'horiguchi'):
                  for metric in (
                      'direct_td_attempts', 'direct_td_completions',
                      'clinch_td_attempts', 'clinch_td_completions',
                      'total_td_attempts', 'total_td_completions', 'control_seconds'
                  ):
                      r[f'mean_{fighter}_{metric}'] = float(g[f'{fighter}_{metric}'].mean())
              summary_rows.append(r)
          summary = pd.DataFrame(summary_rows)
          summary.to_csv(outdir / 'td_channel_summary.csv', index=False)
          print('TD_CHANNEL_SUMMARY')
          print(summary.to_string(index=False))
          PY
      - name: Upload locked outputs
        uses: actions/upload-artifact@v4
        with:
          name: locked-brain-mc-kape-horiguchi-td-audit-${{ github.run_id }}
          path: |
            locked-brain-mc-kape-horiguchi.txt
            data/research/locked_brain_mc_allen_shahbazyan/
