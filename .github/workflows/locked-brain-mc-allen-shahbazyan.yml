name: LOCKED Brain MC Runner

on:
  push:
    branches:
      - research/ko-system-v3-from-scratch-20260826
    paths:
      - pipeline/research/locked_brain_mc_allen_shahbazyan.py
      - .github/workflows/locked-brain-mc-allen-shahbazyan.yml
  workflow_dispatch:
    inputs:
      paths:
        description: Number of locked Brain paths
        required: false
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    env:
      RUN_PATHS: ${{ inputs.paths || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runner dependencies
        run: python -m pip install numpy pandas pyarrow scipy scikit-learn pyyaml joblib
      - name: Restore canonical FSR V3 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9494902022
          path: restored
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ChrisEsau/ufc-ai-clv-tracker
          run-id: 32645607979
      - name: Run locked Brain harness
        run: |
          set -euo pipefail
          cp -a restored/canonical-weight-class-state/. data/
          python -m pipeline.research.locked_brain_mc_allen_shahbazyan --paths "$RUN_PATHS" | tee locked-brain-mc.txt
      - name: Upload locked outputs
        uses: actions/upload-artifact@v4
        with:
          name: locked-brain-mc-${{ github.run_id }}-paths-${{ env.RUN_PATHS }}
          path: |
            locked-brain-mc.txt
            data/research/locked_brain_mc_allen_shahbazyan/
