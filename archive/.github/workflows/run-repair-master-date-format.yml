name: Run Repair Master Date Format

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-repair-master-date-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy

      - name: Run master date repair
        run: |
          python run_repair_master_date_format.py

      - name: Commit repaired master parquet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add ufc_master.parquet
          git add ufc_master_backup_before_date_repair_*.parquet

          git commit -m "Repair UFC master date formatting" || echo "No changes to commit"

          git push
