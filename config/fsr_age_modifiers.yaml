version: 1
name: fsr_age_modifiers_v1
purpose: >-
  External configuration for fight-night age modifiers applied to immutable stored
  FSR values. The simulator must not contain trait-specific age constants.

rating_bounds:
  min: 10.0
  max: 90.0

defaults:
  age_center: 30.0
  min_adjustment: -40.0
  max_adjustment: 40.0

# Contract:
#   x = age - age_center
#   modifier = intercept + linear*x + quadratic*x^2 + cubic*x^3
#   effective_fsr = clamp(stored_fsr + modifier, rating_bounds.min, rating_bounds.max)
#
# Only entries with BOTH enabled=true and calibrated=true are applied.
# Candidate entries remain visible here but inert until population calibration is approved.
traits:
  distance_striking_precision:
    enabled: false
    calibrated: false
    status: rejected_weak_age_signal

  distance_striking_defense:
    enabled: false
    calibrated: false
    status: retained_secondary_candidate
    model: polynomial

  wrestling_entry:
