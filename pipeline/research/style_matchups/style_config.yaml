# Standalone UFC style-matchup research config.
#
# This config is intentionally research-only. It does not modify production
# fighter-state artifacts, feature views, model configs, workflows, or dashboard
# components.

inputs:
  fighter_state_history_path: data/features/fighter_state_history.parquet

outputs:
  research_dir: data/research/style_matchups
  style_fighter_snapshots_path: data/research/style_matchups/style_fighter_snapshots.parquet

filters:
  min_fights: 3

identity_columns:
  - fighter_id
  - fighter_name
  - fight_id
  - fight_date
  - date
  - event_id
  - event_name
  - corner
  - opponent_id
  - opponent_name
  - division
  - source_row_index

# Pure style features only.
# Intentionally excludes elo, fights, and win_pct because those measure
# fighter quality/experience rather than fighting style.
style_columns:
  # Style V1 baseline features
  - splm
  - sapm
  - str_acc
  - str_def
  - kd_avg
  - td_avg
  - td_acc
  - td_def
  - sub_avg
  - ctrl_per_min
  - ctrl_against_per_min
  - finish_rate
  - finish_loss_rate
  - avg_fight_time

  # Style V2 experimental additions.
  # These are intentionally easy to remove if clustering stability or ROI gets worse.
  - knockdowns_per_min
  - knockdowns_per_fight
  - control_time_pct
  - submission_finish_rate
  - ko_win_pct
  - sub_win_pct
  - decision_win_pct
  - inside_distance_rate
  - avg_fight_minutes

experimental_style_v2_columns:
  - knockdowns_per_min
  - knockdowns_per_fight
  - control_time_pct
  - submission_finish_rate
  - ko_win_pct
  - sub_win_pct
  - decision_win_pct
  - inside_distance_rate
  - avg_fight_minutes

missingness:
  allow_missing_style_columns: true

notes:
  - Pure-style clustering configuration.
  - Excludes quality metrics to prevent good-vs-bad fighter clusters.
  - Style V1 baseline remains the first 14 style_columns.
  - Style V2 experimental additions are duplicated under experimental_style_v2_columns for easy rollback/removal.
  - Use only prefight fighter-state columns to preserve point-in-time safety.
