data:
  rolling_features_path: data/features/moneyline_feature_view.parquet
  target_column: target
  date_column: date
split:
  mode: train_calibration_test
  train_end_date: '2022-12-31'
  calibration_end_date: '2023-12-31'
  train_start_date: '2018-01-01'
symmetry:
  enabled: true
  mode: flip_all
calibration:
  enabled: true
  method: isotonic
params:
  n_estimators: 500
  max_depth: 4
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  eval_metric: logloss
metrics:
  threshold_min: 0.4
  threshold_max: 0.6
  threshold_step: 0.01
  confidence_bucket_edges:
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
  - 1.0
artifacts:
  output_dir: models/moneyline/moneyline_xgboost_v11
  save_raw_model: true
  save_calibrated_model: true
  save_feature_columns: true
  save_metrics: true
  save_threshold_sweep: true
  save_confidence_buckets: true
  save_model_card: true
prediction:
  probability:
    clip_low: 0.02
    clip_high: 0.98
  threshold:
    source: best_sweep
    value: 0.5
  format: binary_matchup
  market_key: moneyline
  prediction_type: binary_matchup
  positive_class: red
  outcomes:
    positive:
      outcome_side: red
      label_source: red_fighter
    negative:
      outcome_side: blue
      label_source: blue_fighter
  output:
    canonical_artifact: model_outcomes
    path: data/predictions/model_outcomes.parquet
    model_scoped_path_template: data/predictions/by_model/{model_id}/model_outcomes.parquet
market:
  source: the_odds_api
  sport: mma_mixed_martial_arts
  regions:
  - us
  bookmakers:
  - draftkings
  markets:
  - h2h
market_key: moneyline
status: draft
