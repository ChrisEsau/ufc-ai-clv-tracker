model_id: prop_goes_distance_xgboost_v1
model_family: prop
market_key: goes_distance
artifact_name: prop_goes_distance_xgboost_v1
version: 1
status: production
algorithm: xgboost
feature_sources:
- prop_goes_distance_feature_view
features:
  selection_mode: explicit
  expected_feature_count: 11
  allow_unsafe_features: false
  feature_columns:
  - combined_avg_fight_time
  - combined_ewm_avg_fight_time
  - combined_ewm_finish_loss_rate
  - combined_ewm_finish_pressure
  - combined_ewm_finish_rate
  - combined_finish_loss_rate
  - combined_finish_pressure
  - combined_finish_rate
  - height_mismatch_abs
  - older_fighter_age
  - reach_mismatch_abs
  selected_bundles:
  - goes_distance_core_v1
  include_features: []
  exclude_features: []
data:
  rolling_features_path: data/features/prop_goes_distance_feature_view.parquet
  target_column: target_goes_distance
  date_column: date
split:
  mode: train_calibration_test
  train_end_date: '2022-12-31'
  calibration_end_date: '2023-12-31'
symmetry:
  enabled: false
  mode: none
calibration:
  enabled: true
  method: isotonic
params:
  n_estimators: 500
  max_depth: 4
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  eval_metric: logloss
metrics:
  threshold_min: 0.3
  threshold_max: 0.7
  threshold_step: 0.01
  confidence_bucket_edges:
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
  - 1.0
artifacts:
  output_dir: models/goes_distance/prop_goes_distance_xgboost_v1
  save_raw_model: true
  save_calibrated_model: true
  save_feature_columns: true
  save_metrics: true
  save_threshold_sweep: true
  save_confidence_buckets: true
  save_model_card: true
prediction:
  format: binary_prop
  market_key: goes_distance
  prediction_type: binary_prop
  positive_class: goes_distance
  negative_class: inside_distance
  outcomes:
    positive:
      label: goes_distance
      outcome_side: positive
      outcome_fighter_id: null
    negative:
      label: inside_distance
      outcome_side: negative
      outcome_fighter_id: null
  probability:
    clip_low: 0.02
    clip_high: 0.98
  threshold:
    source: best_sweep
    value: 0.5
notes:
- First prop-market training config.
- Feature list is intentionally compact and should be reviewed after initial backtest
  metrics.
- Symmetry is disabled because this is a fight-level target, not a side-level target.
- total_rounds and title_fight are fight-context features and must come from the live
  card at prediction time.
- Prediction format uses the existing binary_prop adapter/formatter contract.
