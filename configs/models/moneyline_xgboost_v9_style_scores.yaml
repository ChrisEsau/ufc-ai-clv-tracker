model_id: moneyline_xgboost_v9_style_scores
model_family: moneyline
market_key: moneyline
artifact_name: moneyline_xgboost_v9_style_scores
algorithm: xgboost
feature_sources:
  - moneyline_feature_view
features:
  selection_mode: explicit
  expected_feature_count: 19
  allow_unsafe_features: false
  feature_columns:
    - style_control_wrestler_score_diff
    - style_ko_finisher_score_diff
    - style_submission_grappler_score_diff
    - style_decision_technician_score_diff
    - style_all_round_finisher_score_diff
    - style_control_wrestler_score_abs_diff
    - style_ko_finisher_score_abs_diff
    - style_submission_grappler_score_abs_diff
    - style_decision_technician_score_abs_diff
    - style_all_round_finisher_score_abs_diff
    - style_edge_ko_finisher_vs_decision_technician
    - style_edge_ko_finisher_vs_decision_technician_reverse
    - style_edge_ko_finisher_vs_decision_technician_net
    - style_edge_decision_technician_vs_submission_grappler
    - style_edge_decision_technician_vs_submission_grappler_reverse
    - style_edge_decision_technician_vs_submission_grappler_net
    - style_edge_control_wrestler_vs_ko_finisher
    - style_edge_control_wrestler_vs_ko_finisher_reverse
    - style_edge_control_wrestler_vs_ko_finisher_net
  selected_bundles:
    - style_scores_v1
  include_features: []
  exclude_features: []
data:
  rolling_features_path: data/features/moneyline_feature_view.parquet
  target_column: target
  date_column: date
split:
  mode: train_calibration_test
  train_start_date: '2018-01-01'
  train_end_date: '2022-12-31'
  calibration_end_date: '2023-12-31'
symmetry:
  enabled: true
  mode: flip_all
calibration:
  enabled: true
  method: isotonic
params:
  n_estimators: 500
  max_depth: 4
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  eval_metric: logloss
metrics:
  threshold_min: 0.4
  threshold_max: 0.6
  threshold_step: 0.01
artifacts:
  output_dir: models/moneyline/moneyline_xgboost_v9_style_scores
  save_raw_model: true
  save_calibrated_model: true
  save_feature_columns: true
  save_metrics: true
  save_threshold_sweep: true
  save_confidence_buckets: true
  save_model_card: true
prediction:
  probability:
    clip_low: 0.02
    clip_high: 0.98
  threshold:
    source: best_sweep
    value: 0.5
  format: binary_matchup
  market_key: moneyline
  prediction_type: binary_matchup
  positive_class: red
  output:
    canonical_artifact: model_outcomes
    path: data/predictions/model_outcomes.parquet
    model_scoped_path_template: data/predictions/by_model/{model_id}/model_outcomes.parquet
market:
  source: the_odds_api
  sport: mma_mixed_martial_arts
  regions:
    - us
  bookmakers:
    - draftkings
  markets:
    - h2h
status: draft
