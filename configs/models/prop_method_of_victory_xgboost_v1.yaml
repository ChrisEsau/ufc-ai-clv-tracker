data:
  rolling_features_path: data/features/prop_method_of_victory_feature_view.parquet
  target_column: target_method_class
  date_column: date
split:
  mode: train_calibration_test
  train_start_date: '2014-01-01'
  train_end_date: '2022-12-31'
  calibration_end_date: '2023-12-31'
symmetry:
  enabled: false
  mode: none
calibration:
  enabled: false
  reason: multiclass calibration not supported yet
  method: isotonic
params:
  n_estimators: 500
  max_depth: 4
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  eval_metric: mlogloss
metrics:
  primary_metric: log_loss
artifacts:
  output_dir: models/method_of_victory/prop_method_of_victory_xgboost_v1
  save_raw_model: true
  save_calibrated_model: false
  save_feature_columns: true
  save_metrics: true
  save_threshold_sweep: false
  save_confidence_buckets: false
  save_shap_importance: true
  save_model_card: true
prediction:
  probability:
    clip_low: 0.01
    clip_high: 0.99
  threshold:
    source: fixed
    value: 0.5
  format: multiclass
  market_key: exact_method
  prediction_type: multiclass_prop
  class_labels:
  - ko_tko
  - submission
  - decision
  output:
    model_scoped_path_template: data/predictions/by_model/{model_id}/model_outcomes.parquet
notes:
- Draft fight-level multiclass method model.
- Class probabilities sum to 100 percent across ko_tko, submission, and decision.
- Prediction output is mapped to the sportsbook-compatible exact_method market.
- This powers fight-level exact-method props and can derive goes-distance/inside-distance probabilities.
- This does not yet model fighter-specific method-of-victory markets.
