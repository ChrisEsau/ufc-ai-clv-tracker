# Rolling Feature Preservation Contract
#
# Purpose:
#   Prevent feature loss during notebook-to-Python conversion and feature-layer refactoring.
#
# Scope:
#   Applies to the complete rolling feature dataset generated by:
#
#       UFC_rolling_dataset_V4_refactored.ipynb
#
# Observed notebook output:
#   483 columns
#
# This contract protects ALL current rolling database columns, not only the
# 124 moneyline model inputs.

contract_name: rolling_feature_preservation_contract
source_notebook: UFC_rolling_dataset_V4_refactored.ipynb

protected_dataset:
  expected_column_count: 483
  protection_level: full_schema_preservation

preservation_rule:
  description: >
    Every existing rolling feature column must be preserved, mapped,
    or explicitly deprecated. No column may silently disappear during
    refactoring.

allowed_mappings:
  - base
  - moneyline
  - props
  - metadata
  - target_result
  - deprecated_but_preserved

required_column_families:

  metadata:
    examples:
      - fight_id
      - event_name
      - date
      - fighter identifiers
      - division
      - location

  targets:
    examples:
      - target
      - winner
      - winner_id

  red_prefight_features:
    patterns:
      - r_pre_*

  blue_prefight_features:
    patterns:
      - b_pre_*

  differential_features:
    patterns:
      - '*_diff'

  ewm_features:
    patterns:
      - ewm_*

  recent_form_features:
    patterns:
      - recent_*
      - recent_form_*

  engineered_features:
    source: engineered_feature_registry

migration_requirements:
  - export_full_column_list_before_refactor
  - generate_feature_mapping_table
  - classify_every_column_into_a_feature_layer
  - validate_column_count_after_split
  - verify_current_moneyline_v5_contract_remains_intact

future_validation:
  required_artifact:
    configs/features/full_rolling_feature_inventory.yaml

  description: >
    Before splitting the rolling dataset into base, moneyline, and prop
    layers, automatically export the complete rolling schema and store it
    in a dedicated inventory file.

    That inventory becomes the permanent schema reference.

locked_rules:
  - no_current_rolling_column_may_be_removed_without_explicit_approval
  - no_current_v5_training_feature_may_be_removed_without_explicit_approval
  - feature_splits_must_be_lossless
  - schema_inventory_must_be_generated_before_large_scale_refactor

status:
  current_state: protected
  schema_inventory_generated: false
  refactor_ready_after_inventory_generation: true
