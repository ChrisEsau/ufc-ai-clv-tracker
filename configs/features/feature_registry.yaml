# UFC Master Feature Registry
#
# Purpose:
#   Defines ownership and usage for feature families in the UFC model pipeline.
#
# This registry is intentionally family-based rather than manually duplicating
# all 483 generated columns from full_rolling_feature_inventory.yaml.
#
# Source inventory:
#   configs/features/full_rolling_feature_inventory.yaml
#
# Protected contracts:
#   configs/features/current_moneyline_v5_features.yaml
#   configs/features/rolling_feature_preservation_contract.yaml

registry_name: ufc_master_feature_registry
version: 1
status: initial_family_registry

source_files:
  full_inventory: configs/features/full_rolling_feature_inventory.yaml
  moneyline_v5_contract: configs/features/current_moneyline_v5_features.yaml
  rolling_preservation_contract: configs/features/rolling_feature_preservation_contract.yaml

schema_contracts:
  rolling_feature_store:
    artifact: data/features/UFC_enhanced_rolling_features_EWM.parquet
    expected_columns: 483
    preservation_rule: all_columns_preserved_or_explicitly_deprecated

  current_moneyline_v5:
    expected_features: 124
    selection_rule: all_columns_ending_in_diff_plus_registered_engineered_features
    protected: true

feature_layers:

  metadata:
    description: Non-model identifiers, event context, fight context, and join keys.
    model_input_allowed: false
    preservation_status: protected
    examples:
      - event_id
      - event_name
      - date
      - location
      - fight_id
      - division
      - title_fight
      - method
      - finish_round
      - match_time_sec
      - total_rounds
      - referee
    used_by:
      - training_joins
      - backtesting_joins
      - live_prediction_joins
      - dashboard
      - audits

  target_result:
    description: Historical outcome labels and result fields. These are allowed for training/backtesting labels but never live model inputs.
    model_input_allowed: false
    preservation_status: protected
    examples:
      - target
      - winner
      - winner_id
      - method
      - finish_round
      - match_time_sec
    used_by:
      - moneyline_training_labels
      - moneyline_backtesting_results
      - prop_label_generation
      - model_evaluation

  base:
    description: Reusable point-in-time fighter and fight state. This is the foundation for moneyline and prop feature views.
    model_input_allowed: conditionally_via_market_views
    preservation_status: protected
    future_artifact: data/features/ufc_base_features.parquet
    used_by:
      - moneyline_features
      - prop_features
      - live_prediction
      - model_lab

  moneyline:
    description: Symmetry-safe winner-prediction features for current and future moneyline models.
    model_input_allowed: true
    preservation_status: protected
    future_artifact: data/features/ufc_moneyline_features.parquet
    current_v5_expected_feature_count: 124
    used_by:
      - moneyline_training
      - moneyline_backtesting
      - live_moneyline_prediction
      - betting_board

  props:
    description: Future market-specific prop features and prop labels.
    model_input_allowed: true
    preservation_status: future_expansion
    future_artifact: data/features/ufc_prop_features.parquet
    used_by:
      - prop_training
      - prop_backtesting
      - live_prop_prediction
      - prop_betting_board

  deprecated_but_preserved:
    description: Columns retained for compatibility/history but not recommended for new models.
    model_input_allowed: false
    preservation_status: preserved_until_explicit_removal_approval
    used_by:
      - compatibility
      - audits

feature_families:

  event_and_fight_metadata:
    layer: metadata
    model_input_allowed: false
    ownership: pipeline.common / data_maintenance
    examples:
      - event_id
      - event_name
      - date
      - location
      - fight_id
      - division
      - title_fight
      - total_rounds
      - referee
    notes:
      - Used for joins, reporting, filtering, and audit context.
      - Not a direct model input.

  fighter_identifiers:
    layer: metadata
    model_input_allowed: false
    ownership: data_maintenance / entity_resolution
    examples:
      - r_id
      - b_id
      - r_name
      - b_name
    notes:
      - Required for live-card matching and current fighter feature lookup.
      - Not direct model inputs.

  result_fields:
    layer: target_result
    model_input_allowed: false
    ownership: training / backtesting / prop_label_builder
    examples:
      - winner
      - winner_id
      - target
      - method
      - finish_round
      - match_time_sec
    notes:
      - `target` is used for moneyline historical labels.
      - `method`, `finish_round`, and `match_time_sec` are future prop-label inputs.
      - Must not be used as live prediction inputs.

  raw_corner_fight_stats:
    layer: base
    model_input_allowed: false
    ownership: base_feature_store
    patterns:
      - r_*
      - b_*
    examples:
      - r_kd
      - b_kd
      - r_sig_str_landed
      - b_sig_str_landed
      - r_td_landed
      - b_td_landed
    notes:
      - Preserved in the rolling database.
      - Not symmetry-safe for current V5 moneyline training.
      - May feed future base-state reconstruction and prop labels.

  prefight_corner_state:
    layer: base
    model_input_allowed: false
    ownership: pipeline.features.base
    patterns:
      - r_pre_*
      - b_pre_*
    examples:
      - r_pre_elo
      - b_pre_elo
      - r_pre_win_pct
      - b_pre_win_pct
      - r_pre_td_avg
      - b_pre_td_avg
      - r_pre_finish_rate
      - b_pre_finish_rate
    notes:
      - Reusable point-in-time fighter state.
      - Should be used to create market-specific differentials/views.
      - Not directly consumed by current Moneyline V5 due to red/blue asymmetry.

  career_differentials:
    layer: moneyline
    model_input_allowed: true
    ownership: pipeline.features.moneyline
    current_moneyline_v5: included
    patterns:
      - '*_diff'
    examples:
      - elo_diff
      - fights_diff
      - wins_diff
      - losses_diff
      - win_pct_diff
      - kd_avg_diff
      - splm_diff
      - sapm_diff
      - td_avg_diff
      - sub_avg_diff
      - finish_rate_diff
    notes:
      - Core symmetry-safe current moneyline features.
      - Also useful as candidate inputs for prop models when market-appropriate.

  ewm_corner_state:
    layer: base
    model_input_allowed: false
    ownership: pipeline.features.base
    patterns:
      - r_ewm_*
      - b_ewm_*
    examples:
      - r_ewm_elo
      - b_ewm_elo
      - r_ewm_splm
      - b_ewm_splm
    notes:
      - Recent-form state before market-specific transformation.
      - Should remain reusable for moneyline and props.

  ewm_differentials:
    layer: moneyline
    model_input_allowed: true
    ownership: pipeline.features.moneyline
    current_moneyline_v5: included
    patterns:
      - ewm_*_diff
    examples:
      - ewm_elo_diff
      - ewm_win_pct_diff
      - ewm_splm_diff
      - ewm_sapm_diff
      - ewm_td_avg_diff
      - ewm_finish_rate_diff
    notes:
      - Current V5 moneyline feature family.
      - Strong candidate feature family for future prop models.

  recent_form_corner_state:
    layer: base
    model_input_allowed: false
    ownership: pipeline.features.base
    patterns:
      - r_recent_form_*
      - b_recent_form_*
    examples:
      - r_recent_form_win_pct
      - b_recent_form_win_pct
      - r_recent_form_finish_rate
      - b_recent_form_finish_rate
    notes:
      - Reusable recent-form corner state.
      - Should be transformed before model consumption.

  recent_form_differentials:
    layer: moneyline
    model_input_allowed: true
    ownership: pipeline.features.moneyline
    current_moneyline_v5: included
    patterns:
      - recent_form_*_diff
    examples:
      - recent_form_win_pct_diff
      - recent_form_splm_diff
      - recent_form_sapm_diff
      - recent_form_td_avg_diff
      - recent_form_finish_rate_diff
      - recent_form_avg_fight_time_diff
    notes:
      - Current V5 moneyline feature family.
      - Valuable for KO/TKO, submission, decision, and goes-distance models.

  engineered_moneyline_matchup_features:
    layer: moneyline
    model_input_allowed: true
    ownership: pipeline.features.moneyline / feature_engineering
    current_moneyline_v5: included
    features:
      - age_diff
      - height_diff
      - reach_diff
      - weight_diff
      - striking_edge
      - grappling_edge
      - finish_volatility
      - wrestling_pressure_vs_defense
      - reach_striking_combo
      - chin_risk_diff
      - experience_ratio_diff
      - aggression_index_diff
      - age_squared_diff
      - pressure_striking_adv_diff
      - wrestling_mismatch_diff
      - submission_mismatch_diff
    notes:
      - These 16 registered engineered features are explicitly loaded by the current V5 training notebook.
      - Some also end in `_diff`; current notebook de-duplicates.

prop_candidate_families:

  ko_tko:
    future_layer: props
    recommended_model_bundle: models/props/UFC_PROP_KO_TKO_V1
    candidate_sources:
      - kd_avg_diff
      - kd_absorbed_avg_diff
      - splm_diff
      - sapm_diff
      - str_acc_diff
      - str_def_diff
      - ko_rate_diff
      - finish_rate_diff
      - finish_loss_rate_diff
      - chin_risk_diff
      - pressure_striking_adv_diff
      - recent_form_splm_diff
      - recent_form_sapm_diff
      - recent_form_finish_rate_diff
    label_sources:
      - method
      - winner_id

  submission:
    future_layer: props
    recommended_model_bundle: models/props/UFC_PROP_SUB_V1
    candidate_sources:
      - sub_avg_diff
      - sub_win_rate_diff
      - td_avg_diff
      - td_acc_diff
      - td_def_diff
      - ctrl_per_min_diff
      - ctrl_against_per_min_diff
      - grappling_edge
      - wrestling_mismatch_diff
      - submission_mismatch_diff
      - recent_form_td_avg_diff
    label_sources:
      - method
      - winner_id

  decision:
    future_layer: props
    recommended_model_bundle: models/props/UFC_PROP_DEC_V1
    candidate_sources:
      - decision_win_rate_diff
      - decision_loss_rate_diff
      - avg_fight_time_diff
      - finish_rate_diff
      - finish_loss_rate_diff
      - experience_ratio_diff
      - recent_form_avg_fight_time_diff
      - recent_form_finish_rate_diff
    label_sources:
      - method
      - winner_id
      - match_time_sec
      - total_rounds

  goes_distance:
    future_layer: props
    recommended_model_bundle: models/props/UFC_PROP_GOES_DISTANCE_V1
    candidate_sources:
      - avg_fight_time_diff
      - finish_rate_diff
      - finish_loss_rate_diff
      - decision_win_rate_diff
      - decision_loss_rate_diff
      - recent_form_avg_fight_time_diff
      - recent_form_finish_rate_diff
      - total_rounds
      - title_fight
    label_sources:
      - method
      - finish_round
      - match_time_sec
      - total_rounds

  rounds:
    future_layer: props
    recommended_model_bundle: models/props/UFC_PROP_ROUNDS_V1
    candidate_sources:
      - avg_fight_time_diff
      - finish_rate_diff
      - finish_loss_rate_diff
      - recent_form_avg_fight_time_diff
      - recent_form_finish_rate_diff
      - total_rounds
      - title_fight
    label_sources:
      - finish_round
      - match_time_sec
      - total_rounds

validation_rules:
  - full_rolling_feature_inventory_must_have_483_columns
  - current_moneyline_v5_feature_count_must_equal_124
  - every_current_moneyline_v5_feature_must_remain_available
  - raw_red_blue_corner_columns_must_not_enter_moneyline_v5_directly
  - result_fields_must_not_enter_live_prediction_inputs
  - no_feature_family_may_be_removed_without_explicit_approval
  - feature_splits_must_be_lossless

migration_guidance:
  recommended_order:
    - preserve_current_rolling_artifact
    - preserve_current_moneyline_v5_contract
    - build_base_feature_builder
    - build_moneyline_feature_view
    - validate_moneyline_v5_parity
    - migrate_training_notebook_to_modules
    - migrate_backtest_notebook_to_modules
    - add_prop_label_builder
    - add_prop_feature_views

notes:
  - This registry is the first ownership map; it should evolve as feature builders become code.
  - It does not replace the full inventory. The full inventory remains the source of truth for individual columns.
  - If a feature appears useful for both moneyline and props, keep its base source in the base layer and expose market-specific views separately.
