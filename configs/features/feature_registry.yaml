registry_name: ufc_master_feature_registry
version: 6
status: current_moneyline_v5_plus_style_scores

source_files:
  full_inventory: configs/features/full_rolling_feature_inventory.yaml
  moneyline_v5_contract: configs/features/current_moneyline_v5_features.yaml
  rolling_preservation_contract: configs/features/rolling_feature_preservation_contract.yaml
  bundle_registry: configs/features/feature_bundles.yaml

schema_contracts:
  rolling_feature_store:
    artifact: data/features/UFC_enhanced_rolling_features_EWM.parquet
    expected_columns: 495
    preservation_rule: all_columns_preserved_or_explicitly_deprecated
  current_moneyline_v5:
    expected_features: 124
    selection_rule: all_columns_ending_in_diff_plus_registered_engineered_features
    protected: true

feature_definition_generation:
  current_moneyline_v5:
    enabled: true
    contract_path: configs/features/current_moneyline_v5_features.yaml
    generated_feature_count: 124
    families:
      career_differentials: true
      ewm_differentials: true
      recent_form_differentials: true
      engineered_moneyline_matchup_features: true

allowed_formula_functions:
  - abs
  - min
  - max
  - clip
  - log
  - sqrt
  - where

feature_definitions:
  testfeature:
    label: THIS IS A TEST FEATURE
    type: transform
    status: draft
    family: custom
    description: Test feature to check model workflow
    inputs:
      - r_pre_sapm
      - b_pre_sapm
    leakage_safe: true
    transform: absolute_gap
    source_columns:
      - testfeature_gap
    output_column: testfeature
    model_input_allowed: true

  combined_finish_rate:
    label: Combined Finish Rate
    type: transform
    status: active
    family: goes_distance_core_v1
    description: Sum of both fighters' point-in-time finish win rates.
    inputs:
      - r_pre_finish_rate
      - b_pre_finish_rate
    leakage_safe: true
    transform: pair_sum
    source_columns:
      - finish_rate
    output_column: combined_finish_rate
    model_input_allowed: true

  combined_finish_loss_rate:
    label: Combined Finish Loss Rate
    type: transform
    status: active
    family: goes_distance_core_v1
    description: Sum of both fighters' point-in-time finish loss rates.
    inputs:
      - r_pre_finish_loss_rate
      - b_pre_finish_loss_rate
    leakage_safe: true
    transform: pair_sum
    source_columns:
      - finish_loss_rate
    output_column: combined_finish_loss_rate
    model_input_allowed: true

  combined_finish_pressure:
    label: Combined Finish Pressure
    type: formula
    status: active
    family: goes_distance_core_v1
    description: Combined finishing ability plus combined finish vulnerability.
    inputs:
      - combined_finish_rate
      - combined_finish_loss_rate
    formula: combined_finish_rate + combined_finish_loss_rate
    output_column: combined_finish_pressure
    model_input_allowed: true
    leakage_safe: true

  combined_avg_fight_time:
    label: Combined Average Fight Time
    type: transform
    status: active
    family: goes_distance_core_v1
    description: Average of both fighters' point-in-time average fight duration.
    inputs:
      - r_pre_avg_fight_time
      - b_pre_avg_fight_time
    leakage_safe: true
    transform: pair_average
    source_columns:
      - avg_fight_time
    output_column: combined_avg_fight_time
    model_input_allowed: true

  combined_ewm_finish_rate:
    label: Combined EWM Finish Rate
    type: transform
    status: active
    family: goes_distance_core_v1
    description: Sum of both fighters' EWM finish rates.
    inputs:
      - r_ewm_finish_rate
      - b_ewm_finish_rate
    leakage_safe: true
    transform: pair_sum
    source_columns:
      - ewm_finish_rate
    output_column: combined_ewm_finish_rate
    model_input_allowed: true

  combined_ewm_finish_loss_rate:
    label: Combined EWM Finish Loss Rate
    type: transform
    status: active
    family: goes_distance_core_v1
    description: Sum of both fighters' EWM finish loss rates.
    inputs:
      - r_ewm_finish_loss_rate
      - b_ewm_finish_loss_rate
    leakage_safe: true
    transform: pair_sum
    source_columns:
      - ewm_finish_loss_rate
    output_column: combined_ewm_finish_loss_rate
    model_input_allowed: true

  combined_ewm_finish_pressure:
    label: Combined EWM Finish Pressure
    type: formula
    status: active
    family: goes_distance_core_v1
    description: Recent weighted finishing ability plus recent weighted finish vulnerability.
    inputs:
      - combined_ewm_finish_rate
      - combined_ewm_finish_loss_rate
    formula: combined_ewm_finish_rate + combined_ewm_finish_loss_rate
    output_column: combined_ewm_finish_pressure
    model_input_allowed: true
    leakage_safe: true

  combined_ewm_avg_fight_time:
    label: Combined EWM Average Fight Time
    type: transform
    status: active
    family: goes_distance_core_v1
    description: Average of both fighters' EWM average fight duration.
    inputs:
      - r_ewm_avg_fight_time
      - b_ewm_avg_fight_time
    leakage_safe: true
    transform: pair_average
    source_columns:
      - ewm_avg_fight_time
    output_column: combined_ewm_avg_fight_time
    model_input_allowed: true

  older_fighter_age:
    label: Older Fighter Age
    type: transform
    status: active
    family: goes_distance_core_v1
    description: Age of the older fighter in the matchup.
    inputs:
      - r_pre_age
      - b_pre_age
    leakage_safe: true
    transform: pair_max
    source_columns:
      - age
    output_column: older_fighter_age
    model_input_allowed: true

  reach_mismatch_abs:
    label: Absolute Reach Mismatch
    type: transform
    status: active
    family: goes_distance_core_v1
    description: Absolute reach difference between fighters.
    inputs:
      - r_pre_reach
      - b_pre_reach
    leakage_safe: true
    transform: absolute_gap
    source_columns:
      - reach
    output_column: reach_mismatch_abs
    model_input_allowed: true

  height_mismatch_abs:
    label: Absolute Height Mismatch
    type: transform
    status: active
    family: goes_distance_core_v1
    description: Absolute height difference between fighters.
    inputs:
      - r_pre_height
      - b_pre_height
    leakage_safe: true
    transform: absolute_gap
    source_columns:
      - height
    output_column: height_mismatch_abs
    model_input_allowed: true

  combined_career_ko_losses:
    label: Combined Career KO Losses
    type: formula
    status: active
    family: ko_loss_vulnerability
    description: Total point-in-time career KO/TKO losses across both fighters.
    inputs:
      - r_pre_career_ko_losses
      - b_pre_career_ko_losses
    formula: r_pre_career_ko_losses + b_pre_career_ko_losses
    output_column: combined_career_ko_losses
    model_input_allowed: true
    leakage_safe: true

  combined_recent_ko_losses_3:
    label: Combined Recent KO Losses 3
    type: formula
    status: active
    family: ko_loss_vulnerability
    description: Total KO/TKO losses across both fighters over their last three fights.
    inputs:
      - r_pre_recent_ko_losses_3
      - b_pre_recent_ko_losses_3
    formula: r_pre_recent_ko_losses_3 + b_pre_recent_ko_losses_3
    output_column: combined_recent_ko_losses_3
    model_input_allowed: true
    leakage_safe: true

  ko_recovery_gap:
    label: KO Recovery Gap
    type: formula
    status: active
    family: ko_loss_vulnerability
    description: Absolute gap in days since each fighter's last KO/TKO loss.
    inputs:
      - days_since_last_ko_loss_diff
    formula: abs(days_since_last_ko_loss_diff)
    output_column: ko_recovery_gap
    model_input_allowed: true
    leakage_safe: true

  max_career_ko_losses:
    label: Max Career KO Losses
    type: formula
    status: active
    family: ko_loss_vulnerability
    description: Higher point-in-time career KO/TKO loss count between the two fighters.
    inputs:
      - r_pre_career_ko_losses
      - b_pre_career_ko_losses
    formula: max(r_pre_career_ko_losses, b_pre_career_ko_losses)
    output_column: max_career_ko_losses
    model_input_allowed: true
    leakage_safe: true

  older_fighter_career_ko_losses:
    label: Older Fighter Career KO Losses
    type: formula
    status: active
    family: ko_loss_vulnerability
    description: Career KO/TKO loss count for the older fighter in the matchup.
    inputs:
      - r_pre_age
      - b_pre_age
      - r_pre_career_ko_losses
      - b_pre_career_ko_losses
    formula: where(r_pre_age >= b_pre_age, r_pre_career_ko_losses, b_pre_career_ko_losses)
    output_column: older_fighter_career_ko_losses
    model_input_allowed: true
    leakage_safe: true

  age_x_career_ko_losses_diff:
    label: Age x Career KO Loss Diff
    type: formula
    status: active
    family: ko_loss_vulnerability
    description: Red-minus-blue age interaction with career KO/TKO loss accumulation.
    inputs:
      - r_pre_age
      - b_pre_age
      - r_pre_career_ko_losses
      - b_pre_career_ko_losses
    formula: (r_pre_age * r_pre_career_ko_losses) - (b_pre_age * b_pre_career_ko_losses)
    output_column: age_x_career_ko_losses_diff
    model_input_allowed: true
    leakage_safe: true

feature_layers:
  metadata:
    description: Non-model identifiers, event context, fight context, and join keys.
    model_input_allowed: false
    preservation_status: protected
  target_result:
    description: Historical outcome labels and result fields. Allowed for training/backtesting labels but never live model inputs.
    model_input_allowed: false
    preservation_status: protected
  base:
    description: Reusable point-in-time fighter and fight state.
    model_input_allowed: conditionally_via_market_views
    preservation_status: protected
  moneyline:
    description: Symmetry-safe winner-prediction features.
    model_input_allowed: true
    preservation_status: protected
    current_v5_expected_feature_count: 124
  props:
    description: Future market-specific prop features and prop labels.
    model_input_allowed: true
    preservation_status: future_expansion

feature_families:
  career_differentials:
    layer: moneyline
    model_input_allowed: true
    ownership: pipeline.features.moneyline
    current_moneyline_v5: included
  ewm_differentials:
    layer: moneyline
    model_input_allowed: true
    ownership: pipeline.features.moneyline
    current_moneyline_v5: included
  recent_form_differentials:
    layer: moneyline
    model_input_allowed: true
    ownership: pipeline.features.moneyline
    current_moneyline_v5: included
  engineered_moneyline_matchup_features:
    layer: moneyline
    model_input_allowed: true
    ownership: pipeline.features.moneyline / feature_engineering
    current_moneyline_v5: included
  style_scores_v1:
    layer: moneyline
    model_input_allowed: true
    ownership: pipeline.features.raw_fighter_features.style_scores / pipeline.features.run_build_feature_view
    current_moneyline_v5: false
    description: Continuous k5 fighter-style scores, score gaps, and persistent style matchup edge features.
  ko_loss_vulnerability:
    layer: moneyline
    model_input_allowed: true
    ownership: model_lab / feature_registry
    current_moneyline_v5: false
  goes_distance_core_v1:
    layer: props
    model_input_allowed: true
    ownership: model_lab / prop_features
    current_moneyline_v5: false
  custom:
    layer: moneyline
    model_input_allowed: true
    ownership: model_lab
    current_moneyline_v5: false

validation_rules:
  - full_rolling_feature_inventory_must_have_495_columns
  - current_moneyline_v5_feature_count_must_equal_124
  - every_current_moneyline_v5_feature_must_remain_available
  - raw_red_blue_corner_columns_must_not_enter_moneyline_v5_directly
  - result_fields_must_not_enter_live_prediction_inputs
  - no_feature_family_may_be_removed_without_explicit_approval
  - feature_splits_must_be_lossless
  - bundle_definitions_must_remain_separate_from_feature_families

notes:
  - This registry is the feature-definition and ownership source of truth.
  - Current V5 feature definitions are generated from configs/features/current_moneyline_v5_features.yaml at load time.
  - Bundles remain separate from families and are defined in configs/features/feature_bundles.yaml.
  - Feature Studio is a UI over this registry, not a separate data structure.
