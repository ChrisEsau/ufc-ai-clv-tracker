    - recent_td_avg_diff
    - sapm_diff
    - splm_diff
    - str_acc_diff
    - win_pct_diff
    - wins_diff
    - worst_loss_elo_diff
    - testfeature
    - age_squared_diff
    - experience_ratio_diff
    - finish_volatility
    - height_diff
    - reach_striking_combo
    - striking_edge
    - ewm_elo_diff
