registry_name: ufc_feature_bundles
version: 4
status: draft_contract
bundle_rules:
  model_inputs_are_selected_in_model_config: true
  bundles_define_candidate_feature_families: true
  feature_views_may_include_multiple_bundles: true
  transforms_are_applied_after_raw_bundle_selection: true
bundles:
  core_state:
    description: Core point-in-time fighter quality and record state.
    source_layer: fighter_state
    candidate_columns:
    - elo
    - fights
    - wins
    - losses
    - win_pct
    - avg_opponent_elo
    - best_win_elo
    - worst_loss_elo
    - win_streak
    - loss_streak
    - days_since_last_fight
    recommended_transforms:
    - red_minus_blue
    - absolute_gap
    markets:
    - moneyline
    - props
  striking:
    description: Standup volume, efficiency, defense, and damage indicators.
    source_layer: fighter_state
    candidate_columns:
    - kd_avg
    - kd_absorbed_avg
    - splm
    - sapm
    - str_acc
    - str_def
    recommended_transforms:
    - red_minus_blue
    - ratio
    - absolute_gap
    markets:
    - moneyline
    - ko_tko
    - decision
  grappling:
    description: Takedown, control, and submission activity indicators.
    source_layer: fighter_state
    candidate_columns:
    - td_avg
    - td_acc
    - td_def
    - sub_avg
    - ctrl_per_min
    - ctrl_against_per_min
    recommended_transforms:
    - red_minus_blue
    - ratio
    - absolute_gap
    markets:
    - moneyline
    - submission
    - decision
  finish_profile:
    description: Finish and method tendency state.
    source_layer: fighter_state
    candidate_columns:
    - finish_rate
    - ko_rate
    - sub_win_rate
    - decision_win_rate
    - finish_loss_rate
    - decision_loss_rate
    - avg_fight_time
    recommended_transforms:
    - red_minus_blue
    - absolute_gap
    markets:
    - moneyline
    - ko_tko
    - submission
    - decision
    - goes_distance
    - rounds
  style_scores_v1:
    label: Style Scores V1
    description: Continuous k5 fighter-style scores and persistent style matchup edge features.
    source_layer: fighter_state_plus_engineered
    candidate_columns:
    - style_control_wrestler_score_diff
    - style_ko_finisher_score_diff
    - style_submission_grappler_score_diff
    - style_decision_technician_score_diff
    - style_all_round_finisher_score_diff
    - style_control_wrestler_score_abs_diff
    - style_ko_finisher_score_abs_diff
    - style_submission_grappler_score_abs_diff
    - style_decision_technician_score_abs_diff
    - style_all_round_finisher_score_abs_diff
    - style_edge_ko_finisher_vs_decision_technician
    - style_edge_ko_finisher_vs_decision_technician_reverse
    - style_edge_ko_finisher_vs_decision_technician_net
    - style_edge_decision_technician_vs_submission_grappler
    - style_edge_decision_technician_vs_submission_grappler_reverse
    - style_edge_decision_technician_vs_submission_grappler_net
    - style_edge_control_wrestler_vs_ko_finisher
    - style_edge_control_wrestler_vs_ko_finisher_reverse
    - style_edge_control_wrestler_vs_ko_finisher_net
    recommended_transforms: []
    markets:
    - moneyline
  ko_loss_vulnerability:
    label: KO Loss Vulnerability
    description: KO/TKO loss accumulation, recent KO-loss exposure, recovery timing, and age interaction state.
    source_layer: fighter_state_plus_engineered
    candidate_columns:
    - career_ko_losses_diff
    - recent_ko_losses_3_diff
    - last_fight_ko_loss_diff
    - days_since_last_ko_loss_diff
    - combined_career_ko_losses
    - combined_recent_ko_losses_3
    - ko_recovery_gap
    - max_career_ko_losses
    - older_fighter_career_ko_losses
    - age_x_career_ko_losses_diff
    recommended_transforms:
    - red_minus_blue
    - absolute_gap
    markets:
    - moneyline
    - ko_tko
  ewm_state:
    description: Exponentially weighted fighter-state signals.
    source_layer: fighter_state
    source_prefix: ewm_
    candidate_columns:
    - elo
    - fights
    - wins
    - losses
    - win_pct
    - kd_avg
    - kd_absorbed_avg
    - splm
    - sapm
    - str_acc
    - str_def
    - td_avg
    - td_acc
    - td_def
    - sub_avg
    - ctrl_per_min
    - ctrl_against_per_min
    - finish_rate
    - ko_rate
    - sub_win_rate
    - decision_win_rate
    - finish_loss_rate
    - decision_loss_rate
    - avg_opponent_elo
    - best_win_elo
    - worst_loss_elo
    - avg_fight_time
    - win_streak
    - loss_streak
    - days_since_last_fight
    - recent_win_pct
    - recent_splm
    - recent_sapm
    - recent_td_avg
    - recent_finish_rate
    - recent_avg_fight_time
    recommended_transforms:
    - red_minus_blue
    markets:
    - moneyline
    - props
  physical:
    description: Physical matchup characteristics.
    source_layer: prepared_fights
    candidate_columns:
    - age
    - height
    - reach
    - weight
    recommended_transforms:
    - red_minus_blue
    - ratio
    - absolute_gap
    markets:
    - moneyline
    - props
  engineered_matchup:
    description: Existing V5 engineered matchup features plus competition-adjusted interaction features.
    source_layer: engineered
    candidate_columns:
    - age_diff
    - height_diff
    - reach_diff
    - weight_diff
    - striking_edge
    - grappling_edge
    - finish_volatility
    - wrestling_pressure_vs_defense
    - reach_striking_combo
    - chin_risk_diff
    - experience_ratio_diff
    - aggression_index_diff
    - age_squared_diff
    - pressure_striking_adv_diff
    - wrestling_mismatch_diff
    - submission_mismatch_diff
    - striking_edge_x_avg_opp_elo
    - striking_edge_x_ewm_avg_opp_elo
    - grappling_edge_x_avg_opp_elo
    - grappling_edge_x_ewm_avg_opp_elo
    - wrestling_mismatch_x_avg_opp_elo
    - submission_mismatch_x_avg_opp_elo
    recommended_transforms: []
    markets:
    - moneyline
    - props
  market_odds:
    description: Timestamped market information for market-aware models. Must be point-in-time only.
    source_layer: market
    candidate_columns:
    - opening_implied_prob
    - current_implied_prob
    - closing_implied_prob
    - line_move
    - book_count
    - best_price
    - market_spread
