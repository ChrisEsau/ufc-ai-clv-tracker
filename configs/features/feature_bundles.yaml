registry_name: ufc_feature_bundles
version: 2
status: draft_contract
bundle_rules:
  model_inputs_are_selected_in_model_config: true
  bundles_define_candidate_feature_families: true
  feature_views_may_include_multiple_bundles: true
  transforms_are_applied_after_raw_bundle_selection: true
bundles:
  core_state:
    description: Core point-in-time fighter quality and record state.
    source_layer: fighter_state
    candidate_columns:
    - elo
    - fights
    - wins
    - losses
    - win_pct
    - avg_opponent_elo
    - best_win_elo
    - worst_loss_elo
    - win_streak
    - loss_streak
    - days_since_last_fight
    recommended_transforms:
    - red_minus_blue
    - absolute_gap
    markets:
    - moneyline
    - props
  striking:
    description: Standup volume, efficiency, defense, and damage indicators.
    source_layer: fighter_state
    candidate_columns:
    - kd_avg
    - kd_absorbed_avg
    - splm
    - sapm
    - str_acc
    - str_def
    recommended_transforms:
    - red_minus_blue
    - ratio
    - absolute_gap
    markets:
    - moneyline
    - ko_tko
    - decision
  grappling:
    description: Takedown, control, and submission activity indicators.
    source_layer: fighter_state
    candidate_columns:
    - td_avg
    - td_acc
    - td_def
    - sub_avg
    - ctrl_per_min
    - ctrl_against_per_min
    recommended_transforms:
    - red_minus_blue
    - ratio
    - absolute_gap
    markets:
    - moneyline
    - submission
    - decision
  finish_profile:
    description: Finish and method tendency state.
    source_layer: fighter_state
    candidate_columns:
    - finish_rate
    - ko_rate
    - sub_win_rate
    - decision_win_rate
    - finish_loss_rate
    - decision_loss_rate
    - avg_fight_time
    recommended_transforms:
    - red_minus_blue
    - absolute_gap
    markets:
    - moneyline
    - ko_tko
    - submission
    - decision
    - goes_distance
    - rounds
  ko_loss_vulnerability:
    label: KO Loss Vulnerability
    description: KO/TKO loss accumulation, recent KO-loss exposure, recovery timing, and age interaction state.
    source_layer: fighter_state_plus_engineered
    candidate_columns:
    - career_ko_losses_diff
    - recent_ko_losses_3_diff
    - last_fight_ko_loss_diff
    - days_since_last_ko_loss_diff
    - combined_career_ko_losses
    - combined_recent_ko_losses_3
    - ko_recovery_gap
    - max_career_ko_losses
    - older_fighter_career_ko_losses
    - age_x_career_ko_losses_diff
    recommended_transforms:
    - red_minus_blue
    - absolute_gap
    markets:
    - moneyline
    - ko_tko
  ewm_state:
    description: Exponentially weighted fighter-state signals.
    source_layer: fighter_state
    source_prefix: ewm_
    candidate_columns:
    - elo
    - fights
    - wins
    - losses
    - win_pct
    - kd_avg
    - kd_absorbed_avg
    - splm
    - sapm
    - str_acc
    - str_def
    - td_avg
    - td_acc
    - td_def
    - sub_avg
    - ctrl_per_min
    - ctrl_against_per_min
    - finish_rate
    - ko_rate
    - sub_win_rate
    - decision_win_rate
    - finish_loss_rate
    - decision_loss_rate
    - avg_opponent_elo
    - best_win_elo
    - worst_loss_elo
    - avg_fight_time
    - win_streak
    - loss_streak
    - days_since_last_fight
    - recent_win_pct
    - recent_splm
    - recent_sapm
    - recent_td_avg
    - recent_finish_rate
    - recent_avg_fight_time
    recommended_transforms:
    - red_minus_blue
    markets:
    - moneyline
    - props
  physical:
    description: Physical matchup characteristics.
    source_layer: prepared_fights
    candidate_columns:
    - age
    - height
    - reach
    - weight
    recommended_transforms:
    - red_minus_blue
    - ratio
    - absolute_gap
    markets:
    - moneyline
    - props
  engineered_matchup:
    description: Existing V5 engineered matchup features plus competition-adjusted
      interaction features.
    source_layer: engineered
    candidate_columns:
    - age_diff
    - height_diff
    - reach_diff
    - weight_diff
    - striking_edge
    - grappling_edge
    - finish_volatility
    - wrestling_pressure_vs_defense
    - reach_striking_combo
    - chin_risk_diff
    - experience_ratio_diff
    - aggression_index_diff
    - age_squared_diff
    - pressure_striking_adv_diff
    - wrestling_mismatch_diff
    - submission_mismatch_diff
    - striking_edge_x_avg_opp_elo
    - striking_edge_x_ewm_avg_opp_elo
    - grappling_edge_x_avg_opp_elo
    - grappling_edge_x_ewm_avg_opp_elo
    - wrestling_mismatch_x_avg_opp_elo
    - submission_mismatch_x_avg_opp_elo
    recommended_transforms: []
    markets:
    - moneyline
    - props
  market_odds:
    description: Timestamped market information for market-aware models. Must be point-in-time
      only.
    source_layer: market
    candidate_columns:
    - opening_implied_prob
    - current_implied_prob
    - closing_implied_prob
    - line_move
    - book_count
    - best_price
    - market_spread
    recommended_transforms:
    - market_gap
    - absolute_gap
  test_bundle:
    description: This is a test
    candidate_columns:
    - avg_fight_time_diff
    - ctrl_against_per_min_diff
    - decision_loss_rate_diff
    - elo_diff
    - fights_diff
    - kd_absorbed_avg_diff
    - kd_avg_diff
    - loss_streak_diff
    - losses_diff
    - recent_finish_rate_diff
    - recent_td_avg_diff
    - sapm_diff
    - splm_diff
    - str_acc_diff
    - win_pct_diff
    - wins_diff
    - worst_loss_elo_diff
    - testfeature
    - age_squared_diff
    - experience_ratio_diff
    - finish_volatility
    - height_diff
    - reach_striking_combo
    - striking_edge
    - ewm_elo_diff
    - ewm_finish_rate_diff
    - ewm_recent_sapm_diff
    - ewm_str_acc_diff
    - ewm_sub_avg_diff
    - ewm_td_avg_diff
    - recent_form_loss_streak_diff
    - recent_form_losses_diff
    - recent_form_recent_finish_rate_diff
    - recent_form_splm_diff
    - recent_form_td_avg_diff
    - recent_form_win_streak_diff
    - recent_form_wins_diff
    - recent_form_worst_loss_elo_diff
    markets:
    - moneyline
  goes_distance_core_v1:
    description: Core V1 Goes Distance features built from finish tendency, fight
      duration, durability, and physical mismatch signals.
    candidate_columns:
    - combined_finish_rate
    - combined_finish_loss_rate
    - combined_finish_pressure
    - combined_avg_fight_time
    - combined_ewm_finish_rate
    - combined_ewm_finish_loss_rate
    - combined_ewm_finish_pressure
    - combined_ewm_avg_fight_time
    - older_fighter_age
    - reach_mismatch_abs
    - height_mismatch_abs
    markets:
    - goes_distance
    - props
