    - win_method_entropy_abs_diff
    - finish_dependency_diff
    - finish_dependency_abs_diff
    - decision_dependency_diff
    - decision_dependency_abs_diff
    - ko_dependency_diff
    - ko_dependency_abs_diff
    - ko_win_concentration_diff
    - submission_dependency_diff
    - submission_dependency_abs_diff
    - submission_win_concentration_diff
    - style_flexibility_score_diff
    - style_flexibility_score_abs_diff
    markets:
    - moneyline
    - props
