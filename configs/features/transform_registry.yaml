# UFC Transform Registry
#
# Purpose:
#   Defines reusable transform plugins that convert raw fighter, market, and
#   archetype features into model-ready features.

registry_name: ufc_transform_registry
version: 2
status: plugin_contract

plugin_contract:
  required_function: apply
  signature: "apply(red: Series, blue: Series, context: dict | None = None) -> Series"
  add_new_transform_steps:
    - create a plugin module under pipeline/features/transforms/
    - expose an apply function
    - register plugin/module/function here
    - reference the transform ID in a feature-view config

transforms:

  red_minus_blue:
    description: Red feature minus blue feature.
    output_suffix: diff
    output_example: elo_diff
    plugin: pipeline.features.transforms.red_minus_blue
    function: apply
    status: active

  blue_minus_red:
    description: Blue feature minus red feature.
    output_suffix: reverse_diff
    output_example: elo_reverse_diff
    plugin: pipeline.features.transforms.blue_minus_red
    function: apply
    status: active

  ratio:
    description: Red divided by blue using safe denominator handling.
    output_suffix: ratio
    output_example: splm_ratio
    plugin: pipeline.features.transforms.ratio
    function: apply
    status: active

  absolute_gap:
    description: Absolute difference between red and blue values.
    output_suffix: abs_gap
    output_example: elo_abs_gap
    plugin: pipeline.features.transforms.absolute_gap
    function: apply
    status: active

  interaction:
    description: Multiplicative interaction between two or more features.
    output_suffix: interaction
    output_example: elo_x_splm
    plugin: null
    function: null
    status: planned

  percentile:
    description: Percentile rank within historical population.
    output_suffix: percentile
    plugin: null
    function: null
    status: planned

  zscore:
    description: Standardized score using historical distribution.
    output_suffix: zscore
    plugin: null
    function: null
    status: planned

  style_matchup:
    description: Style interaction transform used for archetype systems.
    output_suffix: style_matchup
    output_example: striker_vs_grappler
    plugin: null
    function: null
    status: planned

  market_gap:
    description: Difference between model probability and market probability.
    output_suffix: market_gap
    output_example: model_market_gap
    plugin: null
    function: null
    status: planned

transform_rules:
  transforms_should_be_reusable_across_markets: true
  transforms_should_not_be_duplicated_in_feature_views: true
  feature_views_should_select_transforms_not_reimplement_them: true
  model_configs_should_select_final_columns_not_define_transforms: true
  generic_builder_must_load_transforms_from_registry: true
